<!doctype html>
<meta charset="utf-8">
<title>ATONAL · Studio — SVG to 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Same visual language as viewer.html: mono type, near-black ground, hairline borders,
     uppercase micro-labels. Nothing here restyles the existing viewer. */
  :root{--mono:ui-monospace,"SF Mono",Menlo,monospace;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050506;overflow:hidden;font-family:var(--mono);color:#e6e6e4}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}

  #panels{position:fixed;top:0;right:0;bottom:0;width:286px;z-index:11;overflow-y:auto;
    padding:14px 14px 60px;background:rgba(10,10,13,.82);backdrop-filter:blur(14px);
    border-left:1px solid rgba(255,255,255,.10);scrollbar-width:thin}
  body.collapsed #panels{display:none}
  #panels::-webkit-scrollbar{width:7px} #panels::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}

  .sec{margin-bottom:9px}
  .sec-h{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;
    border-bottom:1px solid rgba(255,255,255,.10);color:#8a8b91;font:inherit;font-size:9px;letter-spacing:.18em;
    text-transform:uppercase;padding:7px 2px;cursor:pointer}
  .sec-h:hover{color:#e6e6e4}
  .sec-h i{font-style:normal;opacity:.6}
  .sec-b{padding:8px 2px 4px;display:flex;flex-direction:column;gap:6px}

  .row{display:flex;align-items:center;gap:8px}
  .row.wrap{flex-wrap:wrap}
  .row label{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#8a8b91;flex:0 0 84px}
  .row .val{font-size:9px;color:#cfcfd4;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:rgba(255,255,255,.16);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:#c8b8ff;cursor:pointer;border:0}
  select{flex:1;background:rgba(14,14,17,.9);color:#e6e6e4;border:1px solid rgba(255,255,255,.18);
    border-radius:3px;padding:4px 7px;font:inherit;font-size:10px}
  input[type=color]{width:26px;height:22px;padding:0;border:1px solid rgba(255,255,255,.22);
    border-radius:3px;background:transparent;cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  input[type=color]::-webkit-color-swatch{border:0;border-radius:2px}

  button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:3px;
    color:#e6e6e4;padding:6px 11px;font:inherit;font-size:9px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  button:hover{background:rgba(255,255,255,.12)}
  .btns{display:flex;flex-wrap:wrap;gap:5px;flex:1}
  button.mini{padding:5px 8px;font-size:8.5px}
  button.tog{min-width:52px} button.tog.on{background:rgba(200,184,255,.22);border-color:rgba(200,184,255,.5);color:#e8e0ff}

  #topbar{position:fixed;top:16px;left:20px;z-index:12;display:flex;gap:10px;align-items:center}
  #brand{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#8a8b91}
  #brand b{color:#fff;font-weight:400}
  #file,#hdr,#bgimg,#audio{display:none}

  #stat{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:13;padding:8px 16px;
    background:rgba(14,14,17,.88);border:1px solid rgba(255,255,255,.12);border-radius:3px;font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;color:#cfcfd4;display:none;backdrop-filter:blur(12px)}
  #stat.err{color:#ffb4b4}

  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:10px;z-index:9;pointer-events:none;text-align:center;padding:0 40px}
  #boot h2{margin:0;font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:#8a8b91}
  #boot p{margin:0;font-size:10px;letter-spacing:.14em;color:#5a5a5d;text-transform:uppercase}
  #boot.err h2{color:#ffb4b4}
</style>

<canvas id="gl"></canvas>

<div id="topbar">
  <span id="brand">ATONAL · <b>Studio</b></span>
  <button id="toggle">Hide</button>
</div>

<div id="stat"></div>
<div id="boot"><h2>SVG → 3D</h2><p>Drop an SVG anywhere · drop a track to make it react</p></div>
<input id="file" type="file" accept=".svg,image/svg+xml">
<input id="hdr" type="file" accept=".hdr">
<input id="bgimg" type="file" accept="image/*">
<input id="audio" type="file" accept="audio/*">
<div id="panels"></div>

<!-- Import map so the vendored addons can resolve their bare 'three' specifier without a
     bundler. This is why no build step is needed. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<script type="module" src="./studio/app.js"></script>
