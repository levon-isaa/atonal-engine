  // the beat breathes the flow forward — motion on the downbeat, not just colour
  float tt=u_time*(0.020+u_arousal*0.055)+u_pulse*0.045+u_bLow*0.03;
  vec2 w1=vec2(fbm(vec3(uv*1.20, tt)), fbm(vec3(uv*1.20+11.7, tt)));
  float f=fbm(vec3(uv*1.60+w1*2.6, tt*0.75));
  // RIDGED fold. Reflecting the field about its midpoint (1-|2f-1|) turns smooth blobs into thin
  // bright filaments — the striations you get when two liquids are stirred but not mixed. Real
  // fluid reads as sheets and threads, not clouds, and this is the cheapest way to get them: it
  // is a fold of a sample already taken, so it costs no extra fbm.
  float ridge=1.0-abs(2.0*clamp(f,0.,1.)-1.0);
  ridge*=ridge;                                          // sharpen the threads
  // shear the filaments along the warp so they stretch the way advected ink does rather than
  // sitting isotropic
  float fil=ridge*(0.55+0.45*clamp(w1.y*1.6,0.,1.));
  f=clamp(f*1.8+0.14,0.,1.);
  // ---- EMOTION COLOUR. A two-stop lerp can only express ONE hue axis, which is why this still
  // read as a flat tint however hard the fluid churned. Four stops let the field travel
  // deep -> cool -> accent -> hot, so one frame carries several hues at once and the boundaries
  // between them become the gradients. Every stop is derived from the section palette, so the
  // backdrop still agrees with the duotone inks.
  vec3 c0=mix(A*0.60, vec3(0.05,0.05,0.11), u_darkness*0.55);           // deep shadow
  vec3 c1=mix(mix(vec3(0.16,0.32,0.74),vec3(0.44,0.16,0.64),u_tension), A, 0.42);
  vec3 c2=B;                                                            // palette accent
  vec3 c3=mix(vec3(1.00,0.74,0.42), mix(B,vec3(1.0),0.42), 0.55);       // hot highlight
  // A LARGE-SCALE sweep underneath the fluid detail, so the frame reads as one big movement of
  // colour with turbulence inside it rather than as uniform noise. w1 is REUSED here — this
  // costs no extra fbm, it just spends samples already taken on a second job.
  float g=clamp(0.5+0.62*(sv.x*0.55+sv.y*0.62)+(w1.x-0.5)*0.85, 0., 1.);
  // valence slides the whole field along the ramp: a dark track sits at the deep/cool end, a
  // bright one pushes up into accent and highlight
  // the filaments ride the ramp too, so a thread reads as a DIFFERENT colour rather than just a
  // brighter patch of the same one — that hue separation is what makes it look like two fluids
  float rt=clamp(f*0.62+g*0.40+fil*0.30+(u_valence-0.5)*0.34+u_epic*0.10, 0., 1.);
  vec3 ink=ramp4(c0,c1,c2,c3,rt);
  // The sweep used to be ~86% white — a product-shot cyclorama. That white was the real ceiling
  // on colour here: whatever the ramp produced could only ever tint it pale. Pulled down so the
  // backdrop is a colourway in its own right and the ramp reads as colour rather than as a wash.
  // With the ground plane gone the background IS the whole frame, so the sweep can no longer
  // hedge toward white to stay a product-shot cyclorama — there is nothing left for the form to
  // sit on, and a near-white lower half just reads as empty. Both ends pulled deep into the
  // colourway.
  vec3 lo=mix(vec3(0.72), B, 0.56+u_tension*0.24);         // toward the horizon
  vec3 hi=mix(vec3(0.30), B, 0.62+u_tension*0.26);         // deeper up top
  vec3 col=mix(lo,hi,smoothstep(0.48,1.0,h));
  // the fluid rides ON the sweep rather than replacing it: a studio backdrop that MOVES, not a
  // noise texture pasted behind the subject. Weighted to stay legible at IDLE too — at the flat
  // default curves (arousal .3, tension .2) the emotion terms contribute almost nothing, so a
  // mix driven purely by them reads as no effect at all until a track is actually playing.
  col=mix(col, ink, (0.70+u_tension*0.24+u_epic*0.16)*(0.50+0.50*f));
  // AURA — a pool of the section's own mood sitting directly behind the subject, breathing on
  // the low band. This is the piece that makes the backdrop read as belonging to the FORM: it
  // is anchored to where the form actually is on screen, not to the frame, and it carries the
  // same colour the material is picking up from u_mood.
  float aur=exp(-dot(sv,sv)*(2.6-u_bLow*1.0-u_energy*0.5));
  col=mix(col, mix(ink,u_mood,0.55), aur*(0.20+u_bLow*0.20+u_pulse*0.14));
  // air band lifts a fine sheen across the whole field — hats/shimmer read in the backdrop too
  col+=vec3(0.9,0.95,1.0)*f*u_bAir*0.05;
  col*=mix(1.0,0.76,smoothstep(0.20,1.05,length(sv)));     // soft falloff into the corners
  col*=1.0-u_darkness*0.22;
  // VIBRANCE — pushes chroma while holding luminance, so the field gets its intensity from
  // colour rather than from being blown brighter. Raising exposure instead would just wash the
  // whole frame toward white, which is the thing this is meant to get away from.
  float lm=dot(col,vec3(0.2126,0.7152,0.0722));
  col=max(mix(vec3(lm), col, 1.42), vec3(0.0));
  return col*(0.80+u_bgAmt*0.30);
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*u_res)/u_res.y;
  // DIAG 6/7: the detail map itself, screen-mapped, with no triplanar and no lighting in the way.
  // The only honest way to ask whether a structure is IN the map or is being made by the read.
  if(u_diag>5.5 && u_diag<7.5){
    // DIAG 6 shows the map ONE TEXEL PER PIXEL, which is the only view that can answer whether a
    // structure is in the map. Fitting a whole tile on screen minifies an 8192 map 10x and the
    // mip chain then shows a blurred average of exactly the detail in question.
    vec2 t6=u_diag>6.5 ? gl_FragCoord.xy/u_res.y
                       : gl_FragCoord.xy/float(textureSize(u_detail,0).x);
    vec4 s6=texture(u_detail,t6);
    vec4 sm6=textureLod(u_detail,t6,0.0);
    o=vec4(u_diag>6.5? vec3(s6.a) : sm6.xyz, 99.0); return;
  }
  float f=0.5/tan(u_fov*0.5);        // uv.y spans +/-0.5, so the 0.5 is required or the FOV halves
  vec3 rd=normalize(uv.x*u_rt+uv.y*u_up+f*u_fw), ro=u_ro;
  float dth=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453);
  /* THE MARCH IS BOUNDED BY THE FORM'S SPHERE, ANALYTICALLY. map() already skips empty space by
     returning a bounding-sphere distance out there, but the RAY still had to walk it: every
     background pixel sphere-traced from the camera out to t=18 before giving up, and the form
     covers about 16% of the canvas, so five pixels in six were paying for a march that could
     never hit anything.

     A ray/sphere test costs a dot product and a square root and answers both halves of that:
     rays that miss the bound skip the loop entirely, and rays that hit start at the sphere's
     ENTRY rather than at the near plane, so the empty run between camera and form is never
     stepped at all. The exit point replaces the t>18 cutoff, which also ends the march the
     instant a ray leaves the far side instead of letting it run on.

     calcSha has done exactly this for the light ray since it was rewritten; the primary ray
     never got the same treatment.

     MEASURED, with the one instrument here that has no timing noise in it -- the march step count
     itself, rendered to screen as DIAG 13 and averaged over the canvas, with u_nobound switching
     the bound off for a same-frame A/B:

       unbounded   mean 18.0 steps/px,  25.3% of pixels take zero steps
       bounded     mean  3.6 steps/px,  88.2% of pixels take zero steps      -80%

     Rays that DO hit are untouched: max steps is 90 either way.

     The radius comes from formScale() so it tracks the pulse, at 1.55 against the 1.45 the
     field's own early-out uses, plus a margin for the displacement. It does not clip: growing it
     by 0.5 and by 1.5 changes the result by 0.005% of pixels, so the bound is already clear of
     the form.

     NOT bit-identical, and it cannot be. 0.17% of pixels differ from the unbounded render,
     scattered across the whole silhouette. A bounded ray starts at the sphere instead of the near
     plane, so it takes a different step sequence and lands on a different residual inside the
     epsilon -- the same per-pixel variance this file already documents two comments down, which
     is what the three Newton steps exist to absorb. Neither version is the more correct one, and
     the two are indistinguishable on screen. */
  float mid=-1.;
  float bR=(1.55+u_bmarg)*formScale()+0.10;
  float bb=dot(ro,rd), bc=dot(ro,ro)-bR*bR, bdisc=bb*bb-bc;
  float bsq=bdisc>0.0?sqrt(bdisc):0.0;
  float tIn=max(-bb-bsq,0.02), tOut=min(-bb+bsq,18.0);
  float t=tIn+dth*0.012;                          // dithered start kills stair-step banding
  if(u_nobound>0.5){ tIn=0.02; tOut=18.0; t=0.02+dth*0.012; }   // A/B: the old unbounded march
  int STEPS=((bdisc<=0.0||tOut<=tIn)&&u_nobound<0.5)?0:112;      // ray misses the bound: nothing to march
  int nStep=0;
  for(int i=0;i<STEPS;i++){ nStep++; vec3 p=ro+rd*t; vec2 h=map(p);
    // SURFACE EPSILON. 0.0015 was far too loose for thin-walled forms. Measured against a
    // high-precision reference march on the Shell: at 0.0015, 1.42% of interior rays converged
    // on the FAR wall instead of the near one, p99 depth error 1.097 — about the depth of the
    // object. Those are isolated pixels showing the inside of the form, scattered across it,
    // and that is the noise. Not aliasing, not the texture, not step exhaustion (every ray
    // converged); the march simply stepped through a wall thinner than its own tolerance.
    //   eps      median err   p99 err   wrong-wall rays
    //   0.0015   0.00465      1.0971    1.42%
    //   0.0004   0.00128      0.0104    0.46%
    // Cost is 8 steps: rays that hit used a mean of 29 and now use 37, p99 79 -> 92, against a
    // budget of 112. Cheapest fix available and it needs no extra passes.
    if(h.x<0.0004*t){mid=h.y;break;}
    // map() returns a HALF-scaled field, so h.x is at most half the true clearance. Near the
    // surface the 0.62 factor guards the displaced field; out in empty space (where h.x is
    // large and the value comes straight off the bounding sphere) that is doubly conservative
    // and burns steps crossing nothing. 1.35*h.x is still only ~0.68 of the true distance.
    t+=h.x*(h.x>0.20 ? u_stepFar : u_stepK);
    if(t>tOut)break; }
  // SURFACE REFINEMENT. The loop stops on a RELATIVE epsilon (0.0015*t), so each pixel halts at
  // its own residual anywhere in [0, eps] — and the start is dithered per pixel, which decides
  // where in that interval it lands. At t~4 the spread is ~0.004 object units while calcN reads
  // the normal over 0.0018, so the normal was being sampled at a position varying by more than
  // twice its own scale. That is per-pixel shading noise, and no amount of supersampling removes
  // it because every sample has an independent offset.
  // Three Newton steps on the field. map() is half-scaled so each step closes about half the
  // remaining gap without overshooting, cutting the spread ~8x for 3 evaluations against the
  // march's ~112. Deterministic, so what it removes is the VARIANCE, not just the magnitude.
  if(mid>=0.0){ for(int j=0;j<3;j++) t+=map(ro+rd*t).x; }
  // The imported mesh replaces the PRIMARY ray only. Ambient occlusion, shadows and reflection
  // occlusion keep marching the baked field: they are low-frequency and approximate by nature,
  // and giving each of them a BVH traversal would multiply the cost for no visible gain.
  vec3 meshN=vec3(0.);
  bool meshHit=false;
  if(u_meshOn>0.5){
    float tm=traceMesh(ro,rd,meshN);
    if(tm>0.0){ t=tm; mid=0.0; meshHit=true; } else { mid=-1.0; t=1e9; }
  }
  // GROUND PLANE REMOVED. It existed to catch a cast shadow, and that shadow never worked here:
  // the forms float clear of it, so what landed was a soft grey pool with a horizon behind it,
  // and every attempt to fix the shadow only moved the artefact around. Without a shadow the
  // plane is just an arbitrary horizon line dividing the frame, so it goes too and the form now
  // floats in the colour field. This also drops a shadow march for every floor pixel, which was
  // the most expensive thing in the lower half of the frame.
  // STUDIO FLOOR, intersected analytically. Marching an infinite plane makes grazing rays
  // converge too slowly, so they hit the step cap at varying distances and the floor bands into
  // rings — a plane has a closed form, so use it. The plane sits just under the form (JS derives
  // u_groundY from the same reach the framing uses), which is what makes the contact shadow
  // actually land instead of spreading into the grey pool this replaced.
  if(u_scene>0.5){
    float tp=(rd.y<-1e-4)?(u_groundY-ro.y)/rd.y:-1.0;
    if(tp>0.02 && (mid<0.0 || tp<t)){ t=tp; mid=2.0; }
  }
  vec3 Lw=normalize(mix(vec3(-.40,.80,.40), vec3(.58,.28,.74), u_tension*0.65));
  vec3 back=bg(rd,uv);       // miss + aerial fade
  vec3 col;
  // DIAG 13: primary-march step count / 112, for BOTH hits and misses. Step count is the one
  // measure of march cost with no timing noise in it at all.
  if(u_diag>12.5){ o=vec4(vec3(float(nStep)/112.0),t); return; }
  if(mid<0.){
    col=back;
    // SHADOW CATCHER REMOVED. It projected the form's occlusion onto an invisible plane, and in
    // the colour field there is no floor for it to belong to: the result was a large dark pool
    // across the bottom of the frame, reading as a second object rather than as a shadow. It also
    // banded — a wide, smooth radial falloff laid over a near-flat backdrop quantises into
    // concentric contour rings in 8-bit, which no amount of tuning the falloff removes. This is
    // the same failure the ground plane above was deleted for. The form floats in the field; the
    // Studio scene still has a real floor and a real cast shadow, where one actually belongs.
  }
  else if(mid>1.5){                                  // ---- STUDIO FLOOR ----
    vec3 p=ro+rd*t, gn=vec3(0,1,0);
    vec3 A,B; palAB(A,B);
    vec3 alb=mix(vec3(0.82),B,0.10);
    vec3 L=normalize(mix(vec3(-.40,.80,.40), vec3(.58,.28,.74), u_tension*0.65));
    vec3 keyC=mix(vec3(0.72,0.82,1.00), vec3(1.00,0.86,0.66), u_warmth);
    float sha=calcSha(p,L,min(u_shaN,40));           // cast shadow: the floor never needed more
    float occ=calcAO(p,gn);                          // contact darkening
    vec3 amb=env(gn,1.0)*0.95;
    // Contact shadow has to be DARK right under the form or it reads as a grey smudge. Both
    // terms are driven near zero in full occlusion, and AO is sharpened so the darkest part sits
    // tight against the silhouette instead of spreading.
    float ao2=occ*occ;
    col=alb*( keyC*(0.55*max(0.,dot(gn,L)))*mix(0.02,1.0,sha) + amb*mix(0.04,1.0,ao2) );
  }
  else{
    vec3 p=ro+rd*t, gn=meshHit?meshN:calcN(p), v=-rd;
    vec3 op=objP(p);
    // Ray differentials for the detail fetch. f, t and rd are the frame's own numbers, so this
    // tracks render scale and FOV with no uniform of its own. objP is a pure rotation, so it
    // transforms these direction vectors exactly as it transforms the position.
    float ndv=dot(rd,gn); ndv=(abs(ndv)<0.08)?(ndv<0.0?-0.08:0.08):ndv;
    vec3 rdx=u_rt/(u_res.y*f), rdy=u_up/(u_res.y*f);
    vec3 dox=objP(t*(rdx-rd*(dot(rdx,gn)/ndv)));
    vec3 doy=objP(t*(rdy-rd*(dot(rdy,gn)/ndv)));
    float dRgh; vec3 n=texDetail(op,gn,dox,doy,dRgh); // textured shading normal + roughness, one pass
    // DIAGNOSTIC. Shows the triplanar machinery directly instead of its effect on the lighting,
    // which is the only way to tell a blend artefact from a shading one. Costs nothing when off.
    if(u_diag>0.5){
      int dm=int(u_diag+0.5);
      vec3 dc=vec3(0.);
      if(dm==1) dc=DIAGW;                              // blend weights as RGB
      if(dm==2) dc=gn*0.5+0.5;                         // geometric normal
      if(dm==3) dc=vec3(DIAGD*8.0);                    // how far detail bent the normal
      if(dm==4) dc=vec3(sqrt(dot(DIAGW,DIAGW)));       // amplitude the blend actually passes
      if(dm==5) dc=vec3(fract(dRgh*16.0));             // roughness field, contoured
      if(dm==8) dc=vec3(calcAO(p,gn));                 // ambient occlusion, alone
      if(dm==9) dc=vec3(fract(calcAO(p,gn)*24.0));     // ...contoured, so terracing is unmissable
      if(dm==10) dc=vec3(DIAGF);                       // 1 = normal at full tilt, <1 = mip has flattened it
      if(dm==11) dc=vec3(clamp(DIAGL/8.0,0.0,1.0));    // selected mip level / 8
      if(dm==12) dc=vec3(sqrt(dot(DIAGW,DIAGW)));      // amplitude the triplanar blend passes
      o=vec4(dc,t); return;
    }
    float rgh=texRough(dRgh,u_rough);                 // spatially varying roughness
    // GEOMETRIC SPECULAR AA. A narrow GGX lobe over a high-frequency normal map aliases into
    // crawling white sparkle along every silhouette — one pixel catches the lobe, its neighbour
    // misses it entirely. Widen roughness by how fast the shading normal turns across this
    // pixel (Toksvig-style): sub-pixel normal variance is mathematically the same thing as
    // extra microfacet spread, so folding it into roughness removes the sparkle without
    // softening surfaces that are genuinely flat. Chrome (rough 0.06) is unusable without it.
    vec3 dnx=dFdx(n), dny=dFdy(n);
    // Cap left at 0.030. Raising it to 0.075 to absorb the richer 5-octave normal measured
    // WORSE, not better — but the metric (frame-to-frame pixel change) cannot separate genuine
    // shimmer from sharp reflections legitimately sweeping across a rotating chrome surface, so
    // it could not justify the change either way. Keeping the value that was tuned by eye.
    float kvar=min(u_kvar, 0.5*(dot(dnx,dnx)+dot(dny,dny)));
    rgh=min(1.0, sqrt(rgh*rgh+kvar));
    float NoV=clamp(dot(n,v),1e-4,1.);
    float fr=pow(1.-NoV,2.6);
    // albedo carries the same grain, so the body is not one flat colour
    float av=fbmT(op*u_txScale*0.30);
    // TWO-TONE. A single u_mood makes the whole form one hue, which is why a frame reads
    // flatter than the reference — those get their life from several colourways at once.
    // Sweep in OBJECT space (so the split belongs to the form and turns with it) between the
    // section's mood and the palette accent, with the surface grain breaking up the boundary
    // so it reads as material rather than a gradient laid over the top.
    vec3 pA,pB; palAB(pA,pB);
    float sweep=clamp(0.5+0.70*(op.y*0.85+op.x*0.30)+(av-0.5)*0.55*u_surf, 0., 1.);
    vec3 tint=mix(u_mood, clamp(pB*1.12,0.,1.), smoothstep(0.18,0.82,sweep)*u_twoTone*u_dxs.w);
    // u_alb is a per-material albedo scale. The shared 0.9 base is right for pearl and frosted,
    // which are near-white by nature, but it left clay blowing out to paper white across every lit
    // face — measured at 1.66% of the upper frame above 225/255, of which only a fifth came from
    // the surface texture; the rest was simply a very bright diffuse clipping. Real clay is a
    // mid-tone, and dropping the albedo is what makes it read as clay rather than lit plaster.
    // TINT WEIGHT is per-material. A metal's base colour IS its f0, so tinting it with a dark
    // palette makes a BLACK MIRROR — it reflects the bright studio at almost zero and the form
    // goes dark no matter how good the environment is. Dielectrics want the palette (it is how
    // the section's mood reaches the surface); metals want to stay near-white and take their
    // colour from the thin film instead.
    vec3 base=mix(vec3(0.9), tint, u_tintAmt)*u_alb*(1.0+(av-0.5)*u_txRough*0.16);
    // The furnace test needs a WHITE, lossless albedo or it measures the paint rather than the
    // BRDF: a lavender base returns 0.83 under a unit environment simply because it is lavender.
    base=mix(base, vec3(1.0), u_furnace);
    vec3 f0=mix(vec3(0.04), base, u_metal);
    /* ---- ENERGY ----
       White furnace test before this block: a WHITE, lossless dielectric under a uniform unit
       environment returned 1.245 (clay, which has no reflection or specular at all, returned
       1.220 — so the error was almost entirely in the diffuse path), and metals returned 0.908.
       A lossless material must return exactly 1.0. Both numbers are what "plastic" looks like
       from the inside: 24% of the light on every dielectric was invented, which flattens the
       shading because energy that should have been absorbed is being added back uniformly, and
       9% was being lost on metals, which is what makes rough metal read chalky.

       Three faults, all in this one place:
       (NB: no backticks anywhere in this comment — this GLSL lives inside a JS template literal,
       and one in a comment ends the literal and takes the whole script down.)
       1. amb = env(n,1.0)*1.22 -- a hand-tuned gain. Irradiance under a unit environment IS 1.0;
          1.22 injects 22% and it was the bulk of the error.
       2. No (1-F) on the diffuse. Specular was added ON TOP of a full-strength diffuse, so the
          two together reflect more than arrives — worst exactly at grazing, which is where the
          eye reads material.
       3. Schlick-with-roughness for the IBL Fresnel. It has no geometry term, so it over-reflects
          at grazing on rough surfaces, and it gives no handle on the energy single-scatter GGX
          loses to shadowing (that is the metals' missing 9%).

       Replaced with the split-sum DFG fit and Fdez-Aguera's multiple-scattering compensation,
       which is the standard closed form for exactly this. Brightness is NOT preserved here on
       purpose — the correct answer is dimmer, and the difference is paid back in exposure, where
       it belongs, rather than by re-breaking the BRDF. */
    vec2 dfg=envDFG(NoV,rgh);
    // u_reflect is folded in HERE, not at the reflection line, so the diffuse only gives up the
    // energy the material actually returns. Deducting the full physical specular from a material
    // that emits 40% of it (pearl) or none of it (clay) is a pure loss: clay measured 0.926 in
    // the furnace with the deduction unscaled, and it has no specular path at all to put it back.
    vec3 FssEss=(f0*dfg.x+dfg.y)*u_reflect;     // single-scatter specular, as actually emitted
    float Ems=1.0-(dfg.x+dfg.y);                // energy the single-scatter lobe threw away
    vec3 Favg=f0+(1.0-f0)/21.0;                 // average Fresnel over the hemisphere
    vec3 Fms=FssEss*Favg/(1.0-Ems*Favg);        // ...returned as additional diffuse-like bounce
    vec3 kD=base*(1.0-u_metal)*(1.0-FssEss-Fms*Ems);   // what is left over to scatter diffusely
    // thin-film colour, shifted by the micro surface so it mottles like real pearl
    vec3 irid=0.5+0.5*cos(6.2831*(fr*u_iridFreq+n.y*0.5+av*0.7*u_surf+u_time*0.03+u_iridHue+u_hAir*0.25)
                          + vec3(0.,2.1,4.2));
    // EMOTIONAL LIGHT: tension swings the key round to a harder angle, warmth tints it,
    // valence colours the rim. The scene is lit by how the music feels.
    vec3 L=normalize(mix(vec3(-.40,.80,.40), vec3(.58,.28,.74), u_tension*0.65));
    vec3 keyC=mix(vec3(0.72,0.82,1.00), vec3(1.00,0.86,0.66), u_warmth);
    vec3 rimC=mix(vec3(0.28,0.48,1.00), vec3(1.00,0.46,0.28), u_valence);
    float NoL=max(0.,dot(n,L))*(1.0-u_furnace);   // furnace: uniform environment only, no sources
    float occ=mix(1.0,calcAO(p,gn),u_dxs.x)*(1.0-u_furnace)+u_furnace;
    float sha=(NoL>0.001)?mix(1.0,calcSha(p,L,u_shaN),u_dxs.y):1.0;   // the form: full budget
    // diffuse body (fades out for metals) — occluded + self-shadowed.
    // Ambient is real environment irradiance (env sampled along the normal, fully rough)
    // rather than a flat constant: that is what makes unlit faces read as lit by a room.
    // THE STRIATIONS WERE HERE. This read env() along the DETAIL-PERTURBED normal, and that is
    // what put contour banding across every large face — four rounds of looking for it in the
    // bake, the projection and the filtering, when the map was never the problem.
    //
    // Measured on a locked pose, high-passed RMS of the lit surface over a 280px patch inside a
    // flat face (noise floor = the same patch with Detail set to None, 0.665):
    //     detail micro, room as shipped        1.409     <- the artefact
    //     detail micro, u_room = 0             1.252     not the wall panels
    //     detail micro, reflection off         1.391     not the reflection
    //     detail micro, specular off           1.410     not the specular either
    //     detail micro, FURNACE (env == 1.0)   0.671     <- floor. It is the environment.
    // Mip filtering was ruled out in the same run: LINEAR_MIPMAP_LINEAR at 16x, at 1x, plain
    // LINEAR with no mips and NEAREST_MIPMAP_LINEAR all measured 1.38-1.40. Identical.
    //
    // The cause is a category error, not a tuning value. env(d,1.0) is RADIANCE along one
    // direction; what belongs on the diffuse term is IRRADIANCE, the cosine-weighted integral of
    // the whole hemisphere, and irradiance is band-limited to about two SH bands — it physically
    // CANNOT carry detail this fine. Sampling radiance instead hands the diffuse term the room's
    // full angular structure, and this room is dominated by a vertical gradient plus a 38%
    // horizon step, so ambient is effectively a steep function of n.y alone. Push n.y around by
    // an isotropic 2.4-degree micro normal and out comes banding aligned with the contours of
    // constant n.y — which on a convex form is exactly a set of radial contours.
    //
    // A normal map stands for structure BELOW the pixel. Its average normal is the geometric one,
    // so it has no business moving a hemispherical integral at all: micro detail belongs in the
    // specular lobe, where the narrow BRDF is what makes it visible, and in AO. n still drives
    // NoL, the specular and the reflection; the irradiance reads gn, which is what it means.
    vec3 amb=env(gn,1.0);         // irradiance, not irradiance times a fudge — see ENERGY above
    // FLAT AMBIENT for the hard-surface look. env(gn) is the physically right thing and it is why
    // a face carries a gradient: the irradiance genuinely changes as the normal turns. Flat-shaded
    // renders get their legibility by giving that up -- one ambient value for the whole object, so
    // a face's tone is decided ONLY by its own orientation to the key. Two taps of the environment
    // (up and down) stand in for the hemisphere average, which keeps the look responding to u_env
    // and u_warmth instead of hard-coding a grey. Both taps are constant across the object, so the
    // branch is uniform and the whole term folds away when the look is off.
    if(u_hardAmb>0.001){
      // NOT named 'flat': that is an interpolation qualifier in GLSL ES 3.00 and a reserved word.
      vec3 ambF=env(vec3(0.,1.,0.),1.0)*0.55 + env(vec3(0.,-1.,0.),1.0)*0.45;
      amb=mix(amb, ambF*u_hardAmbK, u_hardAmb);   // see KEY-TO-AMBIENT below: this number IS the shadow side
    }
    // The KEY BREATHES. u_pulse already drove the geometry and the backdrop but never the
    // lighting, so the form was scaled by the beat while being lit by a lamp that ignored it.
    // Pulsing the light instead of the shape is the stronger cue: it moves the highlight and the
    // terminator, which is what the eye reads as a room reacting rather than an object wobbling.
    // Ambient is deliberately NOT pulsed — modulating the fill as well lifts the whole frame
    // together, which reads as an exposure flicker, not as a light.
    // kD carries base*(1-metal) already, and it is what is LEFT after the specular takes its
    // share. Fms*Ems is the multiple-scattering term riding along with the irradiance.
    // FILL — the missing leg of the rig. Before this, "fill" was env() irradiance alone, which
    // arrives from every direction at once: it lifts an unlit face without telling you which way
    // that face points, so the form reads flat exactly where it should be turning away. A fill
    // has to have a DIRECTION to shape anything.
    //
    // Placed opposite the key in azimuth and lower in elevation, which is where a bounce card
    // actually sits, and tinted opposite the key (warm key -> cool fill) so the shadow side
    // separates by hue as well as by value.
    //
    // WRAPPED, not Lambert: (NoF+w)/(1+w) is the cheap stand-in for a large area source, and the
    // width is the whole point of the leg — a hard fill just reads as a second key and gives the
    // form two competing terminators. It carries NO shadow ray: a fill that is itself occluded
    // fills nothing, and the ray would cost as much as the key's while doing far less.
    vec3  F=normalize(vec3(-L.x, max(0.12, L.y*0.30), -L.z));
    vec3  fillC=mix(vec3(1.00,0.86,0.66), vec3(0.72,0.82,1.00), u_warmth);  // opposite the key
    float wrap=mix(0.55,0.06,u_hardWrap);   // wide bounce card, or a second hard edge
    float NoF=max(0.,(dot(n,F)+wrap)/(1.0+wrap))*(1.0-u_furnace);
    // Ambient is trimmed by what the fill now supplies, so the rig redistributes light rather
    // than adding a fourth source on top and lifting the whole frame.
    // Trim only slightly. At 0.82 the ambient this replaced was worth more than the fill puts
    // back on faces pointing away from F, and the form came out 8 levels DARKER overall with its
    // shadows 10 deeper — a fill that darkens is not a fill.
    // Swept against a silhouette-masked luminance histogram of the form. Shadow-side shaping
    // (std dev over the darker half) rises monotonically with the fill — 0%, 2.3%, 5.4%, 8.3%,
    // 10.9% — while the 95th percentile sits at 231.0 +/- 0.1 the whole way: the leg models the
    // turned-away side without touching a single highlight, which is the test for a fill. This
    // is the 5.4% point. DXS.fill scales it, so the sweep is reproducible from the console.
    float ambK=mix(1.0,0.90,u_fill);
    /* HARD-SURFACE RIG. Flattening the ambient alone is not enough and the first attempt proved
       it: with one ambient tone and the key still at 0.95, the ambient simply WON and the form
       came out a single flat silhouette -- the opposite failure to the one being fixed. Flat
       tones need a flat ambient AND a key big enough to separate them, which is the whole content
       of "key-to-ambient ratio". So the key roughly doubles, the ambient drops to 0.42 of its
       studio value, and the fill -- already narrowed by u_hardWrap -- drops with it, because a
       second broad source is exactly what stops three tones being three tones. */
    // Tuned against the reference's own numbers rather than by feel: there the darkest face family
    // sits at luminance ~45 against ~100 for the lightest, so the shadow side keeps roughly 45% of
    // the light side. The first pass at 2.05 / 0.42 / 0.40 crushed it to near black instead --
    // separation without a shadow side is just a silhouette, which is the same failure as no
    // separation at all, arrived at from the other direction.
    /* KEY-TO-AMBIENT. On a face turned fully from the key the only light left is the ambient, so
       the shadow-to-light ratio IS ambient/(ambient+key). Two earlier attempts moved the wrong
       term: raising the key alone crushed the shadow side to black, and raising the AO and cast
       shadow floors (0.22 -> 0.72 and 0.35 -> 0.74) changed it by nothing at all, because what
       darkens those faces is not occlusion, it is having no light on them.

       Swept properly, on ONE frozen frame, with the form isolated by DBGMASK so the backdrop
       cannot enter the statistic, and with both gains as live uniforms so nothing else moves:

           ambient   key    shadow side as % of lit side
             0.96    1.55            44          <- shipped
             1.40    1.45            62
             1.80    1.35            71
             2.30    1.25            79

       A first attempt to solve it in closed form said ambient x4.1, key x0.71 -- and that came
       out at 90%, a blown flat white. The algebra assumed the response was linear and it is not:
       everything here goes through the tonemap, which compresses the top hard. The sweep is the
       measurement; the arithmetic was only a starting point.

       One caution on the number itself. p05 depends on how much of the form is turned away and
       how deep its cavities are, so it moves with the pose -- the same gains read 12% on a
       different frame. Within one frame the ORDER is reliable, which is what a sweep needs; the
       absolute value is not a spec to hit. 44 is where it was chosen by eye. */
    float hk=mix(1.0,u_hardKeyK,u_hardAmb);
    ambK   *= mix(1.0,0.86,u_hardAmb);
    float hf=mix(1.0,0.55,u_hardAmb);      // fill down, but not out
    // AND the occlusion floors have to come up with it. Measured against an object mask on a
    // frozen frame, lifting the ambient alone moved the shadow side from 7% of the light side to
    // 12%, nowhere near the reference's 45% -- because what was crushing those faces was never
    // the ambient LEVEL, it was AO and the cast shadow multiplying it by 0.22 and 0.35. A
    // flat-shaded render characteristically carries very little of either; the tone is supposed
    // to come from the face's angle, and contact darkening on top of that is what turns a flat
    // tone back into a gradient. So both floors rise steeply with the look.
    float aoF =mix(0.22,0.72,u_hardAmb);
    float shaF=mix(0.35,0.74,u_hardAmb);
    vec3 c=kD*( keyC*(0.95*hk*u_keyPulse*NoL*mix(shaF,1.0,sha))*mix(shaF,1.0,occ)
              + fillC*(0.68*hf*u_fill*NoF)*mix(mix(0.30,0.72,u_hardAmb),1.0,occ)
              + amb*ambK*mix(aoF,1.0,occ) )
          + Fms*Ems*amb*ambK*mix(aoF,1.0,occ);
    // emotional rim: swells with epicness/arousal, colour from valence
    // the mood rim reads as a glossy edge on a matte surface, so it scales back with u_spec —
    // not to zero, because it is how the section's valence reaches the form at all.
    // ...and the rim, which is pure pow(1-NoV): the single strongest gradient across a flat face.
    c+=rimC*pow(1.0-NoV,3.2)*(0.08+u_epic*0.34+u_arousal*0.12)*u_rimPulse*mix(0.4,1.0,occ)*mix(0.4,1.0,u_spec)*(1.0-u_furnace)*(1.0-u_hardAmb);
    // environment reflection (fresnel + textured roughness) — specular occlusion
    vec3 R=reflect(-v,n);
    // REFLECTION OCCLUSION. env() is sampled as if the whole room were visible from this
    // point, so concave areas reflect light the geometry actually blocks — which is what makes
    // chrome read as a thin shell instead of a solid object. March a short ray along R and
    // suppress the reflection where the form occludes itself.
    // RAY-TRACED SELF-REFLECTION. This ray was already being marched and its hit already being
    // found — and then discarded: a hit only set rocc=0, which dimmed the ROOM reflection to 22%
    // where the form's own body should have appeared. So a shape that folds back on itself, which
    // every shape here does, reflected a studio it was standing in but never itself. That is the
    // single strongest "old render" cue on a glossy object; the eye reads a surface as real when
    // it can find the object's own silhouette curving through the reflection.
    //
    // The march is now a proper sphere trace (full distance per step, not capped at 0.35, which is
    // why the old loop needed 10 iterations to reach only t=2.2 and gave up mid-form), and on a hit
    // the point is shaded and returned instead of thrown away. No recursion: the hit gets a direct
    // shade only — key light, environment ambient, its own AO — so second-order reflections are
    // absent, which is invisible at these roughnesses and keeps the cost to one extra trace.
    // Gated on the material actually being able to SHOW a sharp reflection. A single mirror ray
    // is the wrong estimator for a wide lobe: at roughness 0.65 the true reflection is a blur of
    // half the hemisphere, which the pre-filtered env already gives for free and one ray only
    // adds noise to. So rough and barely-reflective materials keep the cheap occlusion path, and
    // the trace is spent where it changes the image — measured 22.7fps on glass without this gate
    // against 30 with it, for a term glass cannot show anyway behind its own transmission.
    vec3 refl;
    if(u_reflect>0.12 && rgh<0.55){
      float tr=0.04, rocc=1.0; bool hit=false; vec3 hp=p;
      for(int i=0;i<28;i++){
        hp=p+R*tr;
        float hh=mapD(hp);
        if(hh<0.0035){ hit=true; break; }
        rocc=min(rocc,6.0*hh/tr);
        tr+=max(hh,0.012);
        if(tr>4.0) break;
      }
      if(hit){
        vec3 rn=calcN(hp);
        float rAO=calcAO(hp,rn);
        float rNoL=max(0.0,dot(rn,L));
        // Shaded with the SAME material terms as the primary hit, so the reflected body reads as
        // the same object rather than as a grey proxy pasted into the surface.
        vec3 rc = base*( keyC*(0.95*rNoL*mix(0.35,1.0,calcSha(hp,L,min(u_shaN,40))))*mix(0.35,1.0,rAO)
                       + env(rn,1.0)*1.22*mix(0.22,1.0,rAO) );
        // one cheap gloss term so the reflected surface is not flat matte inside the reflection
        rc += env(reflect(R,rn), min(1.0,rgh+0.22))*0.22*mix(0.3,1.0,rAO);
        refl = rc;
      } else {
        refl = env(R,rgh)*mix(0.35,1.0,clamp(rocc,0.0,1.0));
      }
    } else {
      // cheap path: short occlusion march only, as before
      float rocc=1.0, tr=0.035;
      for(int i=0;i<10;i++){
        float hh=mapD(p+R*tr);
        if(hh<0.004){ rocc=0.0; break; }
        rocc=min(rocc,6.0*hh/tr); tr+=clamp(hh,0.03,0.35); if(tr>2.2) break; }
      refl=env(R,rgh)*mix(0.30,1.0,clamp(rocc,0.0,1.0));
    }
    // Schlick-with-roughness: the standard IBL Fresnel. The old pow(1-NoV,2.6) ramp ignored
    // roughness entirely, so a matte surface still lit a bright reflective rim and a polished
    // one never reached full grazing reflectance. Edge-on, smooth materials now go fully
    // mirror-like — that grazing sweep is most of what reads as "glossy" rather than "chalky".
    vec3 Fr=FssEss;              // split-sum weight; u_reflect is already folded into it
    c += refl*Fr*mix(0.45,1.0,occ);
    // Thin film TINTS THE REFLECTION — it does not add light. Adding it emissively is what
    // painted a saturated rim (green whenever the section's random hue landed there); a real
    // pearl shows its colour in what it reflects.
    c += (irid-vec3(0.5))*refl*f0*u_reflect*u_iridAmt*0.55*(1.0+u_hAir*0.5)*mix(0.45,1.0,occ);
    // TRANSMISSION (glass). What is not reflected goes THROUGH, so sample the environment along
    // the REFRACTED direction rather than adding a wash of white. This is the whole difference
    // between glass and a shiny pale ball: the background seen through the form bends, and the
    // bend is strongest where the surface turns away from the eye. Weighted by 1-Fresnel because
    // reflection and transmission share one energy budget — at grazing angles glass goes fully
    // mirror, which is exactly the cue that reads as a hard transparent shell.
    if(u_trans>0.001){
      vec3 Rt=refract(-v,n,0.667);                 // eta 1/1.5, ordinary glass
      float tir=dot(Rt,Rt);                        // zero on total internal reflection
      // INTERIOR MARCH — this is what gives the glass depth. Refracting once at the front surface
      // and reading the backdrop treats the form as an infinitely thin shell: it bends the view
      // but has no inside, which is why it read as a soap film. The field is NEGATIVE inside the
      // form, so -mapD is the distance to the boundary from within, and marching on that carries
      // the refracted ray to where it actually leaves.
      // Two things fall out of that and both are the "depth" being asked for:
      //   - THICKNESS. How far the ray travelled through the solid, which drives Beer-Lambert
      //     absorption below — thin edges stay clear, the body deepens in colour. This is the cue
      //     that says solid rather than hollow.
      //   - A SECOND REFRACTION. Real glass bends light twice, once entering and once leaving,
      //     and the exit bend is the larger of the two visually because it is where the ray is
      //     furthest from where it started.
      float thick=0.0; vec3 eR,eG,eB;
      if(tir>0.0001){
        vec3 rd2=normalize(Rt);
        vec3 q=p+rd2*0.012;
        // 18 steps and a tight threshold, after trying to cut it to 10 with a coarse one on the
        // theory that the exit NORMAL feeds a refraction rather than a silhouette and so needs
        // less precision. Measured on a frozen frame the cheap version scored HIGHER internal
        // structure — 6.67 against 5.20 — which is the trap: rays that stop before converging give
        // scattered exit normals, and scattered normals produce contrast that looks like detail
        // and is noise. It was not faster either. Precision here is not a quality knob to trade.
        for(int i=0;i<18;i++){
          float hh=-mapD(q);
          if(hh<0.004) break;
          float st=max(hh,0.012); q+=rd2*st; thick+=st;
          if(thick>4.0) break; }
        vec3 n2=-calcN(q);                         // boundary normal, flipped to face the ray
        // Dispersion applied at the EXIT surface, three etas off one march. Marching three times
        // would triple the cost of the most expensive material for a split that is dominated by
        // the exit bend anyway.
        eR=refract(rd2,n2,1.5*0.988); eG=refract(rd2,n2,1.5); eB=refract(rd2,n2,1.5*1.012);
        vec3 fb=reflect(rd2,n2);                   // total internal reflection at the exit
        eR=dot(eR,eR)>0.0001?normalize(eR):fb;
        eG=dot(eG,eG)>0.0001?normalize(eG):fb;
        eB=dot(eB,eB)>0.0001?normalize(eB):fb;
      } else { eR=R; eG=R; eB=R; }
      // Sample the BACKDROP along the refracted ray, not the lighting environment. env() is the
      // softbox rig that lights the form; what you actually see through glass is whatever is
      // behind it, so refracting env() produced a dark opaque blob with no relationship to the
      // scene. bg() is the same function the miss path uses, so the colour field genuinely bends
      // through the form and the shape reads as transparent rather than as dark plastic.
      // Dispersion costs ~12% of the glass frame, measured by collapsing it to one bg() call.
      vec3 through=vec3(bg(eR,uv).r, bg(eG,uv).g, bg(eB,uv).b);
      // BEER-LAMBERT. Absorption is exponential in path length, and it is the complement of the
      // glass colour that gets absorbed, so a thick path saturates toward that colour instead of
      // just going dark. u_absorb is per-material, so a future thicker or dirtier glass is a
      // number rather than another branch.
      vec3 att=exp(-(vec3(1.0)-clamp(base,0.,1.))*thick*u_absorb);
      float F=clamp(max(Fr.r,max(Fr.g,Fr.b)),0.,1.);
      c=mix(c, through*att*1.04, u_trans*(1.0-F));
    }
    // translucent backlight (frosted)
    // SUBSURFACE. What was here was dot(n,-L)*0.18 — a flat back-lambert with no notion of how
    // much material the light actually crossed, so a thin lip and the thickest part of the body
    // glowed identically and it read as a rim someone had drawn on rather than as light coming
    // through something. An SDF makes the honest version cheap: the field is negative inside the
    // form, so marching from just under the surface along -L and counting how much of that path
    // stays interior IS the thickness. Beer-Lambert on that, exactly as glass already does with
    // its absorption, plus a forward-scatter lobe because light leaving a translucent body is
    // strongest when you are looking back down the beam.
    if(u_transl>0.001 && u_sssD>0.0){
      const int SSS_N=6;                     // bounded on purpose: 6 taps is enough for a falloff
      // NOT named 'step': that shadows the GLSL built-in for the rest of the scope, so the next
      // person to write a step() call in here gets a no-matching-overload error on a line that looks
      // perfectly correct — and a shader that fails to compile takes the whole viewer down.
      float sstep=0.16, thick=0.0;
      vec3 sp=p-n*0.02;
      for(int i=0;i<SSS_N;i++){
        sp-=L*sstep;                         // walk INTO the form, along the light
        if(mapD(sp)<0.0) thick+=sstep;       // still inside: this much material was crossed
      }
      float trans=exp(-thick*u_sssD);
      float back=max(0.,dot(v,-L));                        // looking back down the beam
      float wrapB=max(0.,(dot(n,-L)+0.35)/1.35);           // and a wrapped back-face term
      c += base*keyC*u_transl*trans*(wrapB*0.42+pow(back,3.0)*0.55)*mix(0.5,1.0,sha)*(1.0-u_furnace);
    }
    // emissive glow (neon) — high-band stabs flare it, desaturated so it cannot band
    c += base*fr*(u_emis*1.6+u_hHigh*0.30+u_hMid*0.16)*(1.0-u_furnace);
    // Direct specular: Cook-Torrance GGX (roughness still comes from the TEXTURED field, so the
    // lobe breaks up instead of reading as plastic). Blinn-Phong's pow(NoH,k) was the single
    // biggest "not a real render" cue here — its lobe has the wrong falloff and no geometry
    // term, so grazing angles under-brighten and the highlight never stretches the way a real
    // microfacet surface does. D*G/(4*NoV*NoL) * NoL collapses to D*G/(4*NoV).
    vec3 Hh=normalize(L+v);
    float NoH=max(0.,dot(n,Hh)), VoH=max(1e-4,dot(v,Hh));
    float a=max(1e-3,rgh*rgh), a2=a*a;
    float dnm=NoH*NoH*(a2-1.0)+1.0;
    float D=a2/(3.14159265*dnm*dnm);
    float kg=a*0.5;                                  // Smith height-correlated, Schlick-GGX form
    float G=(NoV/(NoV*(1.0-kg)+kg))*(NoL/(NoL*(1.0-kg)+kg));
    vec3  Fs=f0+(1.0-f0)*pow(1.0-VoH,5.0);
    // D explodes as roughness -> 0 (a mirror lit by a point light is a singularity). Clamp the
    // lobe, or a smooth material fires single-pixel white sparks that bloom into blown blobs.
    vec3 spec=min(Fs*(D*G/(4.0*NoV)), vec3(24.0));
    // u_spec gates the DIRECT lobe separately from u_reflect. Dropping reflect to zero only
    // removes the environment reflection; this term keeps a 0.35 floor, so a material asked to
    // be free of reflections still carried a highlight. Clay sets it to zero.
    c += keyC*spec*(0.35+u_reflect*0.7)*u_spec*sha*mix(0.5,1.0,occ)*(1.0-u_furnace);
    // CLEARCOAT. A thin dielectric layer over everything above: its own GGX lobe at its own
    // roughness, F0 fixed at 0.04 because a clear coat IS a dielectric at IOR ~1.5 and its
    // reflectance is not the artist's to choose. The coat is what separates a glazed surface
    // from a painted one — a tight highlight sitting ON TOP of a broad, rougher body highlight,
    // rather than the single lobe both were sharing.
    //
    // The base is attenuated by the coat's Fresnel: light the coat reflects never reaches the
    // material underneath, and skipping that is how a clearcoat implementation ends up brighter
    // than the light it is given.
    if(u_cc>0.001){
      float ca=max(1e-3,u_ccRough*u_ccRough), ca2=ca*ca;
      float cd=NoH*NoH*(ca2-1.0)+1.0;
      float Dc=ca2/(3.14159265*cd*cd);
      float kc=ca*0.5;
      float Gc=(NoV/(NoV*(1.0-kc)+kc))*(NoL/(NoL*(1.0-kc)+kc));
      float Fc=(0.04+0.96*pow(1.0-VoH,5.0))*u_cc;
      c *= (1.0-Fc);                                        // what the coat reflects never gets in
      c += keyC*min(Dc*Gc/(4.0*NoV),24.0)*Fc*u_spec*sha*mix(0.5,1.0,occ)*(1.0-u_furnace);
      // and the coat reflects the room, not just the key
      float Fce=(0.04+0.96*pow(1.0-NoV,5.0))*u_cc;
      c += env(reflect(-v,n),u_ccRough)*Fce*mix(0.3,1.0,occ);
    }
    col=c;
  }
  // aerial fade: dissolve the form into the fluid background (holistic, professional)
  // the floor dissolves into the backdrop well beyond the subject: no visible horizon line,
  // which is what sells a seamless cyclorama rather than 'object on a plane'
  // Only the form is left to fade, so the floor's separate range is gone with it.
  // AERIAL FADE starts BEYOND the subject. The form sits at t~3..6, so a fade opening at 3.0
  // was mixing the backdrop straight into it — measurably ~15-20% darker and tinted toward the
  // background colour. That is the rendering quality bleeding away into whatever is behind it.
  // Opening at 6.5 leaves the subject untouched while distant floor still dissolves completely.
  // ONLY for rays that hit something. On a miss col IS the background already, and running the
  // fade there overwrote the shadow catcher's work with an unshadowed copy of the backdrop.
  if(mid>=0.0) col=mix(col, back, smoothstep(6.5,15.0,t));
  o=vec4(max(col,0.), t);        // alpha carries scene depth -> the post pass builds DOF from it
}`;

const BRIGHT=`#version 300 es
precision highp float;
out vec4 o;
uniform sampler2D u_tex; uniform vec2 u_res, u_src; uniform float u_thr;
vec3 bp(vec3 c,float thr){                       // soft-knee bright pass on a LINEAR HDR value
  float l=dot(c,vec3(.2126,.7152,.0722));
  float k=max(0.,l-thr); k=k*k/(k+0.5);
  return c*(k/max(l,1e-4));
}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res, t=u_src*0.5;
  // Threshold each tap BEFORE averaging. Thresholding blurred samples (what sampling the mip
  // chain directly did) lets a small, very bright highlight average below the threshold and
  // vanish — so specular pinpoints never bloomed, which is what made highlights read as bright
  // pixels rather than as light.
  o=vec4((bp(texture(u_tex,uv+vec2(-t.x,-t.y)).rgb,u_thr)

async function loadFile(file){

  catch(e){ showStat('Could not decode audio',true); hideStat(2600); return; }

  // the upload leg comes from XHR's own byte counter, and the analysis leg from the server,
  // which reports the weighted fraction as each stage begins.
  const job = 'j'+Math.random().toString(36).slice(2)+Date.now().toString(36);

        // cannot report from inside itself, so without this the bar would sit still through most
        // of the wait. Easing is clamped to the stage's end, so it can slow to a crawl but never
        // overtake the truth and never goes backwards.

          // against a 300ms interval, so requests overlapped and responses could land out of
          // order — an older one then overwrote a newer one and the bar jumped BACKWARDS, 27
          // times over one analysis. One in flight at a time removes the reordering at source.
