  gl.uniform1i(US('u_bvhNodes'),5); gl.uniform1i(US('u_bvhTris'),6);
  gl.uniform1i(US('u_detail'),7);
  gl.uniform1f(US('u_detailOn'),detailTex?1:0); gl.uniform1f(US('u_detailScale'),detailScale*(window.DSCL||1));
  gl.uniform1f(US('u_diag'),window.DIAG||0);
  gl.uniform1f(US('u_kvar'),(window.KVAR!==undefined)?window.KVAR:KVAR_CAP);
  gl.uniform1f(US('u_hwlod'),window.HWLOD?1:0);
  gl.uniform1f(US('u_nobound'),window.NOBOUND?1:0);
  gl.uniform1f(US('u_bmarg'),window.BMARG||0);
  gl.uniform1f(US('u_mipflat'),(window.MIPFLAT!==undefined)?window.MIPFLAT:1);
  gl.uniform1f(US('u_trivar'),(window.TRIVAR!==undefined)?window.TRIVAR:1);
  gl.uniform1f(US('u_meshOn'), (meshOn&&bvhNodeTex&&bvhTriTex)?1:0);
  // Sphere-tracing step, as a multiple of the HALF-scaled field. 2.0 would be exactly the true
  // distance — the theoretical maximum for a 1-Lipschitz field, which these forms are (measured
  // at max positive directional derivative 1.00). Below that is pure margin.
  // TIGHTEN THE MARCH WHILE MORPHING. The step multipliers are tuned against the forms as
  // authored, and the STEP comment says outright that the morph blend was never measured against
  // that limit. It is the case that breaks the assumption: mix(a,b,t) of two SDFs stays
  // Lipschitz-1, so the bound still looks safe, but it is no longer a true DISTANCE field — it
  // OVERESTIMATES the distance to its own zero level set. Stepping 1.45x an overestimate puts the
  // ray past the surface, and what comes back is punctured and faceted: the "low poly" look, on a
  // renderer with no polygons. Worst on section boundaries, where the Director morphs, so it
  // lands on the musical edit the eye is already watching. Scaled by sin(mix*PI) because the
  // error peaks mid-blend and vanishes at both ends, so the cost is paid only where it is real.
  const morphT=(phase===1)?Math.sin(Math.min(1,Math.max(0,mix))*Math.PI):0.0;
  const stepSafe=1.0-0.34*morphT;
  gl.uniform1f(US('u_stepK'),STEP.near*stepSafe); gl.uniform1f(US('u_stepFar'),STEP.far*stepSafe);
  gl.uniform1i(US('u_shaN'),STEP.shaN);
  gl.uniform1f(US('u_volOn'),volOn&&volTex?1:0);
  gl.uniform1f(US('u_volPad'),VOL.pad);
  // 0.75 of a mesh texel: wide enough to cross a cell boundary, narrow enough not to round off
  // detail the grid actually holds.
  gl.uniform1f(US('u_nEps'), (volOn&&volTex) ? (2.0*VOL.pad/VOL.res)*0.75 : 0.0018);
  if(svgTex){ gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D,svgTex); gl.activeTexture(gl.TEXTURE0); }
  if(volTex){ gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_3D,volTex); gl.activeTexture(gl.TEXTURE0); }
  if(bvhNodeTex){ gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D,bvhNodeTex); gl.activeTexture(gl.TEXTURE0); }
  if(bvhTriTex){ gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D,bvhTriTex); gl.activeTexture(gl.TEXTURE0); }
  if(detailTex){ gl.activeTexture(gl.TEXTURE7); gl.bindTexture(gl.TEXTURE_2D,detailTex); gl.activeTexture(gl.TEXTURE0); }
  gl.uniform1f(US('u_svgOn'),svgOn&&svgTex?1:0);
  // depth and bevel breathe with the music like every other form here
  gl.uniform1f(US('u_svgDepth'),0.17+energy*0.05+HITS.low*0.04);
  gl.uniform1f(US('u_svgBevel'),0.014+HITS.air*0.006);
  gl.uniform1f(US('u_gTwist'), tension*1.25+arousal*0.45+Math.sin(time*0.05)*0.12);
  // element count / lattice density — energy packs the structure tighter
  gl.uniform1f(US('u_gDense'), energy*1.9+BND.high*0.5+SH.count*0.05+PRM.mass);
  // member thickness — tension thins the structure until it reads fragile
  gl.uniform1f(US('u_gThick'), Math.max(0.0, 0.75-tension*0.55+SH.thick*0.9));
  // aperture size — valence opens the shell up, darkness closes it in
  gl.uniform1f(US('u_gCut'), Math.max(0.0, 0.25+valence*0.8-darkness*0.35));
  gl.uniform3f(US('u_bgA'),BGA[0],BGA[1],BGA[2]); gl.uniform3f(US('u_bgB'),BGB[0],BGB[1],BGB[2]);
  gl.uniform1f(US('u_bgAuto'),palAuto?1:0); gl.uniform1f(US('u_scene'),scene);
  gl.uniform1f(US('u_groundY'),groundY);
  // brighter, more positive sections separate further into two colourways
  gl.uniform1f(US('u_twoTone'), 0.30+valence*0.45+epic*0.15);
  gl.uniform1f(US('u_twA'),twA); gl.uniform1f(US('u_twB'),twB);
  gl.uniform1f(US('u_twMix'), twMix>0 ? twMix*twMix*(3-2*twMix) : 0);
  gl.uniform1f(US('u_darkness'),darkness);
  gl.uniform1f(US('u_env'),1.0-darkness*0.5);
  // Finish blends the material's roughness toward a target rather than replacing it, so a matte
  // glass and a matte pearl are still different surfaces.
  const finRgh=MAT.rough+(FIN.rghTo-MAT.rough)*FIN.rghMix;
  gl.uniform1f(US('u_metal'),MAT.metal); gl.uniform1f(US('u_rough'),finRgh);
  // Clamped at 1: gloss multiplies by 1.7 so it can lift a satin material, but the reflection
  // term is energy, and letting it past 1 adds light the environment never contained.
  gl.uniform1f(US('u_reflect'),Math.min(1.0,MAT.reflect*FIN.refl)*flatK);
  gl.uniform1f(US('u_iridAmt'),MAT.irid*FIN.irid*(0.7+0.3*bright)*flatK); gl.uniform1f(US('u_iridFreq'),MAT.iridf); gl.uniform1f(US('u_tintAmt'),MAT.tintw); gl.uniform1f(US('u_transl'),MAT.transl*flatK);
  // Clamped exactly as u_reflect is two lines up, and for the same reason: gloss multiplies by
  // 1.70, and the shader computes c *= (1.0 - Fc) with Fc reaching u_cc at grazing angles. Past
  // 1.0 that multiplies the accumulated colour by a NEGATIVE number — inverted fringes on every
  // silhouette edge. No preset reaches it today; one bump to cc would.
  gl.uniform1f(US('u_cc'),Math.min(1.0,MAT.cc*FIN.refl)*flatK); gl.uniform1f(US('u_ccRough'),MAT.ccr);
  // Subsurface costs six extra mapD() per shaded pixel and applies to pearl, clay and frosted —
  // i.e. most of the set, unconditionally. Preview drops it; the shader early-outs on u_sssD 0.
  gl.uniform1f(US('u_sssD'),MAT.sssd*(TIERS[TIER].sss!==undefined?TIERS[TIER].sss:1)); gl.uniform1f(US('u_emis'),MAT.emis);
  gl.uniform1f(US('u_trans'),MAT.trans);
  gl.uniform1f(US('u_spec'),MAT.spec*FIN.spec*flatK);
  gl.uniform1f(US('u_alb'),MAT.alb); gl.uniform1f(US('u_absorb'),MAT.absorb);
  gl.uniform1f(US('u_txScale'),MAT.tscale);
  // DENSITY -> surface micro-activity. A busy passage puts more tooth on the form, a sparse one
  // smooths it toward the material's authored value. Bounded to +/-15% of the preset: past that
  // it stops reading as the surface responding and starts reading as the material changing.
  // +/-15% measured as 0.00% of pixels moved at the default framing — at this distance the
  // detail map is mip-filtered down to almost nothing (Detail off vs on is itself only 1.26%),
  // so a sixth of that is genuinely invisible. Widened, and given a second lever in the grain
  // below, because a mapping that moves nothing is not restraint, it is absence.
  // LK.flatTex fades everything out with the look rather than switching it, so moving to
  // Hard surface and back is the same 3.0/s ease as every other look parameter.
  const texK=flatK;
  gl.uniform1f(US('u_txAmp'),MAT.tamp*surfT*(0.70+density*0.65)*texK);
  gl.uniform1f(US('u_txAniso'),MAT.taniso); gl.uniform1f(US('u_txRough'),MAT.trough*surfT*texK);
  gl.uniform1f(US('u_surf'),surfT);
  // TWO-TONE goes with the rest of it. It paints a colour ramp ACROSS the form -- deliberately,
  // it is what stops a frame reading as one hue -- and a ramp across the form is a ramp across
  // every face on it. Measured as the luminance spread over four points inside one flat face:
  // 36.0 with it, 23.7 without, the largest single contributor left after the NoV terms went.
  // The DISPLACEMENT goes too, and it is the one that shows on the silhouette rather than on a
  // face: it is a noise field added to the SDF, so it undulates the outline. The reference's edges
  // are dead straight because its geometry is boxes. A living surface is the right call for the
  // cinematic look and the wrong one for this.
  gl.uniform4f(US('u_dxs'),DXS.ao,DXS.shadow,DXS.disp*flatK,DXS.twoTone*flatK);
  gl.uniform1f(US('u_furnace'),DXS.furnace?1:0);
  // DYNAMICS DRIVES THE KEY:FILL RATIO. A dynamic passage gets less fill, so the form is modelled
  // harder and the shadow side falls away; a squashed, limited passage gets more, which flattens
  // it. That is the same thing a lighting cameraman does with a bounce card, and it is a far
  // stronger cue than pushing contrast in the grade — contrast crushes the whole frame together,
  // where the ratio changes how the OBJECT is lit.
  gl.uniform1f(US('u_fill'),DXS.fill*(1.28-dynamics*0.56));
  drawFS(aScene);
  gpuEnd();

  if(floatOK){
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,hdrT);
    if(mipOK) gl.generateMipmap(gl.TEXTURE_2D);          // hdr mips feed depth of field
    // BRIGHT PASS -> half res, thresholded, then mipped. Bloom gathers from this.
    gpuBegin('bright');
    gl.useProgram(brightP); gl.bindFramebuffer(gl.FRAMEBUFFER,brtF); gl.viewport(0,0,BW,BH);
    gl.uniform1i(UB('u_tex'),0); gl.uniform2f(UB('u_res'),BW,BH); gl.uniform2f(UB('u_src'),1/RW,1/RH);
    // threshold tracks exposure, so bloom picks up what will actually blow out after tonemapping
    // BLOOM THRESHOLD, raised 2.6x. At the old threshold most of a lit pearl body cleared the
    // knee, so the bloom source was the whole form and what it drew was an outline traced around
    // the silhouette — the glow the user reported. Measured against an exact depth-derived
    // silhouette, near-edge excess (2-12px) fell 11.8 -> 1.5 over the background gradient, an 87%
    // cut, while mean luminance INSIDE the silhouette moved 154.2 -> 153.4. Bloom's entire visible
    // output was the ring; raising the threshold costs essentially nothing on the form itself and
    // leaves genuine speculars, which sit far above the knee, still blooming.
    gl.uniform1f(UB('u_thr'), DX.thr*2.6*0.95/Math.max(0.35, 0.82+energy*0.45+pulseS*0.12+HITS.low*0.10));
    drawFS(aBright);
    gpuEnd();
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,brtT);
    if(mipOK) gl.generateMipmap(gl.TEXTURE_2D);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,hdrT);
    gpuBegin('post');
    gl.useProgram(postP); gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
    gl.uniform1i(UP('u_tex'),0); gl.uniform1i(UP('u_brt'),1);
    gl.uniform2f(UP('u_res'),W,H); gl.uniform1f(UP('u_time'),time);
    gl.uniform2f(UP('u_texel'),1/RW,1/RH); gl.uniform1f(UP('u_mip'),mipOK?1:0);
    // Read the ratio off the TARGET, not off rscale. applyScale may have clamped the request to
    // fit the driver's texture limit or the memory budget, and a resolve whose footprint does not
    // match the pixels actually rendered either misses samples or blurs across ones it never had.
    const ssR = RW/Math.max(1,W);
    gl.uniform1f(UP('u_ss'),ssR>1.05?1:0);
    gl.uniform1f(UP('u_ssRatio'),ssR);
    // focus on the form itself; everything behind it falls away into a soft wash
    gl.uniform1f(UP('u_dbg'),window.DBGMASK?1:0);
    // ---- motion blur: this frame's camera, and last frame's ----
    // Shutter is per tier, and dt-normalised to 60fps: velocity is measured PER FRAME, so on a
    // 30fps machine each frame covers twice the distance and an un-normalised shutter would
    // double the smear exactly where the frame rate can least afford it. TFREEZE sets dt to 0,
    // which correctly parks the shutter at zero and keeps A/B frames comparable.
    if(!MBP) MBP={ro:[roX,roY,roZ],rt:[rx,ry,rz],up:[ux,uy,uz],fw:[fx,fy,fz],spin:spin,fov:fovY};
    gl.uniform3f(UP('u_mbRo'),roX,roY,roZ);  gl.uniform3f(UP('u_mbRt'),rx,ry,rz);
    gl.uniform3f(UP('u_mbUp'),ux,uy,uz);     gl.uniform3f(UP('u_mbFw'),fx,fy,fz);
    gl.uniform3f(UP('u_mbRoP'),MBP.ro[0],MBP.ro[1],MBP.ro[2]);
    gl.uniform3f(UP('u_mbRtP'),MBP.rt[0],MBP.rt[1],MBP.rt[2]);
    gl.uniform3f(UP('u_mbUpP'),MBP.up[0],MBP.up[1],MBP.up[2]);
    gl.uniform3f(UP('u_mbFwP'),MBP.fw[0],MBP.fw[1],MBP.fw[2]);
    gl.uniform1f(UP('u_mbFov'),fovY); gl.uniform1f(UP('u_mbFovP'),MBP.fov!==undefined?MBP.fov:fovY);
    gl.uniform1f(UP('u_mbSpin'),spin); gl.uniform1f(UP('u_mbSpinP'),MBP.spin);
    gl.uniform1f(UP('u_mbTilt'),VAR.tilt);
    gl.uniform1f(UP('u_shutter'),(TIERS[TIER].shutter||0)*Math.min(2.5,dt*60)*(DX.mblur!==undefined?DX.mblur:1));
    MBP={ro:[roX,roY,roZ],rt:[rx,ry,rz],up:[ux,uy,uz],fw:[fx,fy,fz],spin:spin,fov:fovY};
    // underground grade: darker, grittier, higher contrast
    // RELEASE -> the exhale. Bloom lifts as tension is actively let go, which is the payoff
    // frame. Deliberately on RELEASE and not on low tension: a calm passage should look calm,
    // not blown — the lift belongs to the moment of letting go, not to the quiet that follows.
    gl.uniform1f(UP('u_bloom'),(0.34+energy*0.6+pulseS*0.24+HITS.high*0.22+HITS.air*0.14+release*0.20)*DX.bloom);
    gl.uniform1f(UP('u_sat'),0.82+valence*0.25+LK.sat);
    gl.uniform1f(UP('u_vig'),0.75+darkness*0.35);
    gl.uniform1f(UP('u_expo'),0.82+energy*0.45+pulseS*0.12+HITS.low*0.10);
    // Contrast winds up with tension and eases back as it releases, so the grade breathes with
    // the track instead of sitting at one setting through a whole arrangement.
    gl.uniform1f(UP('u_contrast'),0.45+tension*0.30-release*0.12+LK.contrast); gl.uniform1f(UP('u_grain'),(0.35+darkness*0.30+density*0.22)*LK.grain);   // busier passage, grittier frame
    gl.uniform1f(UP('u_flash'),Math.max(flashV,flash*0.8));
    // ---- volumetric shafts ----
    // The key is DIRECTIONAL, so it has no position to project — but a directional light is a
    // point at infinity, and the pixel that sees it is the one whose ray direction IS L. Solving
    // rd = normalize(uv.x*rt + uv.y*up + f*fw) for uv gives that pixel directly.
    // L must mirror the shader's own expression or the shafts would emanate from a light that is
    // not the one casting the shadows.
    const kt=Math.min(1,Math.max(0,tension))*0.65;
    let Lx=-0.40+0.98*kt, Ly=0.80-0.52*kt, Lz=0.40+0.34*kt;
    const Ll=Math.hypot(Lx,Ly,Lz)||1; Lx/=Ll; Ly/=Ll; Lz/=Ll;
    const LoF=Lx*fx+Ly*fy+Lz*fz;              // behind the camera -> no shafts at all
    let rayX=0.5, rayY=0.5, rayVis=0;
    if(LoF>0.05){
      const s=LoF/(0.5/Math.tan(fovY*0.5));
      rayX=((Lx*rx+Ly*ry+Lz*rz)/s)*(H/W)+0.5;   // uv.x is scaled by res.y, hence H/W here
      rayY=((Lx*ux+Ly*uy+Lz*uz)/s)+0.5;
      rayVis=Math.min(1,(LoF-0.05)/0.35);       // ease in as it swings into frame, never a pop
      // CLAMP THE SOURCE TO THE FRAME EDGE. The key sits high above the camera's view direction,
      // so its projected position lands 2-3 frame heights above the top of frame at EVERY
      // azimuth — measured 1.79 to 2.32 from the nearest on-screen pixel, against a falloff that
      // is exactly zero past 1.15. So every shaft was being gathered and then multiplied by
      // nothing: the toggle moved 0.02% of pixels against a 0.03% noise floor. Clamping the
      // emitter to just outside the frame is what screen-space god rays do when the source
      // leaves view — it preserves the DIRECTION the shafts run, which is the whole read, while
      // putting them back inside the reach of the falloff. Strength eases down with how far the
      // true light is from where it is being drawn, so nothing pops as it swings away.
      // MARGIN IS NOT FREE. At 0.55 the emitter sits at uv.y 1.55, and the falloff (zero past
      // 1.15) then excludes every pixel below uv.y ~0.45 — which is exactly the set whose march
      // upward would cross the form. What survived was the top strip, marching into empty
      // backdrop. Measured HDR luma at the peak frame: p50 0.67, p99 1.40, max 3.36, so the
      // light to gather IS there; the geometry was simply keeping the two apart. 0.15 puts the
      // emitter within reach of the pixels that can actually see the form.
      const MG=0.15;
      const cx=Math.max(-MG,Math.min(1+MG,rayX)), cy=Math.max(-MG,Math.min(1+MG,rayY));
      const off=Math.hypot(rayX-cx,rayY-cy);
      rayVis*=1/(1+off*off*0.6);
      rayX=cx; rayY=cy;
    }
    gl.uniform2f(UP('u_rayPos'),rayX,rayY);
    // Well below bloom's 2.59: high enough to exclude the backdrop and the form's mid-tones,
    // low enough that the lit edge of the form actually casts something.
    gl.uniform1f(UP('u_rayThr'),0.85);
    // Air and epicness drive it: shafts are the "big moment" effect, and the high band is what
    // reads as light in the air. Kept low — this sits on top of a bloom that already lifts the
    // same pixels, and doubling up there is how a render turns milky.
    gl.uniform1f(UP('u_rays'), raysOn
      // GAIN, MEASURED. These coefficients were tuned against the old bright pass, before its
      // threshold was raised to 2.59 to kill a bloom ring — which left the shafts gathering from
      // a buffer with 0.082% of its pixels above 0.01. They have been stale by roughly two orders
      // of magnitude ever since. Swept on a frozen peak-energy frame (position pinned via
      // startedAt so the curves keep feeding while the clock is stopped, noise floor 0):
      //   gain    20     40     80    160    320
      //   moved  1.22%  3.39%  7.10%  9.66%  11.38%
      //   lift    0.5    0.88   1.49   2.37   3.49   (mean display levels)
      // Past 160 the coverage saturates while the lift keeps climbing, which is the wash. 80 is
      // the knee: shafts that read, 1.5 levels of lift. Every term is scaled by the same 80, so
      // the relative weighting between energy, epicness and the air/high bands is untouched.
      // ATMOSPHERE gates the whole term. A shaft is only visible because there is something in
      // the air to scatter off; on a dry, transient passage there is nothing for the light to
      // catch and the beam should not be there at all. This is the signal the effect was always
      // missing — before it, shafts were driven by loudness alone and appeared over percussive
      // material that should have read as clean air.
      ? rayVis*(0.45+atmos*0.85)*(4.0+energy*12.8+epic*16.0+HITS.air*16.0+HITS.high*8.0)*DX.rays : 0);
    // press grade
    gl.uniform1f(UP('u_sharpen'),LK.sharp*DX.sharpen); gl.uniform1f(UP('u_chroma'),LK.chroma*DX.chroma);
    gl.uniform1f(UP('u_ink'),LK.ink); gl.uniform1f(UP('u_poster'),LK.poster);
    gl.uniform1f(UP('u_dither'),LK.dither); gl.uniform1f(UP('u_half'),LK.half);
    gl.uniform1f(UP('u_flat'),LK.flatTex);
    const iA=inkA(), iB=inkB();
    gl.uniform3f(UP('u_inkA'),iA[0],iA[1],iA[2]); gl.uniform3f(UP('u_inkB'),iB[0],iB[1],iB[2]);
    drawFS(aPost);
    gpuEnd();
    // Grab MUST happen here, still inside the frame that drew. The context has no
    // preserveDrawingBuffer (it costs a full-size copy every frame), so the drawing buffer is
    // cleared as soon as the browser composites — calling toBlob() from a click handler returns
    // a blank image. Setting a flag and servicing it at the end of the draw is what makes the
    // capture land on real pixels.
    if(shotPending){ shotPending=false; grabFrame(); }
    // MEASUREMENT TAP. Same reason as the grab above: this is the only point in the frame where
    // the default framebuffer is bound AND has this frame's pixels in it. Every readPixels I have
    // written outside this point read either a bound FBO or a cleared buffer.
    if(window.__TAP){ const q=window.__TAP; window.__TAP=null;
      const buf=new Uint8Array(q.w*q.h*4);
      gl.readPixels(q.x,q.y,q.w,q.h,gl.RGBA,gl.UNSIGNED_BYTE,buf);
      window.__TAPOUT={x:q.x,y:q.y,w:q.w,h:q.h,px:buf}; }
  }
}

/* ======================= EXPORT ======================= */
let shotPending=false, recorder=null, recChunks=[], recStream=null;
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); }
function saveBlob(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function grabFrame(){
  glc.toBlob(b=>{ if(!b){ showStat('Frame grab failed',true); hideStat(2200); return; }
    saveBlob(b,'atonal-'+stamp()+'.png');
    showStat('Saved '+glc.width+'x'+glc.height+' PNG'); hideStat(1600);
  },'image/png');
}
$('shot').addEventListener('click',()=>{ shotPending=true; });
function pickMime(){
  // Safari only recently gained WebM in MediaRecorder; fall back to whatever it will accept
  // rather than throwing. mp4 is the usual Safari answer.
  const want=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  for(const m of want) if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
$('rec').addEventListener('click',()=>{
  if(recorder && recorder.state==='recording'){ recorder.stop(); return; }
  if(!window.MediaRecorder || !glc.captureStream){ showStat('Recording unsupported in this browser',true); hideStat(2600); return; }
  const mime=pickMime();
  if(!mime){ showStat('No supported video codec',true); hideStat(2600); return; }
  try{
    recStream=glc.captureStream(60);
    recorder=new MediaRecorder(recStream,{mimeType:mime,videoBitsPerSecond:16000000});
  }catch(err){ showStat('Recorder failed: '+err.message,true); hideStat(3000); return; }
  recChunks=[];
  recorder.ondataavailable=e=>{ if(e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop=()=>{
    const ext=mime.indexOf('mp4')>=0?'mp4':'webm';
    saveBlob(new Blob(recChunks,{type:mime}),'atonal-'+stamp()+'.'+ext);
    recChunks=[];
    if(recStream){ recStream.getTracks().forEach(t=>t.stop()); recStream=null; }
    $('rec').textContent='Record'; $('rec').style.color='';
    showStat('Saved '+ext.toUpperCase()); hideStat(1600);
  };
  recorder.start(1000);                 // 1s timeslices: a crash still leaves usable footage
  $('rec').textContent='Stop'; $('rec').style.color='#ff4d6a';
  showStat('Recording — press Stop to save'); hideStat(1800);
});


/* ======================= CUSTOM SVG -> 2D SDF ======================= */
/* The browser already has a complete SVG renderer, so the artwork is drawn through it rather
   than parsed by hand: <img src=svg> into a canvas gives correct fill rules, holes, transforms,
   clip paths and nested groups for free. Only the resulting coverage mask matters.
   That mask is then turned into a true Euclidean signed distance field with Felzenszwalb's
   exact O(n) transform (1D parabola lower-envelope along rows, then columns). A cheap
   approximation such as a chamfer pass leaves directional bias that shows up as faceting on
   the extruded sides once the surface is lit. */
const SVG_RES = 1024;                      // field resolution: one texel = 0.00195 object units,
                                           // about one calcN epsilon (0.0018), so the normal is
                                           // read across roughly a texel rather than inside one.
                                           // Resolution alone was never the fix though — see the
                                           // sub-texel edge below for what actually caused the
                                           // terracing on the extruded walls.
const SVG_PAD = 0.18;                      // fraction of the frame left as margin, so the
                                           // distance field has somewhere to grow outside the art

function edt1d(f, n) {                     // squared distance transform of one row
  const d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  let k = 0; v[0] = 0; z[0] = -Infinity; z[1] = Infinity;
  for (let q = 1; q < n; q++) {
    let s;
    while (true) {
      s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      if (s <= z[k]) k--; else break;
    }
    k++; v[k] = q; z[k] = s; z[k + 1] = Infinity;
  }
  k = 0;
  for (let q = 0; q < n; q++) {
    while (z[k + 1] < q) k++;
    d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
  }
  return d;
}

function edt2d(mask, w, h, inside) {
  // squared distance to the nearest cell where mask != inside
  const INF = 1e20, f = new Float64Array(Math.max(w, h)), out = new Float64Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) f[x] = (mask[y * w + x] === inside) ? INF : 0;
    const d = edt1d(f, w);
    for (let x = 0; x < w; x++) out[y * w + x] = d[x];
  }
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) f[y] = out[y * w + x];
    const d = edt1d(f, h);
    for (let y = 0; y < h; y++) out[y * w + x] = d[y];
  }
  return out;
}

/** Rasterise an SVG string and return a Float32Array signed distance field in OBJECT units. */
async function svgToSDF(svgText, res = SVG_RES) {
  // Force a viewBox-independent render size. Without width/height an SVG with only a viewBox
  // has no intrinsic size and Chrome draws it at 0x0 or 300x150 depending on the markup.
  const blob = new Blob([svgText], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  try {
    await new Promise((ok, err) => { img.onload = ok; img.onerror = () => err(new Error('SVG failed to render')); img.src = url; });
    const cv = document.createElement('canvas');
    cv.width = cv.height = res;
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.clearRect(0, 0, res, res);
    // fit with margin, preserving aspect
    const iw = img.naturalWidth || img.width || res, ih = img.naturalHeight || img.height || res;
    const inner = res * (1 - SVG_PAD * 2);
    const sc = inner / Math.max(iw, ih);
    const dw = iw * sc, dh = ih * sc;
    g.drawImage(img, (res - dw) / 2, (res - dh) / 2, dw, dh);
    const px = g.getImageData(0, 0, res, res).data;

    const mask = new Uint8Array(res * res);
    const cov = new Float32Array(res * res);   // fractional coverage, kept for the sub-texel edge
    let covered = 0;
    for (let i = 0, j = 3; i < mask.length; i++, j += 4) {
      // alpha, not luminance: a black logo on transparent is the normal case and would read as
      // empty if measured by brightness
      cov[i] = px[j] / 255;
      mask[i] = px[j] > 127 ? 1 : 0;
      covered += mask[i];
    }
    if (covered === 0) throw new Error('SVG rendered empty — needs a filled shape');
    if (covered === mask.length) throw new Error('SVG covers the whole frame — no edge to extrude');

    const dOut = edt2d(mask, res, res, 1);   // distance from inside cells to the outside
    const dIn  = edt2d(mask, res, res, 0);   // distance from outside cells to the inside
    const sdf = new Float32Array(res * res);
    // object space spans [-1,1] across the texture, so one texel is 2/res units
    const k = 2 / res;
    for (let i = 0; i < sdf.length; i++) {
      sdf[i] = (mask[i] ? -Math.sqrt(dOut[i]) : Math.sqrt(dIn[i])) * k;
    }
    // Sub-texel edge, recovered from the rasteriser's own antialiasing.
    // The EDT is exact — but only about the BINARISED mask, so the boundary it measures from has
    // already been rounded to whole texels. That rounding is a sawtooth along any edge that is
    // not axis-aligned, and a sawtooth in the surface is a sawtooth in the normal: the ridges
    // running down the extruded walls. Canvas already computed the real answer while drawing —
    // a partially covered texel's alpha IS its area fraction — so for a straight edge crossing
    // the texel, the signed distance from its centre is (0.5 - coverage) texels.
    // Applied only within 1.5 texels of the boundary: further in, the EDT is the better estimate,
    // and gating on distance also means a uniformly semi-transparent fill (every texel at alpha
    // 0.5, no edge anywhere near) is left alone instead of being flattened to zero.
    const band = 1.5 * k;
    for (let i = 0; i < sdf.length; i++) {
      const a = cov[i];
      if (a > 0.004 && a < 0.996 && Math.abs(sdf[i]) < band) sdf[i] = (0.5 - a) * k;
    }
    // Then the separable 3-tap, AFTER the refinement so it smooths the corrected field.
    // Measured on a rasterised disc, angular error of the reconstructed normal along the edge
    // (rms / max), against the analytic truth:
    //     binary + bilinear                19.91 / 53.04 deg    (the original 512-era build)
    //     binary + blur                     7.32 / 23.60        (what shipped in 177f155)
    //     coverage + no blur                3.11 /  8.33
    //     coverage + blur                   2.21 /  7.15        <- here
    // Coverage is what does the work; the blur is worth a further 1.4x on top of it. A cubic
    // B-spline reconstruction in the shader was tried as well and reached 2.05 rms — 7% better
    // for four texture fetches per sample in the march's innermost loop, so it was dropped.
    const tmp = new Float32Array(sdf.length);
    for (let y = 0; y < res; y++) for (let x = 0; x < res; x++) {
      const i = y * res + x, a = x > 0 ? sdf[i - 1] : sdf[i], b = x < res - 1 ? sdf[i + 1] : sdf[i];
      tmp[i] = (a + 2 * sdf[i] + b) * 0.25;
    }
    for (let y = 0; y < res; y++) for (let x = 0; x < res; x++) {
      const i = y * res + x, a = y > 0 ? tmp[i - res] : tmp[i], b = y < res - 1 ? tmp[i + res] : tmp[i];
      sdf[i] = (a + 2 * tmp[i] + b) * 0.25;
    }
    // Silhouette extent, straight off the mask: the furthest covered texel from centre in each
    // axis. Used for framing, so an uploaded shape is fitted rather than guessed at.
    let rx = 0, ry = 0, rr = 0;
    for (let y = 0; y < res; y++) for (let x = 0; x < res; x++) {
      if (!mask[y * res + x]) continue;
      const ox = (x + 0.5) / res * 2 - 1, oy = (y + 0.5) / res * 2 - 1;
      rx = Math.max(rx, Math.abs(ox)); ry = Math.max(ry, Math.abs(oy));
      rr = Math.max(rr, Math.hypot(ox, oy));
    }
    return { sdf, res, covered: covered / mask.length, reach: rr, reachY: ry };
  } finally {
    URL.revokeObjectURL(url);
  }
}

/* ---- IMPORTED MESH: 3D distance field ----
   Baked offline (mesh -> signed distance on a grid) because doing it in the browser means an
   exact point-triangle distance for every voxel, which is minutes of work on the main thread.
   The bake is the slow, precise half; this is the fast half that just uploads the result. */
const VOL={res:160, pad:1.10, lo:-0.15, hi:0.50, url:'./assets/shape01.sdf'};
let volTex=null, volOn=false, volLoading=false;
/* Exact mesh: BVH + triangles as float textures. 0.51MB against the grid's 8.2MB, and with no
   resolution ceiling — the silhouette stays exact at any zoom and the vertex normals give
   smooth shading the grid cannot reconstruct. */
const BVH={w:256, nodes:'./assets/mesh_nodes.f32', tris:'./assets/mesh_tris.f32'};
/* ======================= SURFACE DETAIL MAP =======================
   BAKED ON THE GPU at load, into a 2048^2 RGBA16F texture, rather than loaded as a PNG.

   The PNGs it replaces were 512^2 and 8-bit, and both facts showed. MEASURED on a locked frame
   with the object filling 1474 canvas px: the detail uv spans 2.21 tiles across the form, so one
   tile covers 667 px and a 512-texel map is being MAGNIFIED 1.30x. Past 1:1 the mip chain cannot
   help — the hardware is bilinearly stretching texels, which is the "low res" read directly.
   A 2048 map at the same tile size sits at 3.07x MINIFICATION instead, which is the regime mips
   and anisotropic filtering are built for.

   8-bit was the other half. A normal packed in 8 bits steps in 2/255 = 0.0078 units, i.e. 0.45
   degrees of tilt per code. On a rough=0.35 specular lobe that is roughly a tenth of the lobe
   width, so the quantisation lands as terracing in the highlight rather than as noise below it.
   Half-float has no such floor. Where EXT_color_buffer_float is missing the bake falls back to
   RGBA8 at the same resolution — still the 4x linear win — and where the bake fails outright the
   PNG loader below is still the fallback, so nothing depends on this path succeeding.

   The content changed too, and that was the point. Measured on the shipped PNGs:
       machined   nx std 0.056  ny std 0.126  ratio 2.27   mean tilt  6.8deg  p99 19.3deg
       micro      nx std 0.186  ny std 0.186  ratio 1.00   mean tilt 13.9deg  p99 31.3deg
   A 31-degree microfacet is not microstructure, it is gravel, and a 2.27 anisotropy ratio is
   what put corduroy on the flat extruded faces. The baked presets target a few degrees of mean
   tilt and a much gentler brush. Alpha (the roughness modulation) was mean 0.49 std 0.28 in the
   PNGs, and texRough() maps it through 0.45+1.5v — so the old maps both biased roughness up 19%
   and strobed it +/-42%. The bake centres alpha on 0.367 instead, the value that makes that
   mapping return the material's own roughness unchanged, and swings it a third as far.

   Frequencies are chosen against the same locked frame. base cells span one tile, so the
   coarsest octave of `micro` (14 cells) is a 48px feature and the finest (14*8 = 112 cells) is
   6px — right at the screen's Nyquist, which is exactly where it should be: mip selection
   filters it away at this distance and it resolves when you push the camera in. That is what
   the resolution is FOR. */
const DBAKE_FS=`#version 300 es
precision highp float;
out vec4 o;
uniform vec2 u_size;
uniform vec2 u_base;        // lattice cells across one tile, coarsest octave (x may differ -> brush)
uniform float u_gain;       // per-octave amplitude falloff
uniform float u_gscale;     // gradient -> tilt scale, solved for by the calibration pass
uniform float u_rvar;       // roughness swing around neutral
uniform float u_warp;       // domain-warp amount, in cells
uniform int u_oct;

// PERIODIC hash: the lattice index is wrapped to the octave's period before hashing, so the
// field tiles exactly. Without the wrap the map has a seam, and a seam on a repeat-wrapped
// detail texture draws a visible grid over every face of the form.
//
// INTEGER hash, not fract(sin(dot(i,k))). The sin-hash projects the 2D lattice onto ONE axis
// before hashing, so every cell lying on a line of constant dot(i,k) gets a correlated value —
// and with periods this small (9..112 cells) there are few enough distinct dot products that the
// correlation is not subtle. It baked as long axis-aligned ridges, which showed on the form as
// streaking that survived the map being statistically isotropic: per-channel nx/ny variance came
// out at 1.04, because variance cannot see structure that is lined up rather than stretched.
// Confirmed by scaling the tiling 4x coarser and watching the streaks scale with it.
// A bit-mixing hash decorrelates neighbours in both axes and has no preferred direction.
float dh(vec2 i,vec2 P){
  uvec2 u=uvec2(mod(i,P));
  uint h=u.x*374761393u+u.y*668265263u;
  h=(h^(h>>13u))*1274126177u;
  return float(h^(h>>16u))*(1.0/4294967296.0);
}
// QUINTIC interpolant, not the usual cubic smoothstep. What gets sampled is the DERIVATIVE of
// this field, so the field needs a continuous SECOND derivative or the normal is only C0 and
// every lattice cell boundary shows up as a crease. 3t^2-2t^3 has a discontinuous second
// derivative; 6t^5-15t^4+10t^3 does not. This one line is most of "smooth".
// GRADIENT noise, not value noise — and this is where the residual anisotropy lived.
//
// Value noise interpolates a SCALAR per lattice point, so between two cells the field can only
// ramp along the grid axes: the interpolant itself is separable, and separable means axis-biased
// no matter how good the hash or how strong the warp. Measured over the map, the tilt-orientation
// histogram kept peaks at exactly 0 and 90 degrees at 1.44:1.
//
// An integer SHEAR was tried first, on the reasoning that it maps the lattice onto itself and so
// preserves tiling where the period is square. It does tile — and it measured 9.83:1, far worse,
// because a shear is not a rotation: it stretches as it turns, and the stretch is itself a
// direction. Rotation proper is unavailable here, since the only integer orthogonal matrices are
// the eight signed permutations.
//
// Gradient noise removes the cause instead of fighting it. Each lattice point carries a random
// DIRECTION and contributes dot(gradient, offset), so the field's variation at a cell is oriented
// by the hash rather than by the grid. Same periodic hash, so the map tiles exactly as before.
vec2 dg(vec2 i,vec2 P){ float a=dh(i,P)*6.28318530718; return vec2(cos(a),sin(a)); }
float dvn(vec2 x,vec2 P){
  vec2 i=floor(x),f=fract(x);
  vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);
  float n00=dot(dg(i,P),            f);
  float n10=dot(dg(i+vec2(1,0),P),  f-vec2(1,0));
  float n01=dot(dg(i+vec2(0,1),P),  f-vec2(0,1));
  float n11=dot(dg(i+vec2(1,1),P),  f-vec2(1,1));
  // to 0..1 to keep dvn's contract with the warp and the calibration pass unchanged
  return mix(mix(n00,n10,u.x), mix(n01,n11,u.x), u.y)*0.70710678+0.5;
}
float dheight(vec2 uv){
  float h=0.0,a=1.0,w=0.0;
  vec2 P=max(u_base,vec2(2.0));
  for(int i=0;i<8;i++){
    if(i>=u_oct) break;
    // DOMAIN WARP, per octave, and TILEABLE. Value noise on a square lattice leaves its axes in
    // the result no matter how good the hash is: measured over the whole 2048 map, the tilt
    // orientation came out 1.53:1 with peaks at exactly 0 and 90 degrees — a four-fold pattern
    // that is the lattice showing through, and on the form it reads as fine straight streaking.
    // (A per-channel nx/ny variance ratio cannot see this at all; that measured 1.04. Structure
    // that is lined up rather than stretched needs an ORIENTATION histogram to detect.)
    // Displacing the sample point by a coarser copy of the same field bends the ridges off the
    // axes. The warp is built from the same periodic hash, so shifting uv by one tile shifts the
    // warp by exactly one period and the map still tiles; the offset added inside dvn is an
    // integer lattice shift, which the mod() wrap likewise preserves.
    vec2 Pw=max(floor(P*0.5+0.5),vec2(2.0));
    vec2 wq=vec2(dvn(uv*Pw,Pw), dvn(uv*Pw+vec2(19.0,7.0),Pw))-0.5;
    // The warp bends ridges off the axes but cannot remove the lattice itself; see dvn().
    h+=a*dvn((uv+wq*(u_warp/P.x))*P, P);
    w+=a; a*=u_gain; P=floor(P*2.0+0.5);   // integer periods keep every octave tileable
  }
  return h/max(w,1e-6);
}
void main(){
  vec2 uv=gl_FragCoord.xy/u_size;
  vec2 e=1.0/u_size;
  float h =dheight(uv);
  // Central differences at one texel. The height field is band-limited well above this spacing
  // (the finest octave is ~18 texels per cell at 2048), so differencing is sampling a smooth
  // function, not amplifying the top octave the way differencing per-pixel fbm used to.
  float hx=dheight(uv+vec2(e.x,0.0))-dheight(uv-vec2(e.x,0.0));
  float hy=dheight(uv+vec2(0.0,e.y))-dheight(uv-vec2(0.0,e.y));
  vec2 g=vec2(hx,hy)/(2.0*e);            // gradient in TILE units, resolution-independent
  vec3 n=normalize(vec3(-g*u_gscale,1.0));
  // 0.367 is not arbitrary: texRough() computes base*(0.45+1.5*a), so a=0.367 returns the
  // material's roughness unchanged and the map only modulates around it.
  float a=clamp(0.367+(h-0.5)*u_rvar*2.0,0.0,1.0);
  o=vec4(n*0.5+0.5,a);
}`;
/* Preset shape of each map. tilt is a TARGET in degrees, not a gain — the bake runs once with
   unit scale, reads the gradient back, and solves for the scale that hits it. Hard-coding a gain
   instead would silently drift the moment the octave mix changed, which is how the PNGs ended up
   at 14 degrees without anyone deciding on 14 degrees. */
const DPRESET={
  // Isotropic — the fine speckle a smooth material actually has.
  //
  // TILT: 4.0 -> 2.4 -> 4.0 -> 2.4. Back where it started, and the round trip is the point.
  //
  // The cut to 2.4 was originally made to suppress striations. I raised it to 4.0 on finding that
  // those striations were the diffuse irradiance lookup (fixed in cb5d4a0), reasoning that the
  // tilt had been paying for someone else's bug. Half right: the tilt was suppressing TWO
  // artefacts, and only one of them was that lookup. The other is the map at grazing incidence on
  // a dark face, which is not a bug at all -- an isotropic perturbation entering diffuse through
  // dot(dn, L) is projected onto ONE direction, so it elongates perpendicular to the key, and on
  // an extruded form the side wall holds a near-constant normal down its whole length. Fine
  // parallel streaks are what that looks like. Every normal map does it; it just must not be
  // loud enough to see.
  //
  // Isolated on one frozen frame with the tilt as the only variable, Pearl/Matte, side wall in
  // shadow: at 4.0 the streaks are plainly visible, at 2.4 they are at the edge of detection.
  // Ruled out first, each on that same frame, each alone: the fill leg, the reflection trace,
  // the clearcoat, the iridescence, the roughness channel of the map, and the map's own content
  // (inspected at ONE TEXEL PER PIXEL via DIAG 6 -- isotropic, no streaks in it).
  //
  // Raising the bake to 8192 made it worse rather than better, which is the part worth recording:
  // the finer octaves that 2048 was mip-filtering away are now resolved, so the streaking that was
  // always in the map became visible. More resolution faithfully reproduces a flaw that lower
  // resolution was hiding.
  micro:    {base:[14,14], oct:4, gain:0.55, tilt:2.4, rvar:0.42},
  // brushed, but 1.6:1 rather than the PNG's 2.27:1 — enough to read as a direction, not enough
  // to read as corduroy across a flat face
  machined: {base:[9,14],  oct:4, gain:0.60, tilt:3.2, rvar:0.35},
};
const DETAILS={machined:'./assets/detail_machined.png', micro:'./assets/detail_micro.png'};
let detailTex=null, detailName='micro', detailScale=1.0;
let dbakeP=null, dbakeF=null, dbakeA=-1, dbakeSize=0;
// Set by the bake so a defect can be traced to what was actually uploaded rather than to what
// the preset asked for. Read it from the console.
window.__DBAKE=null;
/* BAKE RESOLUTION. 2048 was measured against a form filling 1474 canvas px, where one detail
   tile covers 667 px — 3.07x minification, comfortably inside what mips and anisotropy handle.
   The target is now 8192, and it is worth being precise about what that buys: at the SAME
   framing it buys nothing visible, because the mip chain discards the extra levels. It buys
   headroom for the camera pushing in, which is where 2048 ran out — at 4x the linear detail
   the tile stays above 1:1 until the form fills roughly four times the frame width it does now.

   The cost is memory and it is not small: 8192^2 RGBA16F is 537 MB, 683 MB once the mip chain
   is built, against 43 MB at 2048. So the size is NEGOTIATED rather than assumed. A too-large
   texImage2D does not throw — it raises a GL error and leaves the texture incomplete, which
   would surface later as a black surface rather than as a failed bake — so the error queue is
   drained first, checked after, and the framebuffer tested for completeness before anything is
   drawn into it. Anything the driver refuses is halved and retried, down to 512. Set
   window.DETAILN before a Detail change to pin a size by hand. */
// 8192 -> 4096. The case for 8192 was headroom for close framing, and the close framing is
// exactly where it was compared: at the zoom clamp the two are visually indistinguishable, while
// 8192 costs 683MB against 171MB and 344ms of bake against 104ms. A quarter of the memory for no
// visible difference is not a trade worth defending. The +5.2% high-frequency figure that
// justified 8192 still stands as a measurement; it simply does not survive being looked at.
const DETAIL_TARGET = 4096;
function bakeDetail(name){
  const P=DPRESET[name]; if(!P) return false;
  const maxDim=gl.getParameter(gl.MAX_TEXTURE_SIZE)||2048;
  const t0=performance.now();
  try{
    if(!dbakeP){ dbakeP=prog(VERT,DBAKE_FS); dbakeA=gl.getAttribLocation(dbakeP,'p'); }
    if(!detailTex) detailTex=gl.createTexture();
    if(!dbakeF) dbakeF=gl.createFramebuffer();
    gl.bindTexture(gl.TEXTURE_2D,detailTex);
    // Negotiate once; later bakes (micro <-> machined) reuse the size already agreed.
    let N=dbakeSize;
    if(!N){
      for(let want=Math.min(window.DETAILN||DETAIL_TARGET,maxDim); want>=512; want>>=1){
        while(gl.getError()!==gl.NO_ERROR){}          // drain, so the check below is ours
        if(floatOK) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,want,want,0,gl.RGBA,gl.HALF_FLOAT,null);
        else        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8 ,want,want,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
        if(gl.getError()!==gl.NO_ERROR) continue;     // driver refused this size — halve and retry
        gl.bindFramebuffer(gl.FRAMEBUFFER,dbakeF);
        gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,detailTex,0);
        const ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
        gl.bindFramebuffer(gl.FRAMEBUFFER,null);
        if(ok){ N=want; break; }
      }
      if(!N) throw new Error('no bakeable size');     // the PNG fallback below still covers this
      dbakeSize=N;
    }
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.bindFramebuffer(gl.FRAMEBUFFER,dbakeF);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,detailTex,0);
    if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE) throw new Error('bake FBO incomplete');
    gl.viewport(0,0,N,N);   // every render pass sets its own viewport, so this needs no restoring
    gl.useProgram(dbakeP);
    const U=n=>gl.getUniformLocation(dbakeP,n);
    gl.uniform2f(U('u_size'),N,N);
    gl.uniform2f(U('u_base'),P.base[0],P.base[1]);
    gl.uniform1f(U('u_gain'),P.gain); gl.uniform1f(U('u_rvar'),P.rvar);
    gl.uniform1f(U('u_warp'), (window.DWARP!==undefined)?window.DWARP:(P.warp!==undefined?P.warp:0.95));
    gl.uniform1i(U('u_oct'),P.oct);

    // PASS 1 — calibration. Bake at unit gradient scale, read a 128^2 patch back, and recover
    // the raw gradient from the encoded normal (g = -n.xy/n.z). One number comes out of it: the
    // scale that turns this octave mix into the requested mean tilt.
    gl.uniform1f(U('u_gscale'),1.0);
    drawFS(dbakeA);
    const S=128, px=floatOK?new Float32Array(S*S*4):new Uint8Array(S*S*4);
    gl.readPixels((N>>1)-(S>>1),(N>>1)-(S>>1),S,S,gl.RGBA,floatOK?gl.FLOAT:gl.UNSIGNED_BYTE,px);
    let sg=0,ng=0;
    for(let i=0;i<S*S;i++){
      const k=i*4, sc=floatOK?1:1/255;
      const nx=px[k]*sc*2-1, ny=px[k+1]*sc*2-1, nz=px[k+2]*sc*2-1;
      if(nz>1e-3){ sg+=Math.hypot(nx/nz,ny/nz); ng++; }
    }
    const meanG=ng?sg/ng:1;
    // atan is linear to within 0.3% at these angles, so one correction lands the target; there is
    // no reason to iterate.
    const tiltDeg=(window.DTILT!==undefined)?window.DTILT:P.tilt;   // console override, for tuning
    const gscale=Math.tan(tiltDeg*Math.PI/180)/Math.max(1e-6,meanG);

    // PASS 2 — the real bake.
    gl.uniform1f(U('u_gscale'),gscale);
    drawFS(dbakeA);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.bindTexture(gl.TEXTURE_2D,detailTex);
    gl.generateMipmap(gl.TEXTURE_2D);
    const ext=gl.getExtension('EXT_texture_filter_anisotropic');
    if(ext) gl.texParameterf(gl.TEXTURE_2D,ext.TEXTURE_MAX_ANISOTROPY_EXT,
                             Math.min(16,gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
    gl.bindTexture(gl.TEXTURE_2D,null);
    const err=gl.getError();
    if(err!==gl.NO_ERROR) throw new Error('GL '+err);
    detailName=name;
    window.__DBAKE={name,size:N,fmt:floatOK?'RGBA16F':'RGBA8',tiltDeg,gscale:+gscale.toFixed(4),
                    mb:+((N*N*(floatOK?8:4)*4/3)/1048576).toFixed(0),ms:+(performance.now()-t0).toFixed(0)};
    return true;
  }catch(e){
    console.warn('detail bake failed, falling back to the PNG maps:',e.message);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    return false;
  }
}
/* PNG fallback. Kept, not deleted: the bake needs a render target and a working readPixels, and
   on a context that has neither this is the difference between a plain-looking surface and no
   surface at all. */
function loadDetail(name){
  const url=DETAILS[name]||DETAILS.micro;
  return new Promise((ok,err)=>{
    const im=new Image();
    im.onload=()=>{
      if(!detailTex) detailTex=gl.createTexture();
      dbakeSize=0;      // this texture is no longer the bake's; force a realloc if one runs later
      gl.bindTexture(gl.TEXTURE_2D,detailTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,im);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.generateMipmap(gl.TEXTURE_2D);
      const ext=gl.getExtension('EXT_texture_filter_anisotropic');
      if(ext) gl.texParameterf(gl.TEXTURE_2D,ext.TEXTURE_MAX_ANISOTROPY_EXT,
                               Math.min(16,gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
      gl.bindTexture(gl.TEXTURE_2D,null);
      detailName=name; ok(detailTex);
    };
    im.onerror=()=>err(new Error('could not load '+url));
    im.src=url;
  });
}
let bvhNodeTex=null, bvhTriTex=null, meshOn=false, bvhLoading=false;
async function loadBVH(){
  if((bvhNodeTex&&bvhTriTex)||bvhLoading) return bvhNodeTex;
  bvhLoading=true;
  try{
    const [a,b]=await Promise.all([fetch(BVH.nodes,{cache:'force-cache'}),
                                   fetch(BVH.tris ,{cache:'force-cache'})]);
    if(!a.ok||!b.ok) throw new Error('HTTP '+a.status+'/'+b.status);
    const mk=(buf)=>{
      const f=new Float32Array(buf);
      const rows=f.length/(BVH.w*4);
      if(!Number.isInteger(rows)) throw new Error('not a whole number of rows: '+f.length);
      const t=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,t);
      // NEAREST and no mips: these are DATA, not an image. Filtering them would blend a
      // bounding box into a triangle index and produce garbage geometry.
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,BVH.w,rows,0,gl.RGBA,gl.FLOAT,f);
      gl.bindTexture(gl.TEXTURE_2D,null);
      return t;
    };
    bvhNodeTex=mk(await a.arrayBuffer());
    bvhTriTex =mk(await b.arrayBuffer());
    return bvhNodeTex;
  } finally { bvhLoading=false; }
}
async function loadVolume(){
  if(volTex||volLoading) return volTex;
  volLoading=true;
  try{
    const r=await fetch(VOL.url,{cache:'force-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const buf=await r.arrayBuffer();
    const need=VOL.res*VOL.res*VOL.res*2;
    if(buf.byteLength!==need) throw new Error('expected '+need+' bytes, got '+buf.byteLength);
    const u16=new Uint16Array(buf);
    volTex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_3D,volTex);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_R,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    // Decode to R32F rather than uploading the uint16 directly. An integer texture (R16UI)
    // cannot be linearly filtered and does not sample as float — it would have to be fetched
    // per-texel and interpolated by hand, which is the one thing the hardware is for. R16
    // normalised is not in core WebGL2 (it needs EXT_texture_norm16), so R32F it is; the SVG
    // field already relies on the same format and filtering path.
    const f32=new Float32Array(u16.length);
    const k=(VOL.hi-VOL.lo)/65535;
    for(let i=0;i<u16.length;i++) f32[i]=u16[i]*k+VOL.lo;
    gl.texImage3D(gl.TEXTURE_3D,0,gl.R32F,VOL.res,VOL.res,VOL.res,0,gl.RED,gl.FLOAT,f32);
    gl.bindTexture(gl.TEXTURE_3D,null);
    return volTex;
  } finally { volLoading=false; }
}
let svgTex = null, svgOn = false;
function uploadSDF(sdf, res) {
  if (!svgTex) {
    svgTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, svgTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  } else gl.bindTexture(gl.TEXTURE_2D, svgTex);
  // R32F: an 8-bit field quantises to ~1/256 of the range, and the march reads the value as a
  // step length — the stair-stepping shows directly as terracing on the extruded sides.
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, res, res, 0, gl.RED, gl.FLOAT, sdf);
  gl.bindTexture(gl.TEXTURE_2D, null);
}

async function loadSVGShape(text, name) {
  showStat('Building distance field…', false);
  try {
    const { sdf, res, reach, reachY } = await svgToSDF(text);
    uploadSDF(sdf, res);
    svgReach = Math.max(0.2, reach); svgReachY = Math.max(0.2, reachY);
    svgOn = true;
    $('selShape').value = 'svg';
    autoShape = false;
    showStat('Shape — ' + name); hideStat(1800);
  } catch (err) {
    showStat(err.message || 'Could not read that SVG', true); hideStat(3600);
  }
}

/* ======================= CAMERA INPUT ======================= */
/* Pointer Events rather than mouse+touch pairs: one code path covers mouse, trackpad and touch,
   and setPointerCapture keeps the drag alive when the pointer leaves the canvas — without it a
   fast flick that exits the window leaves the camera stuck mid-drag. */
(() => {
  const c = glc;
  let lastX = 0, lastY = 0, lastT = 0, id = null, moved = 0;
  c.style.cursor = 'grab';

  c.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    id = e.pointerId; dragging = true; moved = 0;
    lastX = e.clientX; lastY = e.clientY; lastT = e.timeStamp;
    userAzV = userElV = 0;                 // a new grab cancels the previous throw
    // Capture is an optimisation, not a requirement: it keeps a fast drag alive past the window
    // edge. It throws if the pointer is no longer active — which happens if the button is
    // released between the event firing and this handler running — and an exception here would
    // abandon the drag with `dragging` stuck true and the cursor wrong. The drag works without
    // it, so failure is not worth propagating.
    try { c.setPointerCapture(id); } catch { /* drag continues uncaptured */ }
    c.style.cursor = 'grabbing';
  });

  c.addEventListener('pointermove', (e) => {
    if (!dragging || e.pointerId !== id) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const dtms = e.timeStamp - lastT;
    lastX = e.clientX; lastY = e.clientY; lastT = e.timeStamp;
    moved += Math.abs(dx) + Math.abs(dy);
    // Scale by viewport height so the same physical drag turns the camera the same amount on
    // any window size.
    const k = 3.0 / Math.max(1, innerHeight);
    userAz -= dx * k;
    userEl = Math.max(-1.15, Math.min(1.15, userEl + dy * k));
    // Release velocity from the REAL time between events, not an assumed 60Hz frame. Dividing
    // by a hardcoded 1/60 makes the throw a function of the pointer's report rate rather than
    // the hand's actual speed: on a slow event stream it over-scales enormously (a two-event
    // synthetic drag threw the camera through several revolutions and pinned elevation at the
    // clamp), and on a 120Hz trackpad it under-scales. Clamped as well, so one anomalous
    // sub-millisecond gap cannot produce a spin nothing can damp in time.
    const inv = 1000 / Math.max(8, Math.min(100, dtms || 16));
    userAzV = Math.max(-3, Math.min(3, -dx * k * inv));
    userElV = Math.max(-3, Math.min(3,  dy * k * inv));
  });

  const end = (e) => {
    if (e.pointerId !== id) return;
    dragging = false; id = null;
    c.style.cursor = 'grab';
    // A click that never moved is a click, not a throw — kill the inertia so a stray tap does
    // not send the camera spinning.
    if (moved < 3) { userAzV = 0; userElV = 0; }
  };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);

  c.addEventListener('wheel', (e) => {
    e.preventDefault();
    // Exponential so each notch is the same proportional step whether you are close or far;
    // clamped so the camera can never end up inside the form or lost in space.
    userZoom = Math.max(0.45, Math.min(3.0, userZoom * Math.exp(e.deltaY * 0.0012)));
  }, { passive: false });

  // Double-click restores the Director's own framing.
  c.addEventListener('dblclick', () => {
    userAz = 0; userEl = 0; userZoom = 1; userAzV = 0; userElV = 0;
  });
})();

// ---- shape parameters ----
// 'input' not 'change': these want to update while the slider is being dragged, which is the
// whole point of a live parameter. The colour pickers below bind the same event for the same
// reason, and binding 'change' there once cost an afternoon of thinking the control was dead.
function bindPrm(id,key,scale,fmt){
  const el=$(id), out=$(id+'V');
  const apply=()=>{ PRM[key]=(+el.value)*scale; out.textContent=fmt(PRM[key]); };
  el.addEventListener('input',apply); apply();
}

$('selShape').addEventListener('change',e=>{ const v=e.target.value;
  if(v==='mesh'){
    // BOTH: the BVH draws the primary ray exactly, while the baked field still answers the
    // ambient-occlusion, shadow and reflection-occlusion marches, which only need an
    // approximate distance and would cost far more as BVH traversals.
    volOn=true; meshOn=true; svgOn=false; autoShape=false;
    showStat('Loading mesh…',false);
    Promise.all([loadVolume(), loadBVH()])
      .then(()=>{ showStat('Reference mesh — exact'); hideStat(1600); })
      .catch(err=>{ volOn=false; meshOn=false;
        // A page opened from disk cannot fetch its own assets — the browser blocks it. That is
        // a different problem from a missing file, and saying "mesh failed" for it sends people
        // looking for a bug that is not there.
        showStat(FILE_MODE
          ? 'Opened from file:// — the browser blocks loading the mesh. Open http://localhost:8770/viewer.html'
          : 'Mesh failed — '+err.message, true);
        hideStat(FILE_MODE?12000:4200); });
    return;
  }
  volOn=false; meshOn=false;
  if(v==='svg'){ if(svgTex){ svgOn=true; autoShape=false; } else $('svgfile').click(); return; }
  svgOn=false;
  if(v==='auto'){ autoShape=true; } else { autoShape=false; setMode(+v); } });

$('selDetail').addEventListener('change',e=>{ const v=e.target.value;

  if(v==='off'){ if(detailTex) gl.deleteTexture(detailTex); detailTex=null; dbakeSize=0; detailName='off'; return; }
