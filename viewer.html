<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATONAL — AI Director Viewer</title>
<style>
  :root{--mono:ui-monospace,"SF Mono",Menlo,monospace;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050506;overflow:hidden;font-family:var(--mono);color:#e6e6e4}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #hud{position:fixed;top:18px;left:20px;z-index:10;font-size:11px;letter-spacing:.04em;line-height:1.7;
    text-shadow:0 1px 3px #000;pointer-events:none}
  #hud b{color:#fff} #hud .k{color:#8a8b91;text-transform:uppercase;font-size:9px;letter-spacing:.16em}
  #next{color:#b9a7ff}
  #bar{position:fixed;left:20px;right:20px;bottom:18px;z-index:10;display:flex;align-items:center;gap:14px}
  button,label.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:3px;
    color:#e6e6e4;padding:8px 14px;font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  button:hover,label.btn:hover{background:rgba(255,255,255,.12)}
  #tl{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:3px;position:relative;cursor:pointer}
  #tlF{position:absolute;left:0;top:0;bottom:0;background:#c8b8ff;border-radius:3px;width:0}
  #tlS{position:absolute;inset:0}
  #tlS i{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.25)}
  #tc{font-size:10px;color:#8a8b91;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
  #file,#svgfile{display:none}
  #bar .grp{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#5a5a5d}
  #bar button.on{background:rgba(200,184,255,.20);border-color:rgba(200,184,255,.48);color:#e8e0ff}
  #drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:9;pointer-events:none}
  #drop h2{margin:0;font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:#8a8b91}
  #drop p{margin:0;font-size:10px;letter-spacing:.16em;color:#5a5a5d;text-transform:uppercase}
  #stat{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:12;padding:8px 16px;
    background:rgba(14,14,17,.85);border:1px solid rgba(255,255,255,.12);border-radius:3px;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:#cfcfd4;display:none;backdrop-filter:blur(12px)}
  #statBar{display:none;width:190px;height:3px;background:rgba(255,255,255,.16);border-radius:2px;
    overflow:hidden;margin-left:4px}
  #statFill{display:block;height:100%;width:0%;background:currentColor;border-radius:2px;
    transition:width .18s linear}
  #statPct{display:none;min-width:34px;text-align:right;opacity:.65;font-variant-numeric:tabular-nums}
  #stat.busy #statBar,#stat.busy #statPct{display:block}
  .err{color:#ffb4b4!important}
  #ctrl{position:fixed;top:16px;right:18px;z-index:11;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  #ctrl .row{display:flex;align-items:center;gap:8px}
  #ctrl label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8a8b91}
  #ctrl select{background:rgba(14,14,17,.85);color:#e6e6e4;border:1px solid rgba(255,255,255,.18);border-radius:3px;
    padding:5px 8px;font:inherit;font-size:10px;letter-spacing:.06em;backdrop-filter:blur(12px)}
  #ctrl input[type=color]{width:26px;height:22px;padding:0;border:1px solid rgba(255,255,255,.22);border-radius:3px;
    background:transparent;cursor:pointer}
  #ctrl input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  #ctrl input[type=color]::-webkit-color-swatch{border:0;border-radius:2px}
  /* Compact buttons for the panel. The bar's 8px/14px padding is sized for a wide strip and
     wraps the panel to an unusable width. */
.row input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:rgba(255,255,255,.16);
    border-radius:2px;outline:none;margin:0}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
    border-radius:50%;background:#c8b8ff;cursor:pointer;border:0}
  .row .val{font-size:9px;color:#cfcfd4;min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
  #ctrl button.mini{padding:5px 9px;font-size:9px;letter-spacing:.10em;backdrop-filter:blur(12px);
    background:rgba(14,14,17,.85)}
  #ctrl button.mini:hover{background:rgba(255,255,255,.14)}
  #ctrl button.mini.on{background:rgba(200,184,255,.20);border-color:rgba(200,184,255,.48);color:#e8e0ff}
  /* Groups sit slightly apart from the selects so the panel reads as two zones, not one list. */
  #ctrl .row.grp{margin-top:2px}
  #ctrl .row.grp label{align-self:center}
</style>

<canvas id="gl"></canvas>

<div id="hud">
  <div><span class="k">Genre</span> <b id="hGenre">—</b></div>
  <div><span class="k">Tempo</span> <b id="hBpm">—</b></div>
  <div><span class="k">Section</span> <b id="hSec">—</b></div>
  <div><span class="k">Mood</span> <b id="hMood">—</b></div>
  <div id="hIntent" style="color:#9a9aa2;max-width:34ch"></div>
  <div><span class="k">Next</span> <b id="next">—</b></div>
</div>

<div id="ctrl">
  <div class="row"><label>Shape</label><select id="selShape">
    <option value="auto">Auto · Director</option>
    <option value="0" selected>Triskelion</option><option value="1">Clover</option>
    <option value="2">Arc</option><option value="3">Chevron</option>
    <option value="4">Wave</option><option value="5">Plate</option>
    <option value="mesh">Reference mesh</option>
    <option value="svg">Custom SVG…</option></select></div>
  <!-- SHAPE PARAMETERS. These apply to every form, because they act on the extrusion and the
       profile rather than on any one profile's construction: Segments is the radial repeat count,
       Edge scales the bevel, Mass the stroke weight of the profile, Depth the extrusion. The
       audio still drives all four underneath — these are offsets on top of the Director, not
       replacements for it, so a track still animates the form it is given. -->
  <div class="row"><label>Segments</label><input type="range" id="pSeg" min="2" max="8" step="1" value="3"><span class="val" id="pSegV">3</span></div>
  <div class="row"><label>Edge</label><input type="range" id="pEdge" min="30" max="220" step="1" value="100"><span class="val" id="pEdgeV">1.00</span></div>
  <div class="row"><label>Mass</label><input type="range" id="pMass" min="-60" max="120" step="1" value="0"><span class="val" id="pMassV">0.00</span></div>
  <div class="row"><label>Depth</label><input type="range" id="pDepth" min="30" max="260" step="1" value="100"><span class="val" id="pDepthV">1.00</span></div>
  <div class="row"><label>Material</label><select id="selMat">
    <option value="pearl" selected>Pearl</option><option value="glass">Glass</option>
    <option value="clay">Clay</option>
    <option value="frosted">Frosted</option><option value="holo">Holographic</option></select></div>
  <div class="row"><label>Scene</label><select id="selScene">
    <option value="field" selected>Colour field</option><option value="studio">Studio</option></select></div>
  <div class="row"><label>Look</label><select id="selLook">
    <option value="studio">Studio</option>
    <option value="label">Label</option><option value="riso">Riso</option>
    <option value="xerox">Xerox</option><option value="halftone">Halftone</option>
    <option value="chrome">Chrome</option><option value="clean">Clean</option>
    <option value="hard" selected>Hard surface</option></select></div>
  <div class="row"><label>Palette</label><select id="selPal">
    <option value="auto" selected>Auto · Director</option>
    <option value="blood">Blood</option><option value="acid">Acid</option>
    <option value="ultra">Ultra</option><option value="cyber">Cyber</option>
    <option value="solar">Solar</option><option value="mono">Mono</option>
    <option value="studio">Studio (light)</option>
    <option value="custom">Custom</option></select></div>
  <!-- Default is the ISOTROPIC map. Machined is still here, and it is now a mild 1.6:1 brush
       rather than the 2.27:1 the PNG had, but any directional map reads as streaking on the
       large flat faces of an extruded profile — which is not what these forms want by default. -->
  <div class="row"><label>Detail</label><select id="selDetail">
    <option value="micro" selected>Micro tooth</option>
    <option value="machined">Machined</option>
    <option value="off">None</option></select></div>
  <!-- Surface belongs HERE, with the other look controls, not in the quality row it was removed
       from. It is not a quality axis: it decides whether the object has microstructure at all,
       which is an aesthetic decision the way Material and Finish are. It is also not the same
       switch as Detail:None — that only drops the normal map, while this additionally gates the
       iridescence banding and the specular sweep, so it is the one that gives a genuinely
       featureless surface. -->
  <div class="row grp"><label>Surface</label>
    <button id="surf" class="mini on" title="Micro surface detail — off gives a perfectly smooth object">Textured</button></div>
  <div class="row"><label>Finish</label><select id="selFinish">
    <option value="satin" selected>Satin</option>
    <option value="matte">Matte</option>
    <option value="gloss">Gloss</option></select></div>
  <div class="row"><label>Colors</label>
    <input type="color" id="colA" value="#2a0410" title="Background — deep tone">
    <input type="color" id="colB" value="#ff1f4b" title="Background — accent tone"></div>
  <!-- Toggles live here rather than in the transport bar. The bar had grown to nine buttons,
       two of them both reading "Auto" (camera orbit and render scale), which is the point at
       which a control strip stops being scannable. Transport keeps only what plays the track;
       everything that changes how it LOOKS belongs with the other look controls. -->
  <div class="row grp"><label>View</label>
    <button id="auto" class="mini on" title="Director's automatic orbit — drag the canvas to take over">Orbit</button>
    <button id="reset" class="mini" title="Return to the Director's framing (or double-click the canvas)">Reset</button></div>
  <!-- One axis, not three. Auto / Rays / Surface asked the viewer to understand a render-scale
       governor, a volumetric toggle and a normal-map switch in order to answer "make it look
       better" — and two of the three were named after their implementation. Quality is now a
       single ladder, and the individual switches remain reachable from the console (raysOn,
       surfTarget, STEP.shaN) for measuring. -->
  <div class="row grp"><label>Quality</label>
    <button id="qPreview" class="mini" title="Fast — half shadow samples, no shafts, coarser march. For scrubbing and setup.">Preview</button>
    <button id="qHigh" class="mini on" title="Full shadows, shafts, surface detail, render scale adapting to hold frame rate">High</button>
    <button id="qUltra" class="mini" title="Supersampled, 200 shadow samples, finest march — adapts between 1.15x and 1.60x to stay usable">Ultra</button></div>
  <div class="row grp"><label>Capture</label>
    <button id="shot" class="mini" title="Save the current frame as a PNG">Frame</button>
    <button id="rec" class="mini" title="Record the canvas to a WebM video">Record</button></div>
</div>

<div id="drop"><h2>ATONAL · AI Director</h2><p>Load a track — the engine will analyse &amp; direct</p></div>
<div id="stat"><span id="statTxt">…</span><span id="statBar"><i id="statFill"></i></span><span id="statPct"></span></div>

<div id="bar">
  <span class="grp">Source</span>
  <label class="btn" for="file">Load</label><label class="btn" for="svgfile" title="Upload an SVG and extrude it as a new shape">SVG</label><input id="file" type="file" accept="audio/*"><input id="svgfile" type="file" accept=".svg,image/svg+xml">
  <button id="play">Play</button>
  <div id="tl"><div id="tlF"></div><div id="tlS"></div></div>
  <span id="tc">0:00 / 0:00</span>
</div>

<script>
const SERVER = location.hostname && location.protocol.startsWith('http')
  ? location.origin.replace(/:\d+$/, ':8770') : 'http://127.0.0.1:8770';
const $=id=>document.getElementById(id);
window.__errs=[];
function __showErr(m){ let d=document.getElementById('__err'); if(!d){ d=document.createElement('div'); d.id='__err';
  d.style.cssText='position:fixed;left:12px;bottom:70px;z-index:999;max-width:64ch;padding:10px 12px;background:rgba(40,8,8,.94);border:1px solid #f66;border-radius:4px;color:#fbb;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap'; document.body.appendChild(d);} d.textContent=m; }
addEventListener('error',e=>{ const m=(e.error&&(e.error.stack||e.error.message))||e.message||'error'; window.__errs.push(String(m)); __showErr('JS ERROR:\n'+m); });
addEventListener('unhandledrejection',e=>{ const m=(e.reason&&(e.reason.stack||e.reason.message))||e.reason; window.__errs.push('promise: '+m); __showErr('PROMISE ERROR:\n'+m); });

/* A page opened straight from disk is an OPAQUE ORIGIN. The browser refuses its calls to the
   local server — often without even sending the request — and XHR is only told "network error",
   which is indistinguishable from the server being down. The viewer used to relay that as
   "server unreachable, run python server.py", which sends you off to restart a server that is
   already running and cannot be the problem. Rendering works fine from file://; only the
   analysis round-trip does not, so this is a notice rather than a refusal to start. */
const FILE_MODE = location.protocol === 'file:';
if(FILE_MODE){
  __showErr('Opened from a file:// path.\n\nThe browser blocks this page from reaching the '
    +'analysis server, so Load cannot work here — the server being "unreachable" is the browser '
    +'refusing, not the server being down.\n\nOpen this instead:\n  http://127.0.0.1:8770/viewer.html');
}

/* ======================= WEBGL ======================= */
const glc=$('gl');
const gl=glc.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:false});
let floatOK=false;
if(gl){ floatOK=!!gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear'); }

const VERT=`#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;

const SCENE=`#version 300 es
precision highp float;
// GLSL ES 3.00 gives sampler2D and samplerCube a default precision in the fragment stage but
// NOT sampler3D — declaring one without this is a COMPILE ERROR, which takes the whole scene
// shader down and leaves the viewer with nothing on screen at all.
precision highp sampler3D;
out vec4 o;
uniform vec2 u_res; uniform float u_time;
uniform vec3 u_ro,u_rt,u_up,u_fw; uniform float u_fov;
uniform float u_spin;
uniform float u_wob,u_tilt,u_iridHue,u_mode,u_mode2,u_mix,u_reform;
uniform float u_edgeVar,u_thickVar,u_chamf;   // shape refinement; see extr()
/* HARD-SURFACE LOOK. Three levers, all zero in every other look, so this costs nothing when off.
   The target is what makes a flat-shaded product render legible: each face holds ONE tone, and
   the faces meet at a line rather than a fillet. Measured against a reference doing exactly that,
   the difference was not subtle -- a luminance histogram of face interiors there falls into three
   tight clusters, one per face family, where this engine's was a continuous smear across 33 bins
   with no clusters at all. A gradient over every surface is precisely what stops planes reading
   as planes. */
uniform float u_bevK;      // multiplies the extrusion bevel: 1 = the sculpted fillet, ~0.2 = an edge
uniform float u_hardAmb;   // 0 = irradiance follows the normal, 1 = one ambient tone for every face
uniform float u_hardWrap;  // 0 = wide wrapped fill (soft terminator), 1 = tight fill (hard one)
uniform float u_hardAmbK;  // flat-ambient gain, and u_hardKeyK the key gain: together the ratio
uniform float u_hardKeyK;
uniform float u_segN,u_pEdge,u_pDepth;        // user shape parameters
uniform float u_room;                         // reflected room structure, 0 = plain gradient
uniform vec3 u_mood; uniform float u_energy,u_tension,u_arousal,u_darkness,u_env,u_pulse,u_flux,u_bgAmt;
uniform float u_metal,u_rough,u_reflect,u_iridAmt,u_transl,u_emis,u_trans;
uniform float u_cc,u_ccRough,u_sssD;   // clearcoat weight/roughness; subsurface extinction
// Thin-film BAND FREQUENCY. This was hard-coded at 1.7, which puts roughly ONE colour cycle
// across the whole fresnel range — that reads as a faint tint, which is right for pearl and is
// why the holo preset never looked holographic. Real holo film shows many bands across a
// curved surface; it is the band COUNT, not the saturation, that makes it read as foil.
uniform float u_iridFreq,u_tintAmt;
// SURFACE GATE, 1 = detail on, 0 = smooth. The fbm field 'av' feeds three separate terms and
// only one of them (the albedo grain) was scaled by u_txRough, so switching surface detail off
// still left noise modulating the colour sweep AND the thin-film phase. That is the cloudy
// mottling that survived both the Smooth toggle and 2x supersampling — it is not aliasing and
// not a texture, it is noise driving a COLOUR channel that nothing was turning down.
uniform float u_surf;
// SCENE-SIDE ABLATION. Companion to the DX{} switches on the post pass: x=AO, y=self-shadow,
// z=the fbm geometry displacement, w=the two-tone colour sweep, each 1 = on, 0 = off. Reasoning
// about which term produces a given artefact has been wrong here more often than it has been
// right, so the terms are switchable at runtime and the question gets settled by turning them
// off one at a time. Set from the console: DXS.ao=0.
uniform vec4 u_dxs;
// WHITE FURNACE TEST. 1 = the environment returns exactly 1.0 in every direction and every
// direct source is off. A lossless white dielectric lit by a uniform unit environment must
// return exactly 1.0 at every pixel: anything above is energy the BRDF is inventing, anything
// below is energy it is losing. It is the only way to tell "this material is too bright" from
// "this material is lit too brightly", and those two have opposite fixes. Set DXS.furnace=1.
uniform float u_furnace;
uniform float u_spec,u_alb,u_absorb;
uniform float u_txScale,u_txAmp,u_txAniso,u_txRough;   // per-material surface texture
uniform float u_twoTone;                               // colourway separation across the form
uniform vec3 u_bgA,u_bgB; uniform float u_bgAuto,u_groundY,u_scene;
// per-band sound reaction: hits (transient) + levels (sustained), one per frequency band
uniform float u_hSub,u_hLow,u_hMid,u_hHigh,u_hAir;
uniform float u_bLow,u_bHigh,u_bAir;
uniform float u_shock,u_shockA;
// emotion -> geometry: these drive the construction parameters of the forms
uniform float u_gTwist,u_gDense,u_gThick,u_gCut;
uniform sampler2D u_svg;            // R = signed distance, in object units, from the uploaded SVG
uniform sampler3D u_vol;            // baked 3D distance field of an imported mesh
uniform float u_volOn,u_volPad,u_nEps;
uniform sampler2D u_bvhNodes,u_bvhTris;   // packed BVH: 2 texels/node, 6 texels/triangle
uniform float u_meshOn,u_stepK,u_stepFar;
uniform int u_shaN;
uniform sampler2D u_detail;          // RGB = tangent-space normal, A = roughness modulation
uniform float u_detailOn,u_detailScale;
uniform float u_diag;                // 0 off; 1 triplanar weights; 2 geometric normal; 3 detail deviation; 4 blend RMS
uniform float u_svgOn,u_svgDepth,u_svgBevel,u_svgPad;
uniform float u_valence,u_warmth,u_epic;
uniform float u_keyPulse,u_rimPulse;   // lights breathing with the beat; see the JS that sets them
uniform float u_fill;                  // directional fill leg of the rig; 0 ablates it (DXS.fill)
uniform float u_kvar;                  // cap on the Toksvig specular-AA roughness widening
uniform float u_hwlod;                 // 1 = hardware mip selection instead of the analytic one (A/B)
uniform float u_nobound;               // 1 = march unbounded, as before the ray/sphere test (A/B)
uniform float u_bmarg;                 // extra bounding radius, for testing whether the bound clips
uniform float u_mipflat;               // 1 = let mip averaging flatten the normal; 0 = the old re-inflate (A/B)
uniform float u_trivar;                // 1 = variance-normalise the triplanar blend (A/B)
#define PI 3.14159265
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float h31(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
// QUINTIC interpolant, not cubic smoothstep — and this is the "low poly" faceting.
//
// This noise displaces the SDF, so what the shading reads is not the field but its GRADIENT, and
// how the gradient VARIES across a pixel is the second derivative. 3t^2-2t^3 is C1 only: its
// second derivative jumps at every lattice boundary, so the normal is continuous but kinked, and
// a kinked normal on a smooth body is exactly a flat facet with a straight edge. The displacement
// runs at 2.0-4.8 cells per unit, which puts those cells at 30-60 screen px at working framing —
// the size of the polygons that were visible on the Clover.
//
// 6t^5-15t^4+10t^3 has zero first AND second derivative at both ends, so the cells join with no
// crease. The bake shader worked this out for the detail map and says so in its own comment; the
// same argument applies with far more force here, where the field is the geometry rather than a
// texture. Isolated by ablation: DXS.disp = 0 removed the faceting completely and nothing else
// did.
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*f*(f*(f*6.-15.)+10.);
  float a=h31(i),b=h31(i+vec3(1,0,0)),c=h31(i+vec3(0,1,0)),d=h31(i+vec3(1,1,0));
  float e=h31(i+vec3(0,0,1)),g=h31(i+vec3(1,0,1)),hh=h31(i+vec3(0,1,1)),k=h31(i+vec3(1,1,1));
  return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(e,g,f.x),mix(hh,k,f.x),f.y),f.z);}
float sdBox(vec3 p,vec3 b){vec3 d=abs(p)-b;return length(max(d,0.))+min(max(d.x,max(d.y,d.z)),0.);}
float sdRBox(vec3 p,vec3 b,float r){vec3 d=abs(p)-b+r;return length(max(d,0.))+min(max(d.x,max(d.y,d.z)),0.)-r;}
float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float smax(float a,float b,float k){return -smin(-a,-b,k);}
float fbm(vec3 p){float v=0.,a=.5;for(int i=0;i<2;i++){v+=a*n3(p);p*=2.03;a*=.5;}return v;}
// TEXTURE NOISE — 5 octaves, normalised. A procedural material has no texel grid to raise, so
// its resolution IS its octave count: 2 octaves can only ever produce soft blobs at one scale.
// Five spanning ~32:1 in frequency give a surface that carries coarse variation, mid grain and
// fine tooth simultaneously, which is what reads as a real, high-resolution material. The
// offset per octave decorrelates them so the layers do not stack into visible lattice beats.
// SURFACE-DETAIL NOISE. Two things were tried here to deliver "higher resolution" texture and
// both were measured and reverted; the note is kept so they are not re-derived.
//
// 1. MORE OCTAVES (5 -> 7). Detail is amplitude x frequency, and this series has gain 0.42, so
//    octave 6 carries 0.42^5 and octave 7 carries 0.42^6 of the base — together about 4% of the
//    total amplitude for 40% more noise evaluations. Octave count is simply not the lever.
// 2. PROCEDURAL MIPMAPPING — fading each octave as its period approaches the pixel footprint,
//    via fwidth of the object-space position. Correct in principle, and it would matter for a
//    flat-gain series, but measured against a frozen frame it moved pixel-scale energy inside the
//    silhouette by 1.5-3.1% across four materials, with one material NEGATIVE. That is noise.
//    It has nothing to filter for the same reason as above: the octaves fine enough to alias are
//    the ones already carrying almost no amplitude.
//
// The lever that does work is the BASE frequency, tscale, which is per-material and was raised
// by roughly half. Detail lives in the first two or three octaves; everything past that is tooth.
float fbmT(vec3 p){
  float v=0., a=0.5, s=0.0;
  // GAIN MUST BE BELOW 1/LACUNARITY. This noise drives a NORMAL, so what matters is the
  // gradient, and octave k contributes gradient ~ (gain*lacunarity)^k. At gain 0.55 with
  // lacunarity 2.13 that is 1.17^k — RISING, so the finest octave dominated the normal and
  // every material read as sandblasted whatever the amplitude. At 0.42 it is 0.89^k: the
  // coarse form leads, and the fine octaves add tooth underneath it instead of burying it.
  for(int i=0;i<5;i++){ v+=a*n3(p); s+=a; p=p*2.13+17.3; a*=0.42; }
  return v/s;
}
/* ============ COMPLEX GEOMETRIC FORMS ============
   Hard-surface constructions: rounded and chamfered primitives combined with booleans,
   polar/grid arrays and smooth blends — the language of product design, not fractals.
   The emotion curves drive the CONSTRUCTION parameters (twist, density, thickness, cut). */
/* ---- FORMS ----
   Pierced shells, fitted to the reference mesh rather than guessed at.

   Three measurements drove every constant here, and each overturned an assumption:

   1. The reference has NO symmetry. Aligned to its own principal axes, every candidate
      operation (2-fold, 3-fold, 4-fold, inversion) still leaves a mean vertex error of
      0.16-0.30, and its half-extents are 0.894 / 1.134 / 1.321 — all different. Perfectly
      symmetric forms read as generated, which is what the earlier sets were. The bodies here
      are anisotropic for that reason.
   2. It is HOLLOW. Solid fraction 0.0217 of the sampled volume; a solid body with bores cannot
      get below 0.0322 without breaking into pieces. That gap is the whole difference — the
      reference is a shell of about 0.13 wall, not a lump with holes drilled in it.
   3. Bore radius is bounded by CONNECTIVITY, not by taste. Past roughly 0.48 on these bodies
      the shell separates into 2-6 components. Each radius below was fitted by sweeping until
      the solid fraction matched the reference with the form still in one piece; every one is
      within 8% of 0.0217.

   Irregularity comes from the BODY only. Jittering the bore axes was tried and abandoned: it
   fragmented four of six variants, and connectivity matters more than subtle asymmetry.

   All six measured at max positive directional derivative 1.00 — the march cannot overshoot. */
float sdEllip(vec3 p,vec3 R){                          // conservative: scale by the SMALLEST radius
  return (length(p/R)-1.0)*min(R.x,min(R.y,R.z));
}
float shellBody(vec3 p,vec3 R,float t){                // hollow, not solid — see (2) above
  return max(sdEllip(p,R), -sdEllip(p,R-vec3(t)));
}
float boreSub(float d,vec3 p,vec3 a,float r,float k){
  return smax(d, -(length(p-a*dot(p,a))-r), k);        // a must be unit length
}
vec3 tetAxis(int i){
  vec3 a=(i==0)?vec3( 1, 1, 1):(i==1)?vec3( 1,-1,-1):
         (i==2)?vec3(-1, 1,-1):vec3(-1,-1, 1);
  return a*0.5773502692;
}
float boreTet(float d,vec3 p,float r,float k){
  for(int i=0;i<4;i++) d=boreSub(d,p,tetAxis(i),r,k);
  return d;
}
/* ================= EXTRUDED PROFILE SHAPES =================
   Rebuilt to the reference's form language. The previous set were ellipsoid shells with holes
   bored through them — organic blobs, which is why they read as lumps of material rather than as
   designed objects however good the shading got. The reference forms are EXTRUDED 2D PROFILES:
   a flat front face, a flat back face, straight side walls between them, and a small rounded
   bevel where face meets wall. That bevel is the whole thing visually — it is a narrow, almost
   cylindrical band that sweeps a specular highlight along the entire silhouette as the form
   turns, and it is what separates a "designed object" from a "blob" long before material or
   lighting get a say.

   Built the same way mSVG already extrudes uploaded artwork, so the two paths agree: define the
   profile in 2D, inflate by the bevel, extrude, deflate. Profiles are composed from rounded
   capsules and discs, because a rounded-capsule union gives exactly the fat, even-weight stroke
   the reference draws with, and its distance field stays close to euclidean so the march does
   not slow down. */
float s2Seg(vec2 p,vec2 a,vec2 b,float r){
  vec2 pa=p-a, ba=b-a;
  float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.0,1.0);
  return length(pa-ba*h)-r;
}
float s2Disc(vec2 p,float r){ return length(p)-r; }
float s2Box(vec2 p,vec2 b,float r){ vec2 d=abs(p)-b+r; return min(max(d.x,d.y),0.0)+length(max(d,0.0))-r; }
float s2Ring(vec2 p,float R,float w){ return abs(length(p)-R)-w; }
float sMin2(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }
float sMax2(float a,float b,float k){ float h=clamp(0.5-0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)+k*h*(1.0-h); }
mat2 rr2(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }

/* Flat faces + straight walls + rounded bevel. Inflate the profile and the slab by the bevel,
   take the rounded intersection, deflate — the standard rounded extrusion, and the same one
   mSVG uses so an uploaded shape and a built-in one are the same kind of object. */
const float EXR = 1.15;                    // the radius every profile is normalised to
/* THE SURFACE LANGUAGE, not just the silhouette. Every form used one constant depth and one
   constant bevel, so although the six profiles differ in outline they were all the same object
   underneath: a flat slab of uniform thickness with the same rounded edge everywhere. That is
   why they read as cut rather than sculpted — nothing tapers, no edge changes character, and the
   form looks identical in section from any angle.

   Three modulations, all driven by r, how far out in the profile plane the point lies:

   THICKNESS  barrelled through the middle and drawn in toward the rim, so the form has a section
              instead of a constant slab, and the silhouette turns as it rotates.
   BEVEL      broad where the profile is broad, tightening as it runs out to the extremities.
              This is the one that reads as "designed": a constant fillet is the default any CAD
              package gives you, and a fillet that responds to the form is what a modeller does
              by hand.
   CHAMFER    a narrow flat cut across the face/wall corner. A pure fillet rolls light smoothly
              and reads soft; a flat holds a straight highlight along the edge, which is what
              makes a machined object look machined. u_chamf 0 is exactly a no-op.

   The field pays for this. Making the depth and bevel functions of p.xy means the distance is no
   longer exact — the gradient picks up roughly 0.19 from the thickness term at the rim — so the
   result is scaled by 0.88 to keep it a conservative underestimate. That is the same discipline
   the morph guard follows, and it matters for exactly the same reason: a field that overestimates
   its own distance gets marched straight through. */
/* The form's global scale, used by map() and by the ray/bound test in main(). Factored out so
   there is exactly one definition: a bound computed from a stale copy of this expression would
   clip the silhouette the moment a bass hit pushed the form past it. */
float formScale(){
  return max(u_reform,0.2)*(1.0+u_energy*0.10+u_pulse*0.10+u_hLow*0.13+u_hSub*0.09)*0.95;
}
float extr(float d2,vec3 p,float halfD,float bev){
  float r = clamp(length(p.xy)/EXR, 0.0, 1.0);
  float hd = halfD*(1.0 + (0.075*(1.0-r*r) - 0.150*r*r*r)*u_thickVar);
  // TIGHT ON THE BROAD FACES, SOFTER AT THE TIPS. A designed object crisps up where there is
  // face to hold an edge and eases off where the form runs out to a termination; the first
  // version had it the other way round, broadening the fillet through the middle, which rounds
  // away the one region that wants to read as a flat face.
  //
  // NOT VISUALLY VERIFIED. The direction above is design reasoning, not a measurement — the
  // browser pane available while this was written had a stopped render loop, so no A/B of these
  // parameters was actually observed. The magnitudes are in the right range to be visible at the
  // default framing (bevel ~27px on screen, the edge term moving ~8px and the thickness term
  // ~22px at the rim), which is the argument for the numbers, not evidence about the result.
  float bv = bev*mix(1.0, 0.70+0.62*r*r, u_edgeVar);
  d2 += bv;
  float dz = abs(p.z) - hd + bv;
  vec2 w = vec2(d2,dz);
  float d = min(max(d2,dz),0.0) + length(max(w,0.0)) - bv;
  // 45 degree cut across the corner. At u_chamf 0 the plane sits exactly on the rounded corner
  // and changes nothing; above that it bites, leaving a flat band between face and fillet.
  d = max(d, (d2+dz)*0.70710678 - bv*(1.41421356-0.45*u_chamf));
  return d*0.88;
}
// depth and bevel ride the track: the slab thickens on low end, the bevel sharpens on air
// The user parameters multiply the audio-driven value rather than replacing it, so the Director
// keeps animating the form and the slider decides how much form there is to animate.
float exDepth(){ return (0.30 + u_gThick*0.05)*u_pDepth; }
float exBevel(){ return (0.055 + u_gCut*0.012)*u_pEdge*u_bevK; }

// ---- profiles ----
// TRISKELION — three arms, each running out from the centre then hooking a quarter turn. The
// reference's own shape; the hook is what makes the silhouette read differently from every angle.
float p2Tris(vec2 p){
  float d=1e9, w=0.19+u_gDense*0.03;
  // Segment count is a uniform, so the step is 2pi/N rather than a baked 2pi/3. GLSL ES 3.00
  // allows a non-constant loop bound, which is what makes this a parameter and not a rebuild.
  int N=int(clamp(u_segN,2.0,8.0));
  for(int i=0;i<N;i++){
    vec2 q=rr2(float(i)*6.2831853/float(N)+u_gTwist*0.25)*p;
    float a=s2Seg(q,vec2(0.02,0.0),vec2(0.66,0.0),w);
    float b=s2Seg(q,vec2(0.66,0.0),vec2(0.66,0.70),w);
    d=min(d, sMin2(a,b,0.16));
  }
  return d;
}
// CLOVER — three fat lobes on a hub, the simplest bold poster form
float p2Clover(vec2 p){
  float d=s2Disc(p,0.30+u_gDense*0.04);
  int N=int(clamp(u_segN,2.0,8.0));
  for(int i=0;i<N;i++){
    vec2 q=rr2(float(i)*6.2831853/float(N)+1.5707963)*p;
    d=sMin2(d, s2Disc(q-vec2(0.0,0.62),0.40+u_gDense*0.04), 0.22);
  }
  return d;
}
// ARC — a broken ring, the counter-shape. Reads as a single confident stroke.
// Analytic, not chained. Two earlier versions failed differently and both are worth remembering:
// cutting a gap out of a full ring needed its end caps placed by hand at the cut angles and one
// landed inside the removed wedge, rendering as a disc floating free of the body; chaining nine
// capsules along the arc fixed that but left the outer silhouette visibly FACETED, because the
// boundary sits a fixed width from each straight chord and a 30-degree chord has a 2.6% sagitta.
// Raising the count would fix the facets and multiply the per-sample cost, in a function the
// raymarch evaluates millions of times a frame.
// The closed form has neither problem: exact curvature everywhere, round ends for free, one
// branch, constant cost. Outside the aperture the nearest point is the end cap, inside it the
// nearest point is the ring — which is exactly the two cases below.
float p2Arc(vec2 p){
  float w=0.21+u_gDense*0.03, R=0.72;
  p=rr2(-0.70)*p;                       // orient the opening
  const float HA=2.356;                 // half-aperture 135 deg -> a 270 deg arc
  vec2 sc=vec2(sin(HA),cos(HA));
  p.x=abs(p.x);
  return ((sc.y*p.x>sc.x*p.y) ? length(p-sc*R) : abs(length(p)-R)) - w;
}
// CHEVRON — nested Vs, the most graphic of the set
float p2Chev(vec2 p){
  float d=1e9, w=0.115+u_gDense*0.02;
  for(int i=0;i<2;i++){
    float o=0.30+float(i)*0.46;
    vec2 q=p+vec2(0.0,0.30);
    float a=s2Seg(q,vec2(-0.74,o-0.34),vec2(0.0,o+0.18),w);
    float b=s2Seg(q,vec2( 0.74,o-0.34),vec2(0.0,o+0.18),w);
    d=min(d, sMin2(a,b,0.09));
  }
  return d;
}
// WAVE — an S laid on its side, so the extrusion wall turns through the whole silhouette
float p2Wave(vec2 p){
  float w=0.20+u_gDense*0.03, d=1e9;
  d=min(d, s2Seg(p,vec2(-0.80, 0.34),vec2(-0.26, 0.34),w));
  d=sMin2(d, s2Seg(p,vec2(-0.26, 0.34),vec2( 0.26,-0.34),w), 0.26);
  d=sMin2(d, s2Seg(p,vec2( 0.26,-0.34),vec2( 0.80,-0.34),w), 0.26);
  return d;
}
// PLATE — a rounded slab with three bores. Closest to the old set, kept so the family has a
// solid, quiet member between the busier ones.
float p2Plate(vec2 p){
  float d=s2Box(p,vec2(0.86,0.86),0.34);
  for(int i=0;i<3;i++){
    vec2 q=rr2(float(i)*2.0943951+0.5)*p;
    d=sMax2(d, -s2Disc(q-vec2(0.0,0.42),0.26+u_gCut*0.04), 0.06);
  }
  return d;
}

/* Each profile is drawn at whatever size its construction happens to give, then normalised to a
   common radius here — d(p/S)*S is the exact SDF scale, so the field stays valid. Without this
   the framing constants below would have to encode six different natural extents, and every one
   of them would silently drift the moment a profile constant was touched. One target radius, six
   scales derived from the geometry, and the camera can frame them all identically. */
float mArray(vec3 p){    float S=EXR/1.152; return extr(p2Tris (p.xy/S)*S, p, exDepth(), exBevel()); }
float mStack(vec3 p){    float S=EXR/1.020; return extr(p2Clover(p.xy/S)*S, p, exDepth(), exBevel()); }
float mRings(vec3 p){    float S=EXR/0.930; return extr(p2Arc  (p.xy/S)*S, p, exDepth(), exBevel()); }
float mTruss(vec3 p){    float S=EXR/0.870; return extr(p2Chev (p.xy/S)*S, p, exDepth()*0.92, exBevel()); }
float mPods(vec3 p){     float S=EXR/1.070; return extr(p2Wave (p.xy/S)*S, p, exDepth(), exBevel()); }
float mAperture(vec3 p){ float S=EXR/1.075; return extr(p2Plate(p.xy/S)*S, p, exDepth()*1.05, exBevel()); }

/* ---- CUSTOM SVG ----
   The uploaded artwork arrives as a 2D signed distance field baked into a texture, so the
   raymarcher can treat it like any other primitive: sample the plane distance, then extrude.
   A texture rather than analytic paths because an SDF march evaluates the field millions of
   times per frame — walking a path list per sample would be thousands of times slower, and the
   field only has to be built once per upload.
   Outside the texture the sample is meaningless (clamped edge), so the distance there is
   reconstructed from the border padding plus how far the point lies beyond the edge. Without
   that the field flattens off past the border and the march walks straight through it. */
float mSVG(vec3 p){
  vec2 q=p.xy;
  vec2 uv=q*0.5+0.5;
  vec2 cl=clamp(uv,0.0,1.0);
  float d2=texture(u_svg,cl).r;
  // add the planar distance from the clamped point back to the real one
  d2+=length((uv-cl)*2.0);
  float dz=abs(p.z)-u_svgDepth;
  float b=u_svgBevel;
  d2+=b; dz+=b;                       // inflate, then deflate by b -> a rounded edge
  vec2 w=vec2(d2,dz);
  return min(max(d2,dz),0.0)+length(max(w,0.0))-b;
}
/* ---- IMPORTED MESH ----
   A triangle mesh baked to a 3D signed distance field offline and sampled here, which is the
   only way a raymarcher can render an arbitrary model: the march needs a distance at any point
   in space, and a triangle soup does not provide one without an acceleration structure the
   shader has no way to carry.
   Stored as uint16 over a clamped near-surface range, decoded here. 16 bits puts one level at
   1e-5 against a 0.0138 texel — three orders below the grid, so quantisation contributes
   nothing to the reconstruction, unlike the 8-bit case that terraced the SVG field.
   Outside the grid the sample is meaningless (clamped edge), so distance there is the box
   distance to the grid plus whatever the edge reported — without that the field flattens off
   and the march walks straight through the volume. */
float mVol(vec3 p){
  vec3 uv=p/u_volPad*0.5+0.5;
  vec3 cl=clamp(uv,0.0,1.0);
  float d=texture(u_vol,cl).r;      // already decoded to object units on upload
  vec3 q=abs(p)-u_volPad;
  // NOT named 'out' — that is a reserved storage qualifier in GLSL, and using it as a variable
  // is a syntax error that fails the ENTIRE scene shader, not just this function.
  // (And the quotes here are apostrophes on purpose: a backtick inside this comment would end
  //  the JS template literal holding the shader, which breaks the whole script, not just GLSL.)
  float outside=length(max(q,0.0));
  return outside>1e-6 ? outside+max(d,0.0) : d;
}
float evalMode(vec3 p,float m){
  if(u_volOn>0.5) return mVol(p);   // an imported mesh replaces the generated set entirely
  if(u_svgOn>0.5) return mSVG(p);   // an uploaded shape replaces the generated set entirely
  if(m<0.5)       return mArray(p);
  else if(m<1.5)  return mStack(p);
  else if(m<2.5)  return mRings(p);
  else if(m<3.5)  return mTruss(p);
  else if(m<4.5)  return mPods(p);
  else            return mAperture(p);
}
vec2 map(vec3 wp){
  vec3 p=wp;
  // CLEAN AXIS SPIN. u_spin used to drive TWO planes at once — xz plus xy at 0.22 — which is a
  // tumble, not a spin: the axis itself precesses, so the form never repeats a pose and the eye
  // cannot lock onto the rotation. One plane only. u_tilt stays as a fixed lean on the axis, so
  // the form is seen at a three-quarter angle rather than dead side-on, but the lean is static
  // and the spin is a clean turn about it.
  p.yz*=rot(u_tilt); p.xz*=rot(u_spin);
  // 0.95 = global framing scale: keeps the whole silhouette inside frame at the closest camera
  // bass hits punch the whole form; sub adds the deep swell
  float s=formScale();
  p/=s;
  // bounding sphere: every form lives inside r=1.3, so empty space is skipped without
  // ever touching a fractal estimator. This is what keeps the heavy modes affordable.
  //
  // The threshold used to be 0.10, and that was the source of the floor's contour rings. This
  // branch returns the distance to a sphere of radius 1.45 while the branch below returns the
  // distance to the actual form, and at the switch those disagree by the gap between the two —
  // roughly 0.45. A raymarch tolerates it because the value is still a conservative lower bound,
  // so it only costs a few extra steps. But anything that reads the field's VALUE rather than
  // marching on it sees a cliff, and the soft shadow's min(k*h/t) reads the value: samples
  // crossing this shell took a sudden dip, and since the crossing radius sweeps smoothly with the
  // shaded point, the dip swept with it. Concentric rings, printed on the floor, exactly tracking
  // the bounding sphere. Proven by forcing the true field everywhere, which removed every ring.
  //
  // The gap does not shrink with distance, but its VISIBILITY does: the spurious darkening is
  // 7*br*s/t, so pushing the switch out to 0.85 means no shaded point within ~6 units of the shell
  // can be darkened by it at all. Everything past radius 2.3 still skips the estimator, which is
  // where nearly all of the empty space the early-out exists to skip actually lives.
  //
  // Gated on the scene, because widening the shell is not free — it makes the camera march
  // evaluate the real estimator across a thicker band, measured at roughly a fifth of the render
  // scale. Only the studio floor can display the rings (it is the only surface that reads the
  // field's value at a distance); the colour field has no floor, so it keeps the tight shell and
  // spends that budget on resolution instead.
  float br=length(p)-1.45;
  float dObj;
  if(br>mix(0.10,0.85,u_scene)) dObj=br*s*0.5;
  else{
  float d=evalMode(p,u_mode);
  // SMOOTHERSTEP (6t^5-15t^4+10t^3) rather than smoothstep. smoothstep has zero first derivative
  // at the ends but a discontinuous SECOND derivative, so the melt visibly jerks into and out of
  // motion — on a shape change, that snap at each end is most of what reads as abrupt.
  // Smootherstep is C2, so the morph eases in and out with no kick.
  if(u_mix>0.001){ float m=clamp(u_mix,0.,1.); m=m*m*m*(m*(m*6.0-15.0)+10.0);
    d=mix(d, evalMode(p,u_mode2), m); }
  // living surface — the HIGH bands drive its frequency + speed, so hats/stabs read as
  // surface chatter. Amplitude is divided back down by the frequency: displacement gradient
  // (freq * amp) must stay bounded or the field stops being a valid SDF and the march creases.
  // lighter than before: these forms carry their own detail, so the noise only breathes
  float nf=2.0+u_bHigh*1.6+u_hHigh*1.2;                       // 2.0 .. 4.8
  float na=u_energy*0.030+u_pulse*0.030+u_flux*0.014+u_wob*0.010+u_hHigh*0.012+u_hAir*0.009;
  // The time term CRAWLS the noise through the form. At 0.15 (and 0.5 on air hits) the surface
  // was boiling — detail sliding across geometry that is itself turning, which is most of what
  // read as jiggle even after the rotation was cleaned up. Slowed hard so the detail rides WITH
  // the form and the eye tracks the spin instead of the churn.
  d+=(fbm(p*nf+u_time*(0.030+u_hAir*0.09))-0.5)*na*(2.0/nf)*u_dxs.z;
  dObj=d*s*0.5;
  }
  return vec2(dObj,1.0);
}
/* ---- MATERIAL TEXTURE ----
   Surface detail in OBJECT space (same transform map() applies) so it sticks to the form
   as it turns instead of sliding through it. Two channels do most of the work: a micro
   normal that breaks up the specular, and a roughness field that stops every highlight
   reading as one flat plastic sheen. u_txAniso stretches the noise for brushed metal. */
vec3 objP(vec3 p){
  // CLEAN AXIS SPIN. u_spin used to drive TWO planes at once — xz plus xy at 0.22 — which is a
  // tumble, not a spin: the axis itself precesses, so the form never repeats a pose and the eye
  // cannot lock onto the rotation. One plane only. u_tilt stays as a fixed lean on the axis, so
  // the form is seen at a three-quarter angle rather than dead side-on, but the lean is static
  // and the spin is a clean turn about it.
  p.yz*=rot(u_tilt); p.xz*=rot(u_spin);
  return p;
}
/* ---- SURFACE DETAIL ----
   An IMAGE, triplanar-projected, rather than procedural fbm.

   fbm can only make cloudy blobs. Real surfaces have STRUCTURE — brushing runs one way,
   scratches are discrete lines, tooth is even and fine — and none of that is expressible as a
   sum of octaves of value noise. That is why the old surface read as a stain on plaster rather
   than as a material, and no amount of amplitude tuning was going to change it.

   It is also better behaved. fbm was evaluated five octaves deep and then differenced three
   times to get a normal, which both costs and aliases: the difference amplifies exactly the
   highest frequencies that are already undersampled. A texture is mip-mapped by the hardware,
   so it filters correctly at every distance and every scale for three fetches.

   Triplanar because these forms have no UVs — there is nothing to unwrap an implicit surface
   or a bored shell onto. Blend weights are the normal raised to a power, which keeps the
   seams between the three projections tight. */
// ONE fetch set, not two. texNormal() and detailRough() were sampling the SAME three texels at
// the SAME coordinates and each discarding the other's channels -- six fetches and two
// pow(abs(n),6) triplanar blends where three and one do. The roughness rides in alpha and
// arrives with the RGB for free. Returns the shading normal; writes the roughness modulation.
vec3 DIAGW=vec3(0.0); float DIAGD=0.0, DIAGF=1.0, DIAGL=0.0;   // diagnostic taps, written by texDetail
/* ANALYTIC RAY DIFFERENTIALS, not the hardware's derivatives. The mip level texture() picks comes
   from dFdx/dFdy of the coordinate across the pixel quad, and in a raymarcher that derivative is
   not trustworthy: the quad straddling a silhouette has one lane on the near face and its
   neighbour on a side band a long way off, and lanes that missed the surface entirely still
   contribute their garbage op to the difference. So exactly at the silhouette -- where the
   footprint is largest and the right mip matters most -- the selected level is noise. That is the

   which is the real elliptical footprint, not a scalar. Passing both axes to textureGrad keeps
   anisotropic filtering doing its job -- a scalar textureLod would throw the anisotropy away and
   measurably softened the INTERIOR by 37% as well, which is detail loss, not de-aliasing.

  vec2 ax=vec2(s*u_txAniso,s);

  // coherent across the draw and costs nothing; keeping both paths in ONE shader is the only way
  // to compare them on the same frame. Comparing across page loads does not work in this viewer:
  // the variant re-rolls, and the morph and the framing both depend on wall-clock time since
  // load, so two loads are two different scenes even with POSE and VARPIN pinned.
  vec4 sx,sy,sz;

  // unit vectors that point different ways gives a vector SHORTER than one. That shortening is
  // the whole signal: it is how much of the map's tilt has been averaged out at this footprint,
  // and the correct limit for a surface whose detail no longer resolves is the flat geometric
  // normal. Every normalize() on the path above throws that signal away and re-inflates the
  // averaged normal back to full tilt -- so the map stayed at full strength no matter how far
  // the mip chain had already flattened it.
  //

  // by 1/NoV, the fetch lands several mips up, and the hardware duly returns a nearly-flat normal
  // -- which this function then renormalised back to a full-tilt one and smeared along the axis
  // the projection had compressed. Filtering was working; the shader was undoing it.
  //
  // Recovering it costs three lengths. The bake writes unit normals, so length is 1 at level 0
  // and falls from there; using it as the blend weight is Toksvig's argument applied to the
  // amplitude instead of to roughness, and it composes with the Toksvig term already in the
  // caller rather than replacing it.
  float mipFlat=mix(1.0, length(tx)*w.x + length(ty)*w.y + length(tz)*w.z, u_mipflat);
  DIAGF=length(tx)*w.x + length(ty)*w.y + length(tz)*w.z;
  DIAGL=0.5*log2(max(dot(dox.xy*s,dox.xy*s), dot(doy.xy*s,doy.xy*s))*float(textureSize(u_detail,0).x)*float(textureSize(u_detail,0).x));
  // u_txAmp stays the material's tilt in radians, so every preset keeps its relative weighting.
  // VARIANCE OF THE TRIPLANAR BLEND. The three projections read DECORRELATED parts of the map, so
  // combining them with weights w gives a perturbation whose standard deviation is sqrt(dot(w,w))
  // -- 1.0 where one projection owns the pixel, 0.577 where all three share it. The detail
  // therefore fades in and out purely as a function of the NORMAL, and on an extruded form the
  // normal is constant along the extrusion: the fade runs as a stripe down the whole side wall.
  // That is the streaking, and it is why it survived the map being isotropic (verified at one
  // texel per pixel), the mip chain being irrelevant here (mipFlat is a flat 0.87 across the
  // form) and every lighting term being ablated one at a time.
  // Dividing by sqrt(dot(w,w)) restores constant amplitude across the blend.
  float vnorm=mix(1.0, inversesqrt(max(dot(w,w),1e-4)), u_trivar);
  vec3 outN=normalize(mix(n, pn, clamp(u_txAmp*26.0*vnorm,0.0,1.0)*clamp(mipFlat,0.0,1.0)));
  DIAGD=length(outN-n);

}
float texRough(float v,float base){

// the gradient comes back constant across each cell and the surface lights as flat facets. For
// the analytic forms 0.0018 is right. The baked mesh is a grid whose cells are 0.0138 across —
// nearly 8x wider — so sampling it at 0.0018 reads entirely inside one cell. That is the
// faceting on the imported mesh, and it is the same fault the SVG field had.
/* ---- EXACT MESH ----
   A baked distance grid has a fixed resolution, so its surface can only ever be as smooth as
   its cells — 160^3 here, which is what left the import looking faceted. Intersecting the real
   triangles has no such ceiling: the silhouette is exact at any zoom, and interpolating the
   VERTEX normals gives smooth shading a grid cannot reconstruct at all.
   It is also far smaller. The grid was 8.2MB; the BVH plus triangles is 0.51MB, 16x less.

float traceMesh(vec3 ro,vec3 rd,out vec3 nrm){

  vec3 rs=mix(rd, vec3(1e-12), lessThan(abs(rd), vec3(1e-12)));

// varied with the field, and whatever partial r they had accumulated became the shadow. Since
// the stopping point swept smoothly with radius, the error did too: concentric rings around the
// camera's nadir, which is exactly what the floor was showing.
// Fixed by terminating for a GEOMETRIC reason instead of an iteration count — every form lives
// inside the bounding sphere, so once the ray is outside it and travelling outward nothing can
// ever occlude it and the point is fully lit. Steps can also be much longer now that escaping
// is cheap.
// SOFT SHADOW — rewritten around the actual cause of the floor's terraced contour rings.

// a unit or more, so which sample lands nearest the form jumps as the floor point slides, and the
// running minimum jumps with it. Measured by disabling that one line: every contour vanished and a
// clean hard silhouette remained, so the march and the field were never at fault. Two earlier
// attempts to keep sphere tracing and repair the estimate analytically (closest approach between
// samples, from the previous distance and then from the step taken) both failed — they make the
// sampled value smoother but do nothing about the sample POSITIONS, which is where the jump is.
//

//      occlude and the point is lit — the whole open floor now returns without a single field
//      evaluation, where before it paid for a full march to discover the same thing.
//   2. inside the sphere only, step a FIXED 0.09. Sample positions then move continuously with
//      the shaded point, so the running minimum does too, and the chord is short enough to bound
//      the cost. Fixed steps cannot skip the surface here because the step is far below the
//      penumbra scale this is trying to resolve.

// samples exist for the FORM, where the min-over-samples error printed contour bands across the
// flat faces; the floor was already clean at 40. Gating this on distance from the origin was
// tried first and bought nothing measurable -- at this framing most of the VISIBLE floor sits
// inside the 2.6 bounding sphere, so the test excluded almost nothing. Which surface was hit is
// the thing that actually distinguishes the two cases, and the caller already knows it.

  // by one as the chord grows, and the sample that pops in or out at the far end takes the running
  // minimum with it — the faint rings that survived every fix above. Distributing a constant number
  // of samples over [t0,t1] makes every sample position a continuous function of the shaded point
  // and never adds or removes one, so nothing can pop. It also spends the samples where they are
  // needed: a grazing ray gets a fine step, a chord straight through the form gets a coarse one.
  // The even spread is right, but N=40 of them was not: on the FORM (the floor was already
  // clean) it left nested contours running parallel to the silhouette across every flat face.
  // Measured against a converged N=800 reference over the whole object, N=40 is off by 4.31
  // levels RMS, and the error falls as a clean 1/N — pure undersampling of a min over point
  // samples, which converges that slowly because 7h/t is V-shaped near a grazing occluder.
  //
  // THREE reformulations were measured and all three were worse. Do not try them again:
  //   * 60% of the budget front-loaded into the first 0.7 units -> 5.11. The minimum is not
  //     decided near the surface at all: on a form 2.3 across, the ray from one face passes
  //     closest to ANOTHER LOBE at t = 1..3, so this thins the only region that matters.
  //   * constant 2R step instead of chord-relative -> 6.74. It does make every sample position
  //     identical for every point on the form (inside the sphere t0 is always the 0.05 floor, so
  //     nothing can slide), but it spends most of the budget past t1 where nothing can occlude.
  //   * closest-approach correction between consecutive samples -> 4.35, no better, and its
  //     converged answer differs from the plain one by 2.42 RMS. It moves the penumbra; it does

  float ds=(t1-t0)/float(N);

  float w=smoothstep(0.0,0.8,t1-t0);
