let shotPending=false, recorder=null, recChunks=[], recStream=null;
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); }
function saveBlob(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function grabFrame(){
  glc.toBlob(b=>{ if(!b){ showStat('Frame grab failed',true); hideStat(2200); return; }
    saveBlob(b,'atonal-'+stamp()+'.png');
    showStat('Saved '+glc.width+'x'+glc.height+' PNG'); hideStat(1600);
  },'image/png');
}
$('shot').addEventListener('click',()=>{ shotPending=true; });
function pickMime(){
  // Safari only recently gained WebM in MediaRecorder; fall back to whatever it will accept
  // rather than throwing. mp4 is the usual Safari answer.
  const want=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  for(const m of want) if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
$('rec').addEventListener('click',()=>{
  if(recorder && recorder.state==='recording'){ recorder.stop(); return; }
  if(!window.MediaRecorder || !glc.captureStream){ showStat('Recording unsupported in this browser',true); hideStat(2600); return; }
  const mime=pickMime();
  if(!mime){ showStat('No supported video codec',true); hideStat(2600); return; }
  try{
    recStream=glc.captureStream(60);
    recorder=new MediaRecorder(recStream,{mimeType:mime,videoBitsPerSecond:16000000});
  }catch(err){ showStat('Recorder failed: '+err.message,true); hideStat(3000); return; }
  recChunks=[];
  recorder.ondataavailable=e=>{ if(e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop=()=>{
    const ext=mime.indexOf('mp4')>=0?'mp4':'webm';
    saveBlob(new Blob(recChunks,{type:mime}),'atonal-'+stamp()+'.'+ext);
    recChunks=[];
    if(recStream){ recStream.getTracks().forEach(t=>t.stop()); recStream=null; }
    $('rec').textContent='Record'; $('rec').style.color='';
    showStat('Saved '+ext.toUpperCase()); hideStat(1600);
  };
  recorder.start(1000);                 // 1s timeslices: a crash still leaves usable footage
  $('rec').textContent='Stop'; $('rec').style.color='#ff4d6a';
  showStat('Recording — press Stop to save'); hideStat(1800);
});


/* ======================= CUSTOM SVG -> 2D SDF ======================= */
/* The browser already has a complete SVG renderer, so the artwork is drawn through it rather
   than parsed by hand: <img src=svg> into a canvas gives correct fill rules, holes, transforms,
   clip paths and nested groups for free. Only the resulting coverage mask matters.
   That mask is then turned into a true Euclidean signed distance field with Felzenszwalb's
   exact O(n) transform (1D parabola lower-envelope along rows, then columns). A cheap
   approximation such as a chamfer pass leaves directional bias that shows up as faceting on
   the extruded sides once the surface is lit. */
const SVG_RES = 1024;                      // field resolution: one texel = 0.00195 object units,
                                           // about one calcN epsilon (0.0018), so the normal is
                                           // read across roughly a texel rather than inside one.
                                           // Resolution alone was never the fix though — see the
                                           // sub-texel edge below for what actually caused the
                                           // terracing on the extruded walls.
const SVG_PAD = 0.18;                      // fraction of the frame left as margin, so the
                                           // distance field has somewhere to grow outside the art

function edt1d(f, n) {                     // squared distance transform of one row
  const d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  let k = 0; v[0] = 0; z[0] = -Infinity; z[1] = Infinity;
  for (let q = 1; q < n; q++) {
    let s;
    while (true) {
      s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      if (s <= z[k]) k--; else break;
    }
    k++; v[k] = q; z[k] = s; z[k + 1] = Infinity;
  }
  k = 0;
  for (let q = 0; q < n; q++) {
    while (z[k + 1] < q) k++;
    d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
  }
  return d;
}

function edt2d(mask, w, h, inside) {
  // squared distance to the nearest cell where mask != inside
  const INF = 1e20, f = new Float64Array(Math.max(w, h)), out = new Float64Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) f[x] = (mask[y * w + x] === inside) ? INF : 0;
    const d = edt1d(f, w);
    for (let x = 0; x < w; x++) out[y * w + x] = d[x];
  }
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) f[y] = out[y * w + x];
    const d = edt1d(f, h);
    for (let y = 0; y < h; y++) out[y * w + x] = d[y];
  }
  return out;
}

/** Rasterise an SVG string and return a Float32Array signed distance field in OBJECT units. */
async function svgToSDF(svgText, res = SVG_RES) {
  // Force a viewBox-independent render size. Without width/height an SVG with only a viewBox
  // has no intrinsic size and Chrome draws it at 0x0 or 300x150 depending on the markup.
  const blob = new Blob([svgText], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  try {
    await new Promise((ok, err) => { img.onload = ok; img.onerror = () => err(new Error('SVG failed to render')); img.src = url; });
    const cv = document.createElement('canvas');
    cv.width = cv.height = res;
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.clearRect(0, 0, res, res);
    // fit with margin, preserving aspect
    const iw = img.naturalWidth || img.width || res, ih = img.naturalHeight || img.height || res;
    const inner = res * (1 - SVG_PAD * 2);
    const sc = inner / Math.max(iw, ih);
    const dw = iw * sc, dh = ih * sc;
    g.drawImage(img, (res - dw) / 2, (res - dh) / 2, dw, dh);
    const px = g.getImageData(0, 0, res, res).data;

    const mask = new Uint8Array(res * res);
    const cov = new Float32Array(res * res);   // fractional coverage, kept for the sub-texel edge
    let covered = 0;
    for (let i = 0, j = 3; i < mask.length; i++, j += 4) {
      // alpha, not luminance: a black logo on transparent is the normal case and would read as
      // empty if measured by brightness
      cov[i] = px[j] / 255;
      mask[i] = px[j] > 127 ? 1 : 0;
      covered += mask[i];
    }
    if (covered === 0) throw new Error('SVG rendered empty — needs a filled shape');
    if (covered === mask.length) throw new Error('SVG covers the whole frame — no edge to extrude');

    const dOut = edt2d(mask, res, res, 1);   // distance from inside cells to the outside
    const dIn  = edt2d(mask, res, res, 0);   // distance from outside cells to the inside
    const sdf = new Float32Array(res * res);
    // object space spans [-1,1] across the texture, so one texel is 2/res units
    const k = 2 / res;
    for (let i = 0; i < sdf.length; i++) {
      sdf[i] = (mask[i] ? -Math.sqrt(dOut[i]) : Math.sqrt(dIn[i])) * k;
    }
    // Sub-texel edge, recovered from the rasteriser's own antialiasing.
    // The EDT is exact — but only about the BINARISED mask, so the boundary it measures from has
    // already been rounded to whole texels. That rounding is a sawtooth along any edge that is
    // not axis-aligned, and a sawtooth in the surface is a sawtooth in the normal: the ridges
    // running down the extruded walls. Canvas already computed the real answer while drawing —
    // a partially covered texel's alpha IS its area fraction — so for a straight edge crossing
    // the texel, the signed distance from its centre is (0.5 - coverage) texels.
    // Applied only within 1.5 texels of the boundary: further in, the EDT is the better estimate,
    // and gating on distance also means a uniformly semi-transparent fill (every texel at alpha
    // 0.5, no edge anywhere near) is left alone instead of being flattened to zero.
    const band = 1.5 * k;
    for (let i = 0; i < sdf.length; i++) {
      const a = cov[i];
      if (a > 0.004 && a < 0.996 && Math.abs(sdf[i]) < band) sdf[i] = (0.5 - a) * k;
    }
    // Then the separable 3-tap, AFTER the refinement so it smooths the corrected field.
    // Measured on a rasterised disc, angular error of the reconstructed normal along the edge
    // (rms / max), against the analytic truth:
    //     binary + bilinear                19.91 / 53.04 deg    (the original 512-era build)
    //     binary + blur                     7.32 / 23.60        (what shipped in 177f155)
    //     coverage + no blur                3.11 /  8.33
    //     coverage + blur                   2.21 /  7.15        <- here
    // Coverage is what does the work; the blur is worth a further 1.4x on top of it. A cubic
    // B-spline reconstruction in the shader was tried as well and reached 2.05 rms — 7% better
    // for four texture fetches per sample in the march's innermost loop, so it was dropped.
    const tmp = new Float32Array(sdf.length);
    for (let y = 0; y < res; y++) for (let x = 0; x < res; x++) {
      const i = y * res + x, a = x > 0 ? sdf[i - 1] : sdf[i], b = x < res - 1 ? sdf[i + 1] : sdf[i];
      tmp[i] = (a + 2 * sdf[i] + b) * 0.25;
    }
    for (let y = 0; y < res; y++) for (let x = 0; x < res; x++) {
      const i = y * res + x, a = y > 0 ? tmp[i - res] : tmp[i], b = y < res - 1 ? tmp[i + res] : tmp[i];
      sdf[i] = (a + 2 * tmp[i] + b) * 0.25;
    }
    // Silhouette extent, straight off the mask: the furthest covered texel from centre in each
    // axis. Used for framing, so an uploaded shape is fitted rather than guessed at.
    let rx = 0, ry = 0, rr = 0;
    for (let y = 0; y < res; y++) for (let x = 0; x < res; x++) {
      if (!mask[y * res + x]) continue;
      const ox = (x + 0.5) / res * 2 - 1, oy = (y + 0.5) / res * 2 - 1;
      rx = Math.max(rx, Math.abs(ox)); ry = Math.max(ry, Math.abs(oy));
      rr = Math.max(rr, Math.hypot(ox, oy));
    }
    return { sdf, res, covered: covered / mask.length, reach: rr, reachY: ry };
  } finally {
    URL.revokeObjectURL(url);
  }
}

/* ---- IMPORTED MESH: 3D distance field ----
   Baked offline (mesh -> signed distance on a grid) because doing it in the browser means an
   exact point-triangle distance for every voxel, which is minutes of work on the main thread.
   The bake is the slow, precise half; this is the fast half that just uploads the result. */
const VOL={res:160, pad:1.10, lo:-0.15, hi:0.50, url:'./assets/shape01.sdf'};
let volTex=null, volOn=false, volLoading=false;
/* Exact mesh: BVH + triangles as float textures. 0.51MB against the grid's 8.2MB, and with no
   resolution ceiling — the silhouette stays exact at any zoom and the vertex normals give
   smooth shading the grid cannot reconstruct. */
const BVH={w:256, nodes:'./assets/mesh_nodes.f32', tris:'./assets/mesh_tris.f32'};
/* ---- PREFILTERED HDRI ----
   assets/env_studio.bin is brown_photostudio_02 (CC0, Poly Haven) run through pmrem.py: eight
   equirect levels, each a GGX convolution of the room at that level's roughness, with the last
   one a cosine convolution for the diffuse term. Header is 'AENV', w, h, levels, channels; then
   the levels back to back as float16 RGB.
   texStorage2D with exactly LEVELS levels rather than texImage2D per level: it makes the texture
   COMPLETE at eight levels instead of demanding a full chain down to 1x1, which is what a
   half-built mip chain would otherwise be -- and an incomplete texture samples as black with no
   error anywhere to explain it. */
let envMapTex=null, envMapReady=false;
// SWITCHABLE. The reference offers four environments and they change the render completely --
// a dawn sky and a photo studio are different lights, not different tints -- so the name is a
// parameter. Each is its own prefiltered chain built by tools_pmrem.py.
const ENVS={studio:'Studio - daylight', studio_small:'Studio - small',
            dawn:'Dawn', city:'City'};
let envMapName='studio';
async function loadEnvMap(name){
  name = ENVS[name] ? name : 'studio';
  try{
    const r=await fetch('./assets/env_'+name+'.bin',{cache:'force-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const buf=await r.arrayBuffer();
    const dv=new DataView(buf);
    const magic=String.fromCharCode(dv.getUint8(0),dv.getUint8(1),dv.getUint8(2),dv.getUint8(3));
    if(magic!=='AENV') throw new Error('bad magic '+magic);
    const W=dv.getUint16(4,true), H=dv.getUint16(6,true),
          L=dv.getUint16(8,true), C=dv.getUint16(10,true);
    if(C!==3) throw new Error('expected RGB, got '+C+' channels');
    // texStorage2D is IMMUTABLE, so a texture cannot be re-specified -- switching environments
    // has to allocate a new one and drop the old, or the second selection silently keeps showing
    // the first.
    if(envMapTex) gl.deleteTexture(envMapTex);
    envMapTex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,envMapTex);
    gl.texStorage2D(gl.TEXTURE_2D,L,gl.RGB16F,W,H);
    let off=12;
    for(let i=0;i<L;i++){
      const w=Math.max(4,W>>i), h=Math.max(2,H>>i), n=w*h*3;
      gl.texSubImage2D(gl.TEXTURE_2D,i,0,0,w,h,gl.RGB,gl.HALF_FLOAT,
                       new Uint16Array(buf,off,n));
      off+=n*2;
    }
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    // REPEAT in azimuth so the +/-pi seam interpolates; CLAMP up the poles, where there is no
    // wrap to make and a repeat would fold the ceiling onto the floor.
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.bindTexture(gl.TEXTURE_2D,null);
    envMapReady=true; envMapName=name;
    return true;
  }catch(e){
    // Not fatal: envL() falls back to the analytic room, which is what shipped before this.
    console.warn('env map unavailable, using the analytic room:',e.message);
    envMapReady=false; return false;
  }
}
let bvhNodeTex=null, bvhTriTex=null, meshOn=false, bvhLoading=false;
async function loadBVH(){
  if((bvhNodeTex&&bvhTriTex)||bvhLoading) return bvhNodeTex;
  bvhLoading=true;
  try{
    const [a,b]=await Promise.all([fetch(BVH.nodes,{cache:'force-cache'}),
                                   fetch(BVH.tris ,{cache:'force-cache'})]);
    if(!a.ok||!b.ok) throw new Error('HTTP '+a.status+'/'+b.status);
    const mk=(buf)=>{
      const f=new Float32Array(buf);
      const rows=f.length/(BVH.w*4);
      if(!Number.isInteger(rows)) throw new Error('not a whole number of rows: '+f.length);
      const t=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,t);
      // NEAREST and no mips: these are DATA, not an image. Filtering them would blend a
      // bounding box into a triangle index and produce garbage geometry.
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,BVH.w,rows,0,gl.RGBA,gl.FLOAT,f);
      gl.bindTexture(gl.TEXTURE_2D,null);
      return t;
    };
    bvhNodeTex=mk(await a.arrayBuffer());
    bvhTriTex =mk(await b.arrayBuffer());
    return bvhNodeTex;
  } finally { bvhLoading=false; }
}
async function loadVolume(){
  if(volTex||volLoading) return volTex;
  volLoading=true;
  try{
    const r=await fetch(VOL.url,{cache:'force-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const buf=await r.arrayBuffer();
    const need=VOL.res*VOL.res*VOL.res*2;
    if(buf.byteLength!==need) throw new Error('expected '+need+' bytes, got '+buf.byteLength);
    const u16=new Uint16Array(buf);
    volTex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_3D,volTex);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_R,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    // Decode to R32F rather than uploading the uint16 directly. An integer texture (R16UI)
    // cannot be linearly filtered and does not sample as float — it would have to be fetched
    // per-texel and interpolated by hand, which is the one thing the hardware is for. R16
    // normalised is not in core WebGL2 (it needs EXT_texture_norm16), so R32F it is; the SVG
    // field already relies on the same format and filtering path.
    const f32=new Float32Array(u16.length);
    const k=(VOL.hi-VOL.lo)/65535;
    for(let i=0;i<u16.length;i++) f32[i]=u16[i]*k+VOL.lo;
    gl.texImage3D(gl.TEXTURE_3D,0,gl.R32F,VOL.res,VOL.res,VOL.res,0,gl.RED,gl.FLOAT,f32);
    gl.bindTexture(gl.TEXTURE_3D,null);

  } finally { volLoading=false; }
}
let svgTex = null, svgOn = false;
function uploadSDF(sdf, res) {

    gl.bindTexture(gl.TEXTURE_2D, svgTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  } else gl.bindTexture(gl.TEXTURE_2D, svgTex);
  // R32F: an 8-bit field quantises to ~1/256 of the range, and the march reads the value as a
  // step length — the stair-stepping shows directly as terracing on the extruded sides.
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, res, res, 0, gl.RED, gl.FLOAT, sdf);
  gl.bindTexture(gl.TEXTURE_2D, null);
}

/* Pointer Events rather than mouse+touch pairs: one code path covers mouse, trackpad and touch,
   and setPointerCapture keeps the drag alive when the pointer leaves the canvas — without it a
   fast flick that exits the window leaves the camera stuck mid-drag. */
(() => {
  const c = glc;
  let lastX = 0, lastY = 0, lastT = 0, id = null, moved = 0;
  c.style.cursor = 'grab';

  c.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    id = e.pointerId; dragging = true; moved = 0;
    lastX = e.clientX; lastY = e.clientY; lastT = e.timeStamp;
    userAzV = userElV = 0;                 // a new grab cancels the previous throw
    // Capture is an optimisation, not a requirement: it keeps a fast drag alive past the window
    // edge. It throws if the pointer is no longer active — which happens if the button is
    // released between the event firing and this handler running — and an exception here would
    // abandon the drag with `dragging` stuck true and the cursor wrong. The drag works without
    // it, so failure is not worth propagating.
    try { c.setPointerCapture(id); } catch { /* drag continues uncaptured */ }
    c.style.cursor = 'grabbing';
  });

  c.addEventListener('pointermove', (e) => {
    if (!dragging || e.pointerId !== id) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const dtms = e.timeStamp - lastT;
    lastX = e.clientX; lastY = e.clientY; lastT = e.timeStamp;
    moved += Math.abs(dx) + Math.abs(dy);
    // Scale by viewport height so the same physical drag turns the camera the same amount on
    // any window size.
    const k = 3.0 / Math.max(1, innerHeight);
    userAz -= dx * k;
    userEl = Math.max(-1.15, Math.min(1.15, userEl + dy * k));
    // Release velocity from the REAL time between events, not an assumed 60Hz frame. Dividing
    // by a hardcoded 1/60 makes the throw a function of the pointer's report rate rather than
    // the hand's actual speed: on a slow event stream it over-scales enormously (a two-event
    // synthetic drag threw the camera through several revolutions and pinned elevation at the
    // clamp), and on a 120Hz trackpad it under-scales. Clamped as well, so one anomalous
    // sub-millisecond gap cannot produce a spin nothing can damp in time.
    const inv = 1000 / Math.max(8, Math.min(100, dtms || 16));
    userAzV = Math.max(-3, Math.min(3, -dx * k * inv));
    userElV = Math.max(-3, Math.min(3,  dy * k * inv));
  });

  const end = (e) => {
    if (e.pointerId !== id) return;
    dragging = false; id = null;
    c.style.cursor = 'grab';
    // A click that never moved is a click, not a throw — kill the inertia so a stray tap does
    // not send the camera spinning.
    if (moved < 3) { userAzV = 0; userElV = 0; }
  };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);

  c.addEventListener('wheel', (e) => {
    e.preventDefault();
    // Exponential so each notch is the same proportional step whether you are close or far;
    // clamped so the camera can never end up inside the form or lost in space.
    userZoom = Math.max(0.45, Math.min(3.0, userZoom * Math.exp(e.deltaY * 0.0012)));
  }, { passive: false });

  // Double-click restores the Director's own framing.
  c.addEventListener('dblclick', () => {
    userAz = 0; userEl = 0; userZoom = 1; userAzV = 0; userElV = 0;
  });
})();

/* ======================= THE ROLL =======================
   A global randomiser, and the whole difficulty is that a uniform random over every control does
   NOT give interesting outcomes -- it gives mush, most of the time, because these controls are not
   independent. A halftone over a glass material is a screen of a refraction nobody can read. A
   dark look on a dark palette is a black rectangle. Six segments on the Arc is a shape that never
   closes. Roll each control on its own and most rolls are a waste of a click, which trains you to
   stop clicking.

   SO IT PICKS A RECIPE FIRST. Each recipe is a family that is known to hold together -- a print
   family, a sensor family, a product-shot family -- and the randomness lives INSIDE it, in the
   choices that family can absorb. That is the same shape as the Director's own decision-making a
   few hundred lines up: choose the intent, then fill in the detail consistently with it.

   AND EVERY ROLL PRINTS A SEED. A randomiser without one is a machine for losing things: the good
   roll is always two clicks behind you and cannot be got back. The seed is shown in the panel and
   in the toast, window.ROLL('a3f9') replays it exactly, and ?roll=a3f9 in the URL opens on it.

   It deliberately does NOT touch: the quality tier (a performance choice, not an aesthetic one),
   the camera, or the loaded track. */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;

    setCtl('selFinish',pick(r,['satin','gloss','matte']));

     profiles use it (p2Tris and p2Clover -- see foldOrder()); on the others the
     slider is inert, so rolling a high count there is a roll that did nothing. And the Arc is a
     broken ring: repeated eight times it stops reading as a single stroke. */

     ceiling is per shape so a roll never spends its randomness on a slider that is inert, and
     never asks the Arc (a broken ring) for eight of itself. */
  const segMax = (shape==='0'||shape==='1'||shape==='6') ? 6

     Director rewiring on the next track would silently throw the roll away -- which is the same
     honesty the Auto/Manual split exists for. */
  const tgts=['scale','bloom','sat','swirl','spin','cell','hue','grain','dolly','famt','kal','tumble','fov'];

    used[t]=1;

  }

  $('rollSeed').textContent=seed;
  showStat('Roll · '+rec.name+' · '+seed); hideStat(2200);
  return seed;
}

   `function hueRot` in the same scope does not sit alongside it -- it REPLACES it, silently,
   for every caller including moodK(). Which is the duplicated-and-overriding pattern this
   pass exists to find, so it would have been an odd thing to add while looking for it.
   The existing one takes radians; the route is in turns. */
function onColor(){ palAuto=false; $('selPal').value='custom';
  BGA=hex2rgb($('colA').value); BGB=hex2rgb($('colB').value); }
$('colA').addEventListener('input',onColor); $('colB').addEventListener('input',onColor);
$('file').addEventListener('change',e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); });
$('play').addEventListener('click',()=>{ if(!audioBuffer) return $('file').click(); isPlaying?pause():play(); });
$('tl').addEventListener('click',e=>{ if(!audioBuffer)return; const r=$('tl').getBoundingClientRect();
  seek((e.clientX-r.left)/r.width*audioBuffer.duration); });
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{ e.preventDefault(); const a=[...e.dataTransfer.files].find(f=>f.type.startsWith('audio')); if(a)loadFile(a); });
addEventListener('keydown',e=>{
  // Ignore keys aimed at a control. Without this, typing in the panel's own inputs toggles the
  // panel and starts the track.
  const tg=e.target, tag=tg&&tg.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||(tg&&tg.isContentEditable)) return;
  if(e.code==='Space'){e.preventDefault();$('play').click();}
  if(e.code==='KeyH'&&!e.metaKey&&!e.ctrlKey){ $('ctrl').classList.toggle('min'); panelSave(); }
  if(e.code==='KeyR'&&!e.metaKey&&!e.ctrlKey){ rollAll(); }
  if(e.code==='KeyP'&&!e.metaKey&&!e.ctrlKey){ PERF.on=!PERF.on; $('perf').style.display=PERF.on?'block':'none';
    showStat(PERF.on?'Perf readout on — press P to hide':'Perf readout off'); hideStat(1400); } });
/* The readout samples on a timer, not per frame: updating text every frame is itself a cost, and
   a number that changes 60 times a second cannot be read anyway. */
const PERF={on:false, n:0, t0:performance.now(), fps:0};
setInterval(()=>{
  if(!PERF.on) return;
  const el=(performance.now()-PERF.t0)/1000;
  PERF.fps=PERF.n/Math.max(el,1e-3); PERF.n=0; PERF.t0=performance.now();
  const mpxMarch=(RW*RH)/1e6, mpxCanvas=(glc.width*glc.height)/1e6;
  $('perf').innerHTML=
    '<b>'+PERF.fps.toFixed(1)+' fps</b>  ('+(1000/Math.max(PERF.fps,1e-3)).toFixed(1)+' ms)<br>'+
    'tier '+TIER+'   rscale '+rscale.toFixed(2)+'   dpr '+dpr.toFixed(2)+'<br>'+
    'march '+RW+'x'+RH+'  ('+mpxMarch.toFixed(1)+' Mpx)<br>'+
    'canvas '+glc.width+'x'+glc.height+'  ('+mpxCanvas.toFixed(1)+' Mpx)<br>'+
    'shadow N '+STEP.shaN+'<br>'+
    'look '+lookName+'   governor avg '+frameAvg.toFixed(1)+' ms';
},500);

loadEnvMap('studio');
frame();
</script>
