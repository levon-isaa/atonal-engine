<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATONAL — AI Director Viewer</title>
<style>
  :root{--mono:ui-monospace,"SF Mono",Menlo,monospace;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050506;overflow:hidden;font-family:var(--mono);color:#e6e6e4}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #hud{position:fixed;top:18px;left:20px;z-index:10;font-size:11px;letter-spacing:.04em;line-height:1.7;
    text-shadow:0 1px 3px #000;pointer-events:none}
  #hud b{color:#fff} #hud .k{color:#8a8b91;text-transform:uppercase;font-size:9px;letter-spacing:.16em}
  #next{color:#b9a7ff}
  #bar{position:fixed;left:20px;right:20px;bottom:18px;z-index:10;display:flex;align-items:center;gap:14px}
  button,label.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:3px;
    color:#e6e6e4;padding:8px 14px;font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  button:hover,label.btn:hover{background:rgba(255,255,255,.12)}
  #tl{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:3px;position:relative;cursor:pointer}
  #tlF{position:absolute;left:0;top:0;bottom:0;background:#c8b8ff;border-radius:3px;width:0}
  #tlS{position:absolute;inset:0}
  #tlS i{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.25)}
  #tc{font-size:10px;color:#8a8b91;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
  #file,#svgfile{display:none}
  #bar .grp{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#5a5a5d}
  #bar button.on{background:rgba(200,184,255,.20);border-color:rgba(200,184,255,.48);color:#e8e0ff}
  #drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:9;pointer-events:none}
  #drop h2{margin:0;font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:#8a8b91}
  #drop p{margin:0;font-size:10px;letter-spacing:.16em;color:#5a5a5d;text-transform:uppercase}
  #perf{position:fixed;left:14px;bottom:64px;z-index:40;display:none;padding:8px 10px;
  border-radius:8px;background:rgba(8,8,14,.72);color:#cfd2e6;font:11px/1.55 ui-monospace,Menlo,monospace;
  letter-spacing:.02em;pointer-events:none;white-space:pre}
#perf b{color:#fff;font-size:13px}
#stat{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:12;padding:8px 16px;
    background:rgba(14,14,17,.85);border:1px solid rgba(255,255,255,.12);border-radius:3px;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:#cfcfd4;display:none;backdrop-filter:blur(12px)}
  #statBar{display:none;width:190px;height:3px;background:rgba(255,255,255,.16);border-radius:2px;
    overflow:hidden;margin-left:4px}
  #statFill{display:block;height:100%;width:0%;background:currentColor;border-radius:2px;
    transition:width .18s linear}
  #statPct{display:none;min-width:34px;text-align:right;opacity:.65;font-variant-numeric:tabular-nums}
  #stat.busy #statBar,#stat.busy #statPct{display:block}
  .err{color:#ffb4b4!important}
  /* ---- CONTROL PANEL ----
     It used to be twenty-one rows floating directly on the canvas with no container: no
     background, so every label sat at whatever contrast the render happened to give it, and no way
     to put it away. A panel with its own ground fixes the legibility, and native <details> groups
     fix the length -- the whole thing collapses to a header, and each group remembers whether it
     was open. */
  #ctrl{position:fixed;top:14px;right:14px;z-index:11;width:266px;max-height:calc(100vh - 96px);
    display:flex;flex-direction:column;border-radius:10px;overflow:hidden;
    background:rgba(9,9,13,.76);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.10);box-shadow:0 14px 44px rgba(0,0,0,.5);
    transition:width .18s ease, max-height .18s ease}
  #ctrlHead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,.08);user-select:none}
  #ctrlHead span.t{flex:1;font-size:9px;letter-spacing:.20em;text-transform:uppercase;color:#9b9ca4}
  #ctrlHead span.c{font-size:9px;color:#6f7078;transition:transform .18s ease}
  #ctrlBody{overflow-y:auto;overscroll-behavior:contain;padding:0 11px 10px}
  #ctrlBody::-webkit-scrollbar{width:6px}
  #ctrlBody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
  /* Collapsed: the panel shrinks to its own header rather than vanishing, so there is always
     something to click and nothing to discover. */
  #ctrl.min{width:112px;max-height:36px}
  #ctrl.min #ctrlBody{display:none}
  #ctrl.min #ctrlHead span.c{transform:rotate(-90deg)}
  #ctrl details{border-bottom:1px solid rgba(255,255,255,.06)}
  #ctrl details:last-of-type{border-bottom:0}
  #ctrl summary{list-style:none;cursor:pointer;padding:9px 0 8px;display:flex;align-items:center;gap:7px;
    font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#7d7e86;user-select:none}
  #ctrl summary::-webkit-details-marker{display:none}
  #ctrl summary::before{content:'\25B8';font-size:8px;color:#5c5d65;transition:transform .15s ease}
  #ctrl details[open] summary::before{transform:rotate(90deg)}
  #ctrl details[open] summary{color:#c3c4cc}
  #ctrl .row{display:flex;align-items:center;gap:7px;padding:3px 0 4px}
  #ctrl .row>label{flex:0 0 56px;font-size:9px;letter-spacing:.10em;text-transform:uppercase;color:#8a8b91}
  #ctrl select{flex:1;min-width:0;background:rgba(255,255,255,.05);color:#e6e6e4;
    border:1px solid rgba(255,255,255,.14);border-radius:4px;
    padding:5px 6px;font:inherit;font-size:10px;letter-spacing:.04em}
  #ctrl select:hover{background:rgba(255,255,255,.10)}
  #ctrl input[type=color]{width:26px;height:22px;flex:0 0 auto;padding:0;
    border:1px solid rgba(255,255,255,.22);border-radius:3px;background:transparent;cursor:pointer}
  #ctrl input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  #ctrl input[type=color]::-webkit-color-swatch{border:0;border-radius:2px}
.row input[type=range]{flex:1;min-width:0;-webkit-appearance:none;height:3px;background:rgba(255,255,255,.16);
    border-radius:2px;outline:none;margin:0}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
    border-radius:50%;background:#c8b8ff;cursor:pointer;border:0}
  .row .val{font-size:9px;color:#cfcfd4;flex:0 0 30px;text-align:right;font-variant-numeric:tabular-nums}
  #ctrl button.mini{flex:0 0 auto;padding:5px 9px;font-size:9px;letter-spacing:.10em;
    background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14)}
  #ctrl button.mini:hover{background:rgba(255,255,255,.13)}
  #ctrl button.mini.on{background:rgba(200,184,255,.20);border-color:rgba(200,184,255,.48);color:#e8e0ff}
  /* ---- ROUTING MATRIX ---- one route per card: what it drives, what drives it, how hard. */
    background:rgba(255,255,255,.028)}
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:4px;
    color:#9a9aa2;cursor:pointer}
  /* A control that cannot do anything right now says so, rather than leaving you to drag it and
     wonder. Same idea as the dead-route marking in the matrix. */
  #ctrl .row.inert{opacity:.38}
  #ctrl .row.inert input,#ctrl .row.inert select{pointer-events:none}
    background:rgba(255,255,255,.08);overflow:hidden}
    border-radius:2px;transition:width .06s linear,left .06s linear}
</style>

<canvas id="gl"></canvas>

<div id="hud">
  <div><span class="k">Genre</span> <b id="hGenre">—</b></div>
  <div><span class="k">Tempo</span> <b id="hBpm">—</b></div>
  <div><span class="k">Section</span> <b id="hSec">—</b></div>
  <div><span class="k">Mood</span> <b id="hMood">—</b></div>
  <div id="hIntent" style="color:#9a9aa2;max-width:34ch"></div>
  <div><span class="k">Next</span> <b id="next">—</b></div>
</div>

<div id="ctrl">
  <div id="ctrlHead" title="Collapse the panel  (H)"><span class="t">Controls</span><span class="c">&#9662;</span></div>
  <div id="ctrlBody">

  <details id="gForm" open><summary>Form</summary>
    <div class="row"><label>Shape</label><select id="selShape">
      <option value="auto">Auto &middot; Director</option>
      <option value="0">Triskelion</option><option value="1">Clover</option>
      <option value="2">Arc</option><option value="3">Chevron</option>
      <option value="4">Wave</option><option value="5">Plate</option>
      <option value="6">Gear</option><option value="7">Knot</option>
      <option value="8">Lattice</option>
      <option value="mesh">Reference mesh</option>
      <option value="svg">Custom SVG&hellip;</option></select></div>
    <!-- SHAPE PARAMETERS. These apply to every form, because they act on the extrusion and the
         profile rather than on any one profile's construction: Segments is the radial repeat count,
         Edge scales the bevel, Mass the stroke weight of the profile, Depth the extrusion. The
         audio still drives all four underneath — these are offsets on top of the Director, not
         replacements for it, so a track still animates the form it is given. -->
    <div class="row"><label>Segments</label><input type="range" id="pSeg" min="2" max="8" step="1" value="3"><span class="val" id="pSegV">3</span></div>
    <div class="row"><label>Edge</label><input type="range" id="pEdge" min="30" max="220" step="1" value="100"><span class="val" id="pEdgeV">1.00</span></div>
    <div class="row"><label>Mass</label><input type="range" id="pMass" min="-60" max="120" step="1" value="0"><span class="val" id="pMassV">0.00</span></div>
    <div class="row"><label>Depth</label><input type="range" id="pDepth" min="30" max="260" step="1" value="100"><span class="val" id="pDepthV">1.00</span></div>
    <div class="row"><label>Kaleido</label><select id="selKal">
      <option value="auto" selected>Auto &middot; Director</option>
      <option value="on">Always on</option>
      <option value="off">Off</option></select></div>
  </details>

  <!-- MOTION. Multipliers on the tempo-derived rates, not absolute speeds -- see MOT in the
       script for why the tempo lock has to survive the dial. 0 holds a pose. -->
  <details id="gMotion"><summary>Motion</summary>
    <div class="row"><label title="The form turning about its own axis — one revolution every 16 beats at 1.0">Spin</label>
      <input type="range" id="mSpin" min="0" max="300" value="100"><span class="val" id="mSpinV">1.00</span></div>
    <div class="row"><label title="The second axis, about X — one revolution every 48 beats at 1.0">Tumble</label>
      <input type="range" id="mTumble" min="0" max="300" value="100"><span class="val" id="mTumbleV">1.00</span></div>
    <div class="row"><label title="The third axis, about Z — the profile's own plane">Swirl</label>
      <input type="range" id="mSwirl" min="0" max="300" value="100"><span class="val" id="mSwirlV">1.00</span></div>
    <div class="row"><label title="The camera's orbit around the form. Independent of the form's own rotation.">Orbit</label>
      <input type="range" id="mOrbit" min="0" max="300" value="100" title="Speed of the camera orbit. Has no effect while Camera·Orbit is off, because nothing is driving it then."><span class="val" id="mOrbitV">1.00</span></div>
    <div class="row"><label>&nbsp;</label>
      <button id="motStop" class="mini" title="Hold every axis still">Freeze</button>
      <button id="motReset" class="mini" title="Back to 1.00 on all four">Reset</button></div>
  </details>

  <details id="gMat"><summary>Material</summary>
    <div class="row"><label>Material</label><select id="selMat">
      <option value="chrome">Chrome</option><option value="gold">Gold</option>
      <option value="plastic">Plastic</option><option value="matte">Matte</option>
      <option value="pearl" selected>Pearl</option><option value="glass">Glass</option>
      <option value="clay">Clay</option>
      <option value="frosted">Frosted</option><option value="holo">Holographic</option></select></div>
    <div class="row"><label>Finish</label><select id="selFinish">
      <option value="satin" selected>Satin</option>
      <option value="matte">Matte</option>
      <option value="gloss">Gloss</option></select></div>
    <!-- WEAR is a property of the object's history, not of what it is made of, so it sits beside
         the material rather than inside it: chrome and plastic can both be worn. -->
    <div class="row"><label>Wear</label>
      <input type="range" id="matWear" min="0" max="100" value="0"><span class="val" id="matWearV">0</span></div>
    <div class="row"><label>Lighting</label><select id="selEnv">
      <option value="studio" selected>Studio &middot; daylight</option>
      <option value="studio_small">Studio &middot; small</option>
      <option value="dawn">Dawn</option>
      <option value="city">City</option>
      <option value="analytic">Analytic room</option></select></div>
    <!-- SURFACE MICROSTRUCTURE IS GONE, and with it the Detail selector that fed it. The two
         controls were one decision wearing two hats -- Surface off already made Detail inert,
         since it zeroed the very amplitude the map was multiplied by -- and the textured result
         was the wrong look for these forms: a triplanar tooth map over a large flat extruded
         face reads as orange peel, and it breaks the specular into mush exactly where the
         reference keeps one clean sweep. Smooth is now the only surface, so the map, its GPU
         bake and its PNG fallbacks are all gone rather than merely switched off. -->
  </details>

  <details id="gScene"><summary>Scene</summary>
    <div class="row"><label>Scene</label><select id="selScene">
      <option value="field" selected>Colour field</option><option value="studio">Studio</option></select></div>
    <div class="row"><label>Palette</label><select id="selPal">
      <option value="auto" selected>Auto &middot; Director</option>
      <option value="blood">Blood</option><option value="acid">Acid</option>
      <option value="ultra">Ultra</option><option value="cyber">Cyber</option>
      <option value="solar">Solar</option><option value="mono">Mono</option>
      <option value="studio">Studio (light)</option>
      <option value="custom">Custom</option></select></div>
    <div class="row"><label>Colors</label>
      <input type="color" id="colA" value="#2a0410" title="Background — deep tone">
      <input type="color" id="colB" value="#ff1f4b" title="Background — accent tone"></div>
  </details>

  <!-- FILTER: a look layer on the finished frame. See the FILTER shader for what each does and
       why it is a separate pass; the Director drives every parameter, which is the part the tool
       this was taken from leaves to you. -->
  <details id="gFilt"><summary>Filter</summary>
    <div class="row"><label>Filter</label><select id="selFilt">
      <option value="0" selected>None</option>
      <option value="1">Halftone &middot; dots</option>
      <option value="2">Halftone &middot; lines</option>
      <option value="3">Pixelate</option>
      <option value="4">Thermal</option>
      <option value="5">Facets</option>
      <option value="6">ASCII</option></select></div>
    <div class="row" id="rowFilt" style="display:none"><label>Amount</label>
      <input type="range" id="filtAmt" min="0" max="100" value="100"><span class="val" id="filtAmtV">100</span></div>
    <div class="row" id="rowCell" style="display:none"><label id="labCell">Cell</label>
      <input type="range" id="filtCell" min="3" max="60" value="3"><span class="val" id="filtCellV">3</span></div>
    <!-- Grain sits OUTSIDE the filter select on purpose: it is not one of the looks, it applies to
         whatever the frame already is. Drag to 0 to turn it off. -->
    <div class="row"><label title="Film grain over the finished frame, in every look. 0 turns it off.">Grain</label>
      <input type="range" id="grainAmt" min="0" max="200" value="100"><span class="val" id="grainAmtV">100</span></div>
  </details>

  <!-- THE ROUTING MATRIX IS GONE FROM THE PANEL, NOT FROM THE ENGINE. It shipped empty in Manual
       and its own empty-state admitted the Director drove everything anyway, so what it offered
       the user was a page of selects that changed nothing until they built a patch by hand -- and
       the mode persisted, so anyone who once set it to Manual never saw it do anything again.
       autoPatch() is the part that was worth keeping: it reads the analysed track and wires the
       body to the kick, bloom to energy, saturation to tension or valence, the lens to epicness
       and a slow swirl to the bar. That now runs unconditionally, which is the whole point --
       the engine drives the movement and the panel above is where you tweak it. See autoMap(). -->

  <details id="gView" open><summary>View</summary>
    <div class="row"><label>Camera</label>
      <button id="auto" class="mini on" title="Who drives the camera: the Director, or you. Drag the canvas to take over. The RATE of the orbit is the Orbit slider under Motion.">Orbit</button>
      <button id="reset" class="mini" title="Return to the Director's framing (or double-click the canvas)">Reset</button></div>
    <!-- One axis, not three. Auto / Rays / Surface asked the viewer to understand a render-scale
         governor, a volumetric toggle and a normal-map switch in order to answer "make it look
         better" — and two of the three were named after their implementation. Quality is now a
         single ladder, and the individual switches remain reachable from the console
         (STEP.shaN) for measuring. -->
    <div class="row"><label>Quality</label>
      <button id="qPreview" class="mini" title="Fast — half shadow samples, coarser march. For scrubbing and setup.">Preview</button>
      <button id="qHigh" class="mini on" title="Full shadows, surface detail, render scale adapting between 0.82x and 1.45x to hold frame rate">High</button>
      <button id="qUltra" class="mini" title="Supersampled, 200 shadow samples, finest march — adapts between 1.00x and 1.60x to stay usable">Ultra</button></div>
    <div class="row"><label>Capture</label>
      <button id="shot" class="mini" title="Save the current frame as a PNG">Frame</button>
      <button id="rec" class="mini" title="Record the canvas to a WebM video">Record</button></div>
    <!-- ROLL. See rollAll() for why this picks a recipe first rather than each control
         independently, and why every roll prints a seed. -->
    <div class="row"><label>Random</label>
      <button id="roll" class="mini" title="Roll a whole new look — shape, material, scene, filter and routing at once  (R)">Roll</button>
      <span class="val" id="rollSeed" style="flex:1;text-align:right;color:#8a8b91">—</span></div>
  </details>

  </div>
</div>

<div id="drop"><h2>ATONAL · AI Director</h2><p>Load a track — the engine will analyse &amp; direct</p></div>
<div id="stat"><span id="statTxt">…</span><span id="statBar"><i id="statFill"></i></span><span id="statPct"></span></div>
  <!-- PERF READOUT. Press P. Off by default and it costs nothing until it is on: the numbers are
       already being computed for the governor, this only prints them. It exists because the frame
       rate cannot be diagnosed from anywhere except the machine that is dropping it -- every
       renderer-side ablation I can run measures flat, so the useful question is which line MOVES
       when the frame rate does, and only the person watching it can answer that. -->
  <div id="perf"></div>

<div id="bar">
  <span class="grp">Source</span>
  <label class="btn" for="file">Load</label><label class="btn" for="svgfile" title="Upload an SVG and extrude it as a new shape">SVG</label><input id="file" type="file" accept="audio/*"><input id="svgfile" type="file" accept=".svg,image/svg+xml">
  <button id="play">Play</button>
  <div id="tl"><div id="tlF"></div><div id="tlS"></div></div>
  <span id="tc">0:00 / 0:00</span>
</div>

<script>
const SERVER = location.hostname && location.protocol.startsWith('http')
  ? location.origin.replace(/:\d+$/, ':8770') : 'http://127.0.0.1:8770';
const $=id=>document.getElementById(id);
window.__errs=[];
function __showErr(m){ let d=document.getElementById('__err'); if(!d){ d=document.createElement('div'); d.id='__err';
  d.style.cssText='position:fixed;left:12px;bottom:70px;z-index:999;max-width:64ch;padding:10px 12px;background:rgba(40,8,8,.94);border:1px solid #f66;border-radius:4px;color:#fbb;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap'; document.body.appendChild(d);} d.textContent=m; }
addEventListener('error',e=>{ const m=(e.error&&(e.error.stack||e.error.message))||e.message||'error'; window.__errs.push(String(m)); __showErr('JS ERROR:\n'+m); });
addEventListener('unhandledrejection',e=>{ const m=(e.reason&&(e.reason.stack||e.reason.message))||e.reason; window.__errs.push('promise: '+m); __showErr('PROMISE ERROR:\n'+m); });

/* A page opened straight from disk is an OPAQUE ORIGIN. The browser refuses its calls to the
   local server — often without even sending the request — and XHR is only told "network error",
   which is indistinguishable from the server being down. The viewer used to relay that as
   "server unreachable, run python server.py", which sends you off to restart a server that is
   already running and cannot be the problem. Rendering works fine from file://; only the
   analysis round-trip does not, so this is a notice rather than a refusal to start. */
const FILE_MODE = location.protocol === 'file:';
if(FILE_MODE){
  __showErr('Opened from a file:// path.\n\nThe browser blocks this page from reaching the '
    +'analysis server, so Load cannot work here — the server being "unreachable" is the browser '
    +'refusing, not the server being down.\n\nOpen this instead:\n  http://127.0.0.1:8770/viewer.html');
}

/* ======================= WEBGL ======================= */
const glc=$('gl');
// preserveDrawingBuffer stays FALSE in normal use - it forces the driver to keep a copy of every
// frame. ?readback turns it on for measurement only: without it the canvas reads back empty from
// anywhere outside the render callback, so any pixel metric silently returns zero rather than
// failing, which is the worst way for a measurement to be wrong.
const gl=glc.getContext('webgl2',{antialias:false,alpha:false,
  preserveDrawingBuffer:location.search.indexOf('readback')>=0});
let floatOK=false;
if(gl){ floatOK=!!gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear'); }

const VERT=`#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;

const SCENE=`#version 300 es
precision highp float;
// GLSL ES 3.00 gives sampler2D and samplerCube a default precision in the fragment stage but
// NOT sampler3D — declaring one without this is a COMPILE ERROR, which takes the whole scene
// shader down and leaves the viewer with nothing on screen at all.
precision highp sampler3D;
out vec4 o;
uniform vec2 u_res; uniform float u_time;
uniform vec3 u_ro,u_rt,u_up,u_fw; uniform float u_fov;
uniform float u_spin;
uniform float u_wob,u_tilt,u_iridHue,u_mode,u_mode2,u_mix,u_reform;
uniform float u_edgeVar,u_thickVar,u_chamf;   // shape refinement; see extr()
/* HARD-SURFACE LOOK. Three levers, all zero in every other look, so this costs nothing when off.
   The target is what makes a flat-shaded product render legible: each face holds ONE tone, and
   the faces meet at a line rather than a fillet. Measured against a reference doing exactly that,
   the difference was not subtle -- a luminance histogram of face interiors there falls into three
   tight clusters, one per face family, where this engine's was a continuous smear across 33 bins
   with no clusters at all. A gradient over every surface is precisely what stops planes reading
   as planes. */
uniform float u_bevK;      // multiplies the extrusion bevel: 1 = the sculpted fillet, ~0.2 = an edge
uniform float u_hardAmb;   // 0 = irradiance follows the normal, 1 = one ambient tone for every face

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
/* THE SMOOTH UNION, AND WHY IT IS CUBIC. The usual quadratic form -- which this file carried twice
   under two names, smin and sMin2, with byte-identical bodies -- is C1: at the edge of the blend
   region its value and its gradient both match min(), but its SECOND derivative jumps. Curvature is
   precisely what a
   specular surface displays, so that jump draws a faint line tracing the outer boundary of every
   fillet -- a Mach band on a surface with no crease in it. Widening the fillet cannot remove that
   line, it only moves it, which is why the earlier attempts to cure the kaleidoscope seam by
   raising k made the form blobbier without making it cleaner.
   h^3 sends the second derivative to zero there as well, so the fillet has no visible edge.
   Depression at a==b is k/6 rather than k/4, so an equivalent fillet asks for 1.5x the k. */
float smin3(float a,float b,float k){
  float h=max(k-abs(a-b),0.0)/k;

float h31(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}

// exists (see map(); the ripple it left was the reported radial lines and the whole term is gone),
// and kept because the backdrop colour field calls fbm too and wants cells that join cleanly.
// The reasoning below is why the quintic, and it is also a record of a fix that was correct about
// its mechanism and still did not solve the complaint:
//
// This noise displaces the SDF, so what the shading reads is not the field but its GRADIENT, and
// how the gradient VARIES across a pixel is the second derivative. 3t^2-2t^3 is C1 only: its
// second derivative jumps at every lattice boundary, so the normal is continuous but kinked, and
// a kinked normal on a smooth body is exactly a flat facet with a straight edge. The displacement
// runs at 2.0-4.8 cells per unit, which puts those cells at 30-60 screen px at working framing —
// the size of the polygons that were visible on the Clover.
//
// 6t^5-15t^4+10t^3 has zero first AND second derivative at both ends, so the cells join with no
// crease. The bake shader worked this out for the detail map and says so in its own comment; the
// same argument applies with far more force here, where the field is the geometry rather than a
// texture. Isolated by ablation with the displacement's own switch, which removed the faceting
// completely where nothing else did.
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*f*(f*(f*6.-15.)+10.);
  float a=h31(i),b=h31(i+vec3(1,0,0)),c=h31(i+vec3(0,1,0)),d=h31(i+vec3(1,1,0));
  float e=h31(i+vec3(0,0,1)),g=h31(i+vec3(1,0,1)),hh=h31(i+vec3(0,1,1)),k=h31(i+vec3(1,1,1));
  return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(e,g,f.x),mix(hh,k,f.x),f.y),f.z);}

/* ============ COMPLEX GEOMETRIC FORMS ============
   Hard-surface constructions: rounded and chamfered primitives combined with booleans,
   polar/grid arrays and smooth blends — the language of product design, not fractals.
   The emotion curves drive the CONSTRUCTION parameters (twist, density, thickness, cut). */
/* MEASURED OFF THE REFERENCE MESH, and still true of it — the constants they produced belonged
   to the pierced-shell family that the extruded profiles below replaced, but the measurements
   themselves are about the reference and are kept because they are what a future family would
   have to be fitted against again:
     - It has NO symmetry. Aligned to its own principal axes, every candidate operation (2-, 3-,
       4-fold, inversion) still leaves a mean vertex error of 0.16-0.30, and its half-extents are
       0.894 / 1.134 / 1.321 — all different. Perfectly symmetric forms read as generated.
     - It is HOLLOW: solid fraction 0.0217 of the sampled volume, where a solid body with bores
       cannot get below 0.0322 without breaking into pieces. A shell of about 0.13 wall, not a
       lump with holes drilled in it. */
/* ================= EXTRUDED PROFILE SHAPES =================
   Rebuilt to the reference's form language. The previous set were ellipsoid shells with holes
   bored through them — organic blobs, which is why they read as lumps of material rather than as
   designed objects however good the shading got. The reference forms are EXTRUDED 2D PROFILES:
   a flat front face, a flat back face, straight side walls between them, and a small rounded
   bevel where face meets wall. That bevel is the whole thing visually — it is a narrow, almost
   cylindrical band that sweeps a specular highlight along the entire silhouette as the form
   turns, and it is what separates a "designed object" from a "blob" long before material or
   lighting get a say.

   Built the same way mSVG already extrudes uploaded artwork, so the two paths agree: define the
   profile in 2D, inflate by the bevel, extrude, deflate. Profiles are composed from rounded
   capsules and discs, because a rounded-capsule union gives exactly the fat, even-weight stroke
   the reference draws with, and its distance field stays close to euclidean so the march does
   not slow down. */
float s2Seg(vec2 p,vec2 a,vec2 b,float r){
  vec2 pa=p-a, ba=b-a;
  float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.0,1.0);
  return length(pa-ba*h)-r;
}
float s2Disc(vec2 p,float r){ return length(p)-r; }
float s2Box(vec2 p,vec2 b,float r){ vec2 d=abs(p)-b+r; return min(max(d.x,d.y),0.0)+length(max(d,0.0))-r; }
float sMax2(float a,float b,float k){ float h=clamp(0.5-0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)+k*h*(1.0-h); }
mat2 rr2(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }

/* Flat faces + straight walls + rounded bevel. Inflate the profile and the slab by the bevel,
   take the rounded intersection, deflate — the standard rounded extrusion, and the same one
   mSVG uses so an uploaded shape and a built-in one are the same kind of object. */
const float EXR = 1.15;                    // the radius every profile is normalised to
/* THE SURFACE LANGUAGE, not just the silhouette. Every form used one constant depth and one
   constant bevel, so although the six profiles differ in outline they were all the same object
   underneath: a flat slab of uniform thickness with the same rounded edge everywhere. That is
   why they read as cut rather than sculpted — nothing tapers, no edge changes character, and the
   form looks identical in section from any angle.

   Three modulations, all driven by r, how far out in the profile plane the point lies:

   THICKNESS  barrelled through the middle and drawn in toward the rim, so the form has a section
              instead of a constant slab, and the silhouette turns as it rotates.
   BEVEL      broad where the profile is broad, tightening as it runs out to the extremities.
              This is the one that reads as "designed": a constant fillet is the default any CAD
              package gives you, and a fillet that responds to the form is what a modeller does
              by hand.
   CHAMFER    a narrow flat cut across the face/wall corner. A pure fillet rolls light smoothly
              and reads soft; a flat holds a straight highlight along the edge, which is what
              makes a machined object look machined. u_chamf 0 is exactly a no-op.

   The field pays for this. Making the depth and bevel functions of p.xy means the distance is no
   longer exact — the gradient picks up roughly 0.19 from the thickness term at the rim — so the
   result is scaled by 0.88 to keep it a conservative underestimate. That is the same discipline
   the morph guard follows, and it matters for exactly the same reason: a field that overestimates
   its own distance gets marched straight through. */
/* The form's global scale, used by map() and by the ray/bound test in main(). Factored out so
   there is exactly one definition: a bound computed from a stale copy of this expression would
   clip the silhouette the moment a bass hit pushed the form past it. */
/* THE BEAT TERMS ARE HALVED. u_energy is a section-level curve and stays where it was; the three
   after it are the per-beat swell, and they were sizing the form up and down on every kick, with
   the camera dollying in on the same hit for a bit more on top. Measured as peak-to-peak
   on-screen size over two windows of playback (the spread between them is just how loud that
   stretch of the track is):

                    form     camera    net
     before         5.2%     1.7%      6.8%      quiet stretch
     before         7.2%     1.2%      8.4%      loud stretch
     after          3.6%     0.6%      4.2%      same loud stretch

   Both sides are scaled by the same 0.5, so the net halves wherever it is measured -- the numbers
   above are a confirmation, not a target. ~2Hz at 8% is a throb; at 4% it is an accent. */
/* THE FORM NO LONGER PUNCHES ITS OWN SIZE. This carried u_pulse*0.05 + u_hLow*0.065 +
   u_hSub*0.045, so the whole object grew and shrank on every kick and sub hit -- and something
   in a mix lands on almost every frame, so it never settled. That is the jiggle. It is also the
   same fault, in a different variable, that spinKick was removed for: an onset driving a
   CONTINUOUS property of the body reads as trembling, not as rhythm.
   u_energy stays: it is a section-level curve, it moves over bars rather than beats, and a
   louder passage having a slightly larger form is scale, not jitter. The beat is still visible --
   it drives the light (u_keyPulse), the density and the count, which is where the reference puts
   it too: its rosette holds absolutely steady while its blades change. */
float formScale(){
  // 0.16 rather than 0.10 on the energy term. This is the section curve, which moves over bars
  // and not beats -- the note above is explicit that a louder passage being a larger form is
  // scale rather than jitter, so it is the one size response that is safe to widen.
  return max(u_reform,0.2)*(1.0+u_energy*0.16)*0.95;
}
float extr(float d2,vec3 p,float halfD,float bev){
  float r = clamp(length(p.xy)/EXR, 0.0, 1.0);
  float hd = halfD*(1.0 + (0.075*(1.0-r*r) - 0.150*r*r*r)*u_thickVar);
  // TIGHT ON THE BROAD FACES, SOFTER AT THE TIPS. A designed object crisps up where there is
  // face to hold an edge and eases off where the form runs out to a termination; the first
  // version had it the other way round, broadening the fillet through the middle, which rounds
  // away the one region that wants to read as a flat face.
  //
  // NOT VISUALLY VERIFIED. The direction above is design reasoning, not a measurement — the
  // browser pane available while this was written had a stopped render loop, so no A/B of these
  // parameters was actually observed. The magnitudes are in the right range to be visible at the
  // default framing (bevel ~27px on screen, the edge term moving ~8px and the thickness term
  // ~22px at the rim), which is the argument for the numbers, not evidence about the result.
  float bv = bev*mix(1.0, 0.70+0.62*r*r, u_edgeVar);
  d2 += bv;
  float dz = abs(p.z) - hd + bv;
  vec2 w = vec2(d2,dz);
  float d = min(max(d2,dz),0.0) + length(max(w,0.0)) - bv;
  // 45 degree cut across the corner. At u_chamf 0 the plane sits exactly on the rounded corner
  // and changes nothing; above that it bites, leaving a flat band between face and fillet.
  d = max(d, (d2+dz)*0.70710678 - bv*(1.41421356-0.45*u_chamf));
  return d*0.88;
}
// depth and bevel ride the track: the slab thickens on low end, the bevel sharpens on air
// The user parameters multiply the audio-driven value rather than replacing it, so the Director
// keeps animating the form and the slider decides how much form there is to animate.
float exDepth(){ return (0.30 + u_gThick*0.05)*u_pDepth; }
/* u_kalBev KEEPS THE EDGE THE SAME SIZE WHEN THE FOLD IS OPEN. kalEval evaluates the form in a
   domain divided by S (about 0.59 at the shipped settings) and the framing holds the silhouette
   at the same size on screen, so everything inside it -- the bevel included -- came out 41%
   tighter the moment the kaleidoscope bloomed. The form did not become more angular; its
   rounding got smaller relative to the frame, which is what read as edges being too sharp.
   The compensation is 1/S, faded in with the bloom so nothing steps. */
float exBevel(){ return (0.055 + u_gCut*0.012)*u_pEdge*u_bevK*u_kalBev; }

// ---- profiles ----
/* WHY THE UNIONS BELOW ARE SMOOTH ONES, AND WHERE THE RADIAL LINES CAME FROM.
   min(a,b) of two overlapping fields is continuous but its GRADIENT is not: it jumps across the
   set where a==b. Normals are that gradient, so every such set renders as a hard crease. In these
   profiles the repeated elements are placed by rr2(i*2PI/N), which puts their equidistant sets on
   radii -- so the crease is a RADIAL LINE, one per junction, N of them around the form. That is
   the artefact, and it is arithmetic rather than a shading or marching problem.

   It hides on the flat faces, which is why it survived several passes looking for it there: extr()
   gives the form a flat top and bottom whose surface does not depend on the profile at all. The
   crease only reaches the surface where the bevel rolls over, so it reads as short radial marks
   crossing the rounded edge, repeating around the rim.

   smin3 removes it by construction -- it is smooth where min is not. The radius is a fraction of the
   stroke weight rather than a constant, so a junction fillet stays in proportion on a heavy profile
   and a fine one alike, and follows the Mass control instead of fighting it.

   THE FIELD STAYS SAFE. smin3 <= min everywhere, so the result is still a conservative
   underestimate of the true distance and the march cannot step through the surface. The fillet
   compounds where several elements are mutually equidistant, but that only happens deep inside the
   solid (the hub, where every arm meets), and inflating the interior of a solid moves no surface. */
// Junction fillet radius as a fraction of stroke weight. 0.48 at the cubic's k/6 depression
// is the same fillet 0.32 gave at the quadratic's k/4.
const float FILLET = 0.48;
// TRISKELION — three arms, each running out from the centre then hooking a quarter turn. The
// reference's own shape; the hook is what makes the silhouette read differently from every angle.
float p2Tris(vec2 p){
  float d=1e9, w=0.19+u_gDense*0.03;
  // Segment count is a uniform, so the step is 2pi/N rather than a baked 2pi/3. GLSL ES 3.00
  // allows a non-constant loop bound, which is what makes this a parameter and not a rebuild.
  int N=int(clamp(u_segN,2.0,8.0));
  for(int i=0;i<N;i++){
    vec2 q=rr2(float(i)*6.2831853/float(N)+u_gTwist*0.25)*p;
    float a=s2Seg(q,vec2(0.02,0.0),vec2(0.66,0.0),w);
    float b=s2Seg(q,vec2(0.66,0.0),vec2(0.66,0.70),w);
    d=smin3(d, smin3(a,b,0.24), FILLET*w);   // arm-to-arm, was min() -- the radial crease

  }
  return d;
}
// CLOVER — three fat lobes on a hub, the simplest bold poster form
float p2Clover(vec2 p){
  float d=s2Disc(p,0.30+u_gDense*0.04);
  int N=int(clamp(u_segN,2.0,8.0));
  for(int i=0;i<N;i++){
    vec2 q=rr2(float(i)*6.2831853/float(N)+1.5707963)*p;
    d=smin3(d, s2Disc(q-vec2(0.0,0.62),0.40+u_gDense*0.04), 0.33);
  }

}
// ARC — a broken ring, the counter-shape. Reads as a single confident stroke.
// Analytic, not chained. Two earlier versions failed differently and both are worth remembering:
// cutting a gap out of a full ring needed its end caps placed by hand at the cut angles and one
// landed inside the removed wedge, rendering as a disc floating free of the body; chaining nine
// capsules along the arc fixed that but left the outer silhouette visibly FACETED, because the
// boundary sits a fixed width from each straight chord and a 30-degree chord has a 2.6% sagitta.
// Raising the count would fix the facets and multiply the per-sample cost, in a function the
// raymarch evaluates millions of times a frame.
// The closed form has neither problem: exact curvature everywhere, round ends for free, one
// branch, constant cost. Outside the aperture the nearest point is the end cap, inside it the
// nearest point is the ring — which is exactly the two cases below.
float p2Arc(vec2 p){
  float w=0.21+u_gDense*0.03, R=0.72;
  p=rr2(-0.70)*p;                       // orient the opening
  const float HA=2.356;                 // half-aperture 135 deg -> a 270 deg arc
  vec2 sc=vec2(sin(HA),cos(HA));
  p.x=abs(p.x);
  return ((sc.y*p.x>sc.x*p.y) ? length(p-sc*R) : abs(length(p)-R)) - w;

// CHEVRON — nested Vs, the most graphic of the set
float p2Chev(vec2 p){
  float d=1e9, w=0.115+u_gDense*0.02;
  for(int i=0;i<2;i++){
    float o=0.30+float(i)*0.46;
    vec2 q=p+vec2(0.0,0.30);
    float a=s2Seg(q,vec2(-0.74,o-0.34),vec2(0.0,o+0.18),w);
    float b=s2Seg(q,vec2( 0.74,o-0.34),vec2(0.0,o+0.18),w);
    d=smin3(d, smin3(a,b,0.135), FILLET*w);  // V-to-V
  }
  return d;

// WAVE — an S laid on its side, so the extrusion wall turns through the whole silhouette
float p2Wave(vec2 p){
  float w=0.20+u_gDense*0.03, d=1e9;
  d=min(d, s2Seg(p,vec2(-0.80, 0.34),vec2(-0.26, 0.34),w));
  d=smin3(d, s2Seg(p,vec2(-0.26, 0.34),vec2( 0.26,-0.34),w), 0.39);
  d=smin3(d, s2Seg(p,vec2( 0.26,-0.34),vec2( 0.80,-0.34),w), 0.39);
  return d;
}
// PLATE — a rounded slab with three bores. Closest to the old set, kept so the family has a
// solid, quiet member between the busier ones.
float p2Plate(vec2 p){
  float d=s2Box(p,vec2(0.86,0.86),0.34);
  for(int i=0;i<3;i++){
    vec2 q=rr2(float(i)*2.0943951+0.5)*p;
    d=sMax2(d, -s2Disc(q-vec2(0.0,0.42),0.26+u_gCut*0.04), 0.06);

/* Each profile is drawn at whatever size its construction happens to give, then normalised to a
   common radius here — d(p/S)*S is the exact SDF scale, so the field stays valid. Without this
   the framing constants below would have to encode six different natural extents, and every one
   of them would silently drift the moment a profile constant was touched. One target radius, six
   scales derived from the geometry, and the camera can frame them all identically. */
/* ---- THREE MORE COMPLEX PROFILES ----
   The original six are single strokes: three arms, three lobes, a broken ring, a chevron, a Z and
   a plate. Each is one gesture, and from most angles the silhouette is one closed outline. These
   three are built to have INTERNAL structure -- holes, crossings, repeated teeth -- so the form
   still has something to show when it turns edge-on and the light has somewhere to break up.

   All three are exact unions of primitives rather than folded domains, for the reason the
   kaleidoscope note gives at length: a fold's result depends on a symmetry the shape has to
   actually possess, while min() of real primitives cannot be wrong about one. They also stay
   cheap -- the cost is a fixed number of segment/circle distances, the same order as p2Tris. */
// GEAR — a toothed annulus with a bore. u_segN sets the teeth, at two per segment, so the
// Segments slider means something obvious here: 3 gives six teeth, 8 gives sixteen.
float p2Gear(vec2 p){
  int N=int(clamp(u_segN,2.0,8.0))*2;
  float w=0.075+u_gDense*0.020;
  float d=abs(length(p)-0.44)-(0.145+u_gThick*0.02);       // the rim
  for(int i=0;i<16;i++){
    if(i>=N) break;
    vec2 q=rr2(float(i)*6.2831853/float(N)+u_gTwist*0.10)*p;
    // Tooth into rim. A real gear has a root fillet here; min() gave it a crease instead.
    d=smin3(d, s2Seg(q, vec2(0.42,0.0), vec2(0.70,0.0), w), FILLET*w);
  }
  return max(d, -(length(p)-(0.16+u_gCut*0.03)));           // and the bore
}
// KNOT — N rings, each pushed off centre, overlapping into a rosette. Real holes between them,
// and the crossings give the extrusion something to do that a single outline never does.
float p2Knot(vec2 p){
  int N=int(clamp(u_segN,2.0,6.0));
  float w=0.070+u_gDense*0.025;
  float R=0.36, off=0.32;
  float d=1e9;
  for(int i=0;i<6;i++){
    if(i>=N) break;
    vec2 c=rr2(float(i)*6.2831853/float(N))*vec2(off,0.0);
    d=smin3(d, abs(length(p-c)-R)-w, FILLET*w);   // ring crossings get a fillet, not a crease
  }
  return d;
}
// LATTICE — a woven grid clipped to a disc. The one profile here with no radial symmetry at all,
// which is deliberate: everything else in the set turns about its centre, and a square weave
// reads completely differently under the same rotation.
float p2Lattice(vec2 p){
  int N=int(clamp(u_segN,2.0,5.0));
  float w=0.048+u_gDense*0.022;
  float st=1.30/float(N+1);
  vec2 q=rr2(u_gTwist*0.18)*p;
  float d=1e9;
  for(int i=0;i<5;i++){
    if(i>=N) break;
    float o=(float(i)-float(N-1)*0.5)*st;
    d=smin3(d, abs(q.y-o)-w, FILLET*w);           // bar crossings, same reason
    d=smin3(d, abs(q.x-o)-w, FILLET*w);
  }
  return max(d, length(p)-(0.74+u_gThick*0.04));           // clipped, or the bars run forever
}
float mArray(vec3 p){    float S=EXR/1.152; return extr(p2Tris (p.xy/S)*S, p, exDepth(), exBevel()); }
float mStack(vec3 p){    float S=EXR/1.020; return extr(p2Clover(p.xy/S)*S, p, exDepth(), exBevel()); }
float mRings(vec3 p){    float S=EXR/0.930; return extr(p2Arc  (p.xy/S)*S, p, exDepth(), exBevel()); }
float mTruss(vec3 p){    float S=EXR/0.870; return extr(p2Chev (p.xy/S)*S, p, exDepth()*0.92, exBevel()); }
float mPods(vec3 p){     float S=EXR/1.070; return extr(p2Wave (p.xy/S)*S, p, exDepth(), exBevel()); }
float mAperture(vec3 p){ float S=EXR/1.075; return extr(p2Plate(p.xy/S)*S, p, exDepth()*1.05, exBevel()); }
float mGear(vec3 p){     float S=EXR/1.000; return extr(p2Gear (p.xy/S)*S, p, exDepth()*0.95, exBevel()); }
float mKnot(vec3 p){     float S=EXR/1.020; return extr(p2Knot (p.xy/S)*S, p, exDepth()*0.90, exBevel()); }
float mLattice(vec3 p){  float S=EXR/1.060; return extr(p2Lattice(p.xy/S)*S, p, exDepth()*0.85, exBevel()); }

/* ---- CUSTOM SVG ----
   The uploaded artwork arrives as a 2D signed distance field baked into a texture, so the
   raymarcher can treat it like any other primitive: sample the plane distance, then extrude.
   A texture rather than analytic paths because an SDF march evaluates the field millions of
   times per frame — walking a path list per sample would be thousands of times slower, and the
   field only has to be built once per upload.
   Outside the texture the sample is meaningless (clamped edge), so the distance there is
   reconstructed from the border padding plus how far the point lies beyond the edge. Without
   that the field flattens off past the border and the march walks straight through it. */
float mSVG(vec3 p){
  vec2 q=p.xy;
  vec2 uv=q*0.5+0.5;
  vec2 cl=clamp(uv,0.0,1.0);
  float d2=texture(u_svg,cl).r;
  // add the planar distance from the clamped point back to the real one
  d2+=length((uv-cl)*2.0);
  float dz=abs(p.z)-u_svgDepth;
  float b=u_svgBevel;
  d2+=b; dz+=b;                       // inflate, then deflate by b -> a rounded edge
  vec2 w=vec2(d2,dz);
  return min(max(d2,dz),0.0)+length(max(w,0.0))-b;
}
/* ---- IMPORTED MESH ----
   A triangle mesh baked to a 3D signed distance field offline and sampled here, which is the
   only way a raymarcher can render an arbitrary model: the march needs a distance at any point
   in space, and a triangle soup does not provide one without an acceleration structure the
   shader has no way to carry.
   Stored as uint16 over a clamped near-surface range, decoded here. 16 bits puts one level at
   1e-5 against a 0.0138 texel — three orders below the grid, so quantisation contributes
   nothing to the reconstruction, unlike the 8-bit case that terraced the SVG field.
   Outside the grid the sample is meaningless (clamped edge), so distance there is the box
   distance to the grid plus whatever the edge reported — without that the field flattens off
   and the march walks straight through the volume. */
float mVol(vec3 p){
  vec3 uv=p/u_volPad*0.5+0.5;
  vec3 cl=clamp(uv,0.0,1.0);
  float d=texture(u_vol,cl).r;      // already decoded to object units on upload
  vec3 q=abs(p)-u_volPad;
  // NOT named 'out' — that is a reserved storage qualifier in GLSL, and using it as a variable
  // is a syntax error that fails the ENTIRE scene shader, not just this function.
  // (And the quotes here are apostrophes on purpose: a backtick inside this comment would end
  //  the JS template literal holding the shader, which breaks the whole script, not just GLSL.)
  float outside=length(max(q,0.0));
  return outside>1e-6 ? outside+max(d,0.0) : d;
}
float evalMode(vec3 p,float m){
  if(u_volOn>0.5) return mVol(p);   // an imported mesh replaces the generated set entirely
  if(u_svgOn>0.5) return mSVG(p);   // an uploaded shape replaces the generated set entirely
  if(m<0.5)       return mArray(p);
  else if(m<1.5)  return mStack(p);
  else if(m<2.5)  return mRings(p);
  else if(m<3.5)  return mTruss(p);
  else if(m<4.5)  return mPods(p);
  else if(m<5.5)  return mAperture(p);
  else if(m<6.5)  return mGear(p);
  else if(m<7.5)  return mKnot(p);
  else            return mLattice(p);
}
/* THE FORM'S ORIENTATION, in one place. map() and objP() both need it and they MUST agree: objP
   is the frame the surface texture is projected in, so any disagreement makes the detail slide
   through the geometry. This was two copies of the same two lines; a third axis is exactly the
   kind of change that gets applied to one copy and not the other.

   THREE PLANES, THREE INDEPENDENT ANGLES. The two-plane spin that was removed from this file long
   ago drove both planes off the SAME angle, which is not a tumble but a precessing axis -- the
   form never repeats a pose and there is nothing for the eye to lock onto. These are three clocks
   at 16, 24 and 48 beats, so every axis turns at its own rate and the whole system returns to its
   starting orientation every 48 beats: twelve bars, one phrase group.

   Z FIRST. The profile is drawn in xy and extruded along z, so u_swirl turns the form about its
   own symmetry axis -- and it is the axis the kaleidoscope folds about, which means the fold
   travels with the form instead of the form travelling through the fold. */
vec3 formRot(vec3 p){
  p.xy*=rot(u_swirl);
  p.yz*=rot(u_tilt);
  p.xz*=rot(u_spin);
  return p;
}
/* The mode pair and the morph between them, factored out of map() so the kaleidoscope below can
   evaluate the SAME form at a second position without duplicating the blend.
   SMOOTHERSTEP (6t^5-15t^4+10t^3) rather than smoothstep. smoothstep has zero first derivative
   at the ends but a discontinuous SECOND derivative, so the melt visibly jerks into and out of
   motion — on a shape change, that snap at each end is most of what reads as abrupt.
   Smootherstep is C2, so the morph eases in and out with no kick. */
/* HOW THE TWO FIELDS ARE COMBINED. mix() was the obvious choice and it is the wrong one.
   Measured, not reasoned: pinned at MORPHPIN={from:8,to:2,mix:0.5} the blended form comes back
   covered in large flat facets, and it stays IDENTICAL with the step cut to a third (1.45 ->
   0.45) and the budget raised to 224. A march artefact would have moved. It did not, so the
   facets are in the FIELD: the average of two fields averages their creases too, and every
   profile here is built from min/max, so both sides bring plenty. Lattice's periodic bars
   crease the Arc's ring into a low-poly shell -- geometrically honest, and it looks broken.
   The fix blends through a smooth UNION instead of an average. Each field is eroded by K as it
   leaves and un-eroded as it arrives; min(a+c,b+c)=min(a,b)+c exactly, so the constant comes
   straight back out and at m=0.5 this reduces to smin(a,b) -- both shapes present at full size,
   joined by a fillet, no creases anywhere. At m=0 and m=1 it is exactly a and b, so the
   endpoints are untouched and only the middle of the transition changes.
   K=1.0 because the profiles' deepest interior is about -0.5, so b+K clears a's surface at m=0
   and the far shape cannot bleed into the near one at the ends.
   Still Lipschitz-1: smin3 of two 1-Lipschitz fields, offset by per-frame constants. */
/* The crease-free crossfade, shared by the shape morph and the kaleidoscope fade. Both cross
   between two quite different fields, and mix() averages their creases into flat facets -- see
   the note above. min(a+c,b+c)=min(a,b)+c exactly, so the erosion constant cancels and the
   midpoint is smin(a,b): both forms at full size joined by a fillet. */
/* AND IT MELTS THROUGH A BALL, rather than showing both forms at once.
   The smooth union fixed the faceting the old mix() produced, but it is a UNION: at the middle
   of a transition both shapes are present at full size, so the incoming one arrives as separate
   material sitting inside or behind the outgoing one -- visible pieces of the next shape, which
   is not what a change of form should look like. Eroding harder fuses them but re-exposes the
   creases the union was introduced to remove, so there is no setting of the pair that is both.
   Passing the blend through a SPHERE at the midpoint solves both at once. A ball has no creases
   to average and no features to recognise, so the middle of the transition is smooth and reads
   as one object rather than two overlaid ones: the form softens into a blob and the new one
   grows back out of it. sin(m*PI) is zero at both ends, so m=0 and m=1 are still exactly a and
   b -- the endpoints stay untouched, which is the property the whole blend is built around.
   Still Lipschitz-1: mix() of 1-Lipschitz fields, and a sphere is one. */
float blendField(vec3 p,float a,float b,float m){
  if(u_morphU<0.5) return mix(a,b,m);            // legacy average, for A/B
  const float K=1.0;
  float comp=K*0.5*(1.0-abs(2.0*m-1.0))*u_morphC;
  float d=smin3(a+K*m, b+K*(1.0-m), u_morphK)-comp;
  /* Raised to a power so the ball is confined to the MIDDLE. Plain sin(m*PI) is already 0.81 at
     m=0.3, which rounds the outgoing shape away before it has visibly begun to change; the eye
     reads that as the form being replaced rather than transformed. At 2.5 the same point is
     0.42, so each end holds its own identity through the first and last third and the melt
     happens where nothing is recognisable anyway. */
  float w=pow(sin(m*3.14159265), 2.5)*u_morphBlob;
  if(w>0.001){
    // radius tracks the form's own reach, so the melt neither swells nor collapses the frame
    float sph=length(p)-u_morphR;
    d=mix(d,sph,w);
  }
  return d;
}
float evalForm(vec3 p){
  float d=evalMode(p,u_mode);
  if(u_mix>0.001){ float m=clamp(u_mix,0.,1.); m=m*m*m*(m*(m*6.0-15.0)+10.0);
    float b=evalMode(p,u_mode2);
    d=blendField(p,d,b,m);
  }
  return d;
}
/* ---- KALEIDOSCOPE ----
   THE FORM IS UNIONED WITH ITS OWN MIRROR IMAGE. That is the whole design, and it is the second
   attempt: the first one folded the domain, mod-and-abs, the way every kaleidoscope shader does.

   Folding is wrong HERE for a reason specific to these shapes. A domain fold keeps only what lies
   inside one wedge and replicates that; everything outside is discarded. The Triskelion's mass is
   in three arms that hook outward, and most of that mass sits at angles the wedge does not cover,
   so folding threw the arms away and replicated the hub — a small six-pointed star with no visible
   relationship to the form it came from. Measured by eye against the same pose: the folded version
   was roughly half the silhouette area and shared no feature with the original.

   TRIED A SECOND TIME AND REVERTED, so the next person does not spend the day on it. The obvious
   repair to the above is to fold about Z instead of Y (these profiles are drawn in xy, so Z is
   the axis their structure is actually on) and to take the wedge from u_segN, the form's own
   segment count -- the argument being that the profiles are already C_N about z, so folding by
   2PI/N maps every arm onto an arm that was already there and only the abs() adds anything.

   The argument is sound and the premise is false, and the note below says so twenty lines further
   down: only p2Tris and p2Clover are N-fold at all. p2Wave is C2 at best and four of the six
   modes are like it. On a profile that is NOT C_N, folding by 2PI/N does not map arms onto arms;
   it cuts the form and replicates a slice, and the pieces that survive are DISCONNECTED. Under
   Director-driven playback -- auto shape, a morph in flight, segments off their default -- a drop
   rendered the form as a body plus two detached fragments floating beside it.

   It measured well on every static test: silhouette retention 0.73 against the first attempt's
   0.50, and a cost of -12% against the union's +64%, because a fully open fold is one evalForm
   where the union is two. All of that is still true. It was verified on the Triskelion, which is
   one of the two shapes where the premise holds, and a frozen-pose sweep never reproduced the
   fragmentation. If this is attempted again: gate the fold on the profile actually being C_N and
   keep the union for the rest, and make the test a CONNECTED-COMPONENT count under a playing
   track, not a still frame.

   A union cannot lose anything. min(f, f∘mirror) contains the original exactly, plus its
   reflection, so every feature survives and the form GROWS into a symmetric version of itself
   rather than being cut down into one. The profiles are already N-fold symmetric about z (p2Tris
   rotates by i*2PI/u_segN), so adding one reflection promotes C_N to the full dihedral D_N: the
   same arms, in the same places, each now paired with a mirror twin.

   THE MIRROR LINE IS ABOUT Z, which is the axis the profiles are actually built on — they are
   drawn in xy and extruded along z. The first version folded xz, about Y, an axis they have no
   structure on at all, which is the other half of why it read as a different object.

   u_kalPh is the mirror line's angle, and it CHANGES THE RESULT MORE THAN THE MATHS SUGGESTS.
   For a profile with N-fold symmetry the twin should repeat every PI/N, so on a three-arm form
   0 and 60 degrees ought to be the same object. Rendered on one frozen frame with the pose pinned,
   0, 60 and 120 degrees gave three visibly different shapes — because only p2Tris and p2Clover are
   N-fold at all. The default startup profile is p2Wave, a Z-stroke with nothing but C2 symmetry
   and no relationship to u_segN whatever, and four of the six modes are like it. So treat the
   angle as a dial with a look at each setting, not as a lattice with equivalent positions.

   This is also why the effect is a UNION and not a fold: a fold's output depends entirely on which
   symmetry you assume the form has, and most of these do not have one. A union cannot be wrong
   about that — whatever the profile is, the original survives it intact.

   smin rather than min, so the twins meet in a fillet instead of a crease.

   VALID AS A FIELD at every value of u_kal. smin of two 1-Lipschitz functions is 1-Lipschitz, and
   so is a convex combination of two of those, so the morph never produces a field the march can
   step through. Mixing a folded POSITION into an unfolded one — the obvious way to blend this —
   has no such guarantee: a domain map whose derivative passes through zero compresses space and
   the field then overestimates in the compressed direction. */
/* WHICH PROFILES CAN BE FOLDED, and at what order. Returns the profile's rotational symmetry
   about z, or 0 for "no symmetry to fold on, use the union instead".

   THIS GATE IS THE WHOLE LESSON of the previous attempt, recorded above. A domain fold by 2PI/N
   only maps arms onto arms if the profile really is C_N; on one that is not, it cuts the form and
   replicates a slice, and the surviving pieces come apart. Read off the constructions rather than
   assumed -- and the reading disagrees with the older note, which said only p2Tris and p2Clover:

     mArray   p2Tris     loop at i*2PI/N, N=clamp(segN,2,8)          -> C_segN
     mStack   p2Clover   loop at i*2PI/N plus a centred disc         -> C_segN
     mGear    p2Gear     teeth at i*2PI/2N, circular rim and bore    -> C_2segN, so C_segN holds
     mKnot    p2Knot     loop at i*2PI/N, N=clamp(segN,2,6)          -> C_segN AT ITS OWN CLAMP
     mRings   p2Arc      p.x=abs(p.x): one mirror, no rotation       -> none
     mTruss   p2Chev     two mirrored chevrons                       -> none
     mPods    p2Wave     a Z-stroke, C2 at best and never C_segN     -> none
     mAperture p2Plate   rounded SQUARE (C4) cut by THREE bores (C3) -> C1, none
     mLattice p2Lattice  parallel bars, translational                -> none

   p2Knot matters: it clamps its own N to 2..6, so a fold at segN=8 would be folding at an order
   the profile does not have. It gets its clamp, not segN's.

   The imported mesh and the uploaded SVG replace the generated set outright in evalMode() and
   have no symmetry at all, so they are excluded first. */
/* WHAT TO HAND kalFold: it cuts 2N sectors, so N is the number of MIRROR LINES.
     n   the profile's own rotational symmetry, where it has one
     1   no rotational symmetry, but a single mirror fold does not break it
     0   no kaleidoscope at all -- folding this profile cuts a piece loose at some mirror angles

   The 1 and the 0 are MEASURED, not reasoned. Connected components of the silhouette, counted by
   flood fill over the debug mask, sweeping the mirror phase across the whole range kalPhaseFor()
   can produce (and every segment count as well, for the one profile that reads it):

     profile   pieces unfolded   worst folded   phases worse than unfolded
     Chevron         2                2                 0 of 16
     Wave            1                1                 0 of 16
     Plate           1                1                 0 of 16
     Arc             1                2                 4 of 16
     Lattice         1                2                 8 of 40

   Arc's failure is not subtle and the count understates it: at phase 1.65 its end cap detaches and
   floats below the ring as a separate blob. Chevron reads 2 both ways because it IS two nested
   Vs -- unchanged, not broken. So Chevron, Wave and Plate get the single mirror; Arc and Lattice
   get no kaleidoscope, which is the honest answer for a shape the operation cannot survive.

   Reasoning alone had already got this wrong twice in this file, in both directions. */
/* NO LONGER DRIVES THE FOLD -- kalOrder() below takes the order from u_kalSeg instead. Kept
   because it is the record of which profile is symmetric under what, which the Segments row and
   the notes below still refer to. */
float foldOrder(float m){
  if(u_volOn>0.5 || u_svgOn>0.5) return 0.0;
  float n=clamp(floor(u_segN+0.5),2.0,8.0);
  if(m<1.5)      return n;                       // Tris, Clover
  else if(m<2.5) return 0.0;                     // Arc -- fragments, see the table
  else if(m<5.5) return 1.0;                     // Chevron, Wave, Plate -- one mirror, measured safe
  else if(m<6.5) return n;                       // Gear: C_2n contains C_n
  else if(m<7.5) return clamp(n,2.0,6.0);        // Knot, at its own clamp
  return 0.0;                                    // Lattice -- fragments
}
/* The order the FOLD may use, which is the order the whole evaluated field has. evalForm blends
   two modes whenever u_mix is live, and a blend of a C_3 and a C_5 form is neither -- so the two
   have to agree before anything may be folded. */
/* THE ORDER IS A SETTING NOW, NOT THE PROFILE'S OWN SYMMETRY. foldOrder() above ties N to what
   each profile happens to be symmetric under, because a wedge cut through a form that is not
   C_N slices its arms apart. The table is honest about the cost: Arc and Lattice return 0, so
   the kaleidoscope did NOTHING on them, and Chevron/Wave/Plate return 1 -- a single mirror line,
   which doubles the form into a bilaterally symmetric lump rather than making a rosette. That is
   the reported "too fat", and a symmetric lump turning on the spot is the reported lost motion.
   kalEval below removes the reason for the restriction: it samples an OFF-CENTRE region, so each
   of the N copies is a whole small form sitting in a ring rather than a wedge cut from the
   middle. Nothing gets sliced, so any profile folds at any order.
   Mesh stays excluded for a real reason -- its primary ray is a BVH traversal that never calls
   map(), so a fold here would move the shadows and not the surface. */
float kalOrder(){
  if(u_volOn>0.5) return 0.0;
  return clamp(floor(u_kalSeg+0.5),2.0,12.0);
}
/* THE DOMAIN FOLD. Polar, about Z, into a wedge of half-angle PI/N with the mirror plane at
   u_kalPh. One isometry on the sample point, so f(fold(p)) is exactly as Lipschitz as f, and the
   form is evaluated ONCE -- where the union costs two evaluations for as long as it is on. */
vec3 kalFold(vec3 p,float N){
  float w=PI/N;
  float a=atan(p.y,p.x)-u_kalPh;
  a-=2.0*w*floor((a+w)/(2.0*w));                 // wrap into [-w, w)
  a=abs(a)+u_kalPh;                              // mirror about the plane at u_kalPh
  float r=length(p.xy);
  p.xy=vec2(cos(a),sin(a))*r;
  return p;
}
/* THE RING, AND WHY IT ALSO HAS TO MOVE.
   Folding alone puts all N copies on top of each other at the centre. Offsetting the sampled
   region off the fold axis first is the actual kaleidoscope construction: the mirrors look at
   something beside the axis rather than through it.
   CORRECTION TO WHAT THIS COMMENT USED TO CLAIM. It said each copy was "a whole small form", and
   that is not what the geometry does. The wedge clips angularly, so what each copy shows is the
   slice of the form that fits inside a wedge of half-angle PI/N at radius f*REACH. At the shipped
   default (N=6, f=0.30) that wedge is 0.172 wide against a copy radius of 0.805 -- 21% of it.
   Every profile therefore came through as the same bland petal, which is why the shapes stopped
   looking like themselves once the kaleidoscope was on.
   The tension has no setting that resolves it: a wider wedge (low N) means fewer mirrors and less
   of a kaleidoscope, and a bigger offset shrinks the copy by exactly as much as it widens the
   view of it. Folding at f=0 is no better -- a 30 degree pie slice through a Gear lands between
   its teeth and mirrors a plain annulus, destroying the one feature that made it a gear.
   So the richness cannot come from which slice is chosen. It comes from the slice MOVING. A real
   kaleidoscope is not a fixed pattern being spun; it is a fixed set of mirrors with the source
   drifting past them, and the mandala reconfigures continuously as it goes -- petals grow, meet,
   merge and separate. u_kalPump breathes the sample radially and u_kalDrift sweeps it sideways
   across the mirror line, both on musical periods, and that sideways sweep is the one that makes
   the pattern reconfigure rather than merely turn. A C_N form turning about its own symmetry axis
   is invisibly turning; this is what gives it something to do instead.
   THE SILHOUETTE STILL DOES NOT GROW: the scale subtracts the pump's full amplitude as well as
   the offset, so f*REACH + pump + S*REACH <= REACH at every point in the cycle. Framing, the
   march bound and the studio floor all still hold, and f=0 with no drive collapses to the old
   fold exactly.
   Scaling an SDF needs the field scaled with the domain -- evalForm(q/S)*S -- or the distance is
   wrong by S and the march oversteps. */
float kalEval(vec3 p,float N){
  vec3 q=kalFold(p,N);
  float f=clamp(u_kalOff,0.0,0.85);
  /* The scale arrives precomputed. JS knows the pump and drift AMPLITUDES, so it can solve the
     worst-case reach once and send a constant; deriving it here from the live values would make
     the copies swell and shrink as the drive changed, which is a size pulse nobody asked for on
     top of the movement. Constant scale, moving sample point. */
  float S=clamp(u_kalScl,0.10,1.0);
  /* ALONG THE WEDGE'S OWN BISECTOR, not along x. kalFold leaves every point in the sector
     [u_kalPh, u_kalPh+w) -- the mirror phase turns that sector with the track. Offsetting along
     a fixed axis therefore pushes the sampled region SIDEWAYS out of the wedge whenever the
     phase is not near zero, and the form is simply never hit: the object vanished outright for
     u_kalOff >= 0.34 at the phase that happened to be live, and changed shape as the phase
     drifted. Along the bisector each copy is centred in its own wedge at every phase. */
  float w=PI/N, b=u_kalPh+w*0.5;

     and this file has said so for a while without acting on it: "a union's intersection curve is a
     CREASE: wherever the twin passes through the original there is a ridge, and because the profile
     is N-fold symmetric about the mirror axis those ridges radiate from the centre." Isolated at a
     frozen pose with the Director driving: kaleidoscope off, every seam gone and the surface clean

     and fattens the body, it does not remove it. The only fix is to stop crossing.

     fold uses it; where it has none the fold is ORDER 2 -- a single mirror line, kalFold at N=1,

// faceting on the imported mesh, and it is the same fault the SVG field had.
