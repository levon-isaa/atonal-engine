<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATONAL — AI Director Viewer</title>
<style>
  :root{--mono:ui-monospace,"SF Mono",Menlo,monospace;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050506;overflow:hidden;font-family:var(--mono);color:#e6e6e4}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #hud{position:fixed;top:18px;left:20px;z-index:10;font-size:11px;letter-spacing:.04em;line-height:1.7;
    text-shadow:0 1px 3px #000;pointer-events:none}
  #hud b{color:#fff} #hud .k{color:#8a8b91;text-transform:uppercase;font-size:9px;letter-spacing:.16em}
  #next{color:#b9a7ff}
  #bar{position:fixed;left:20px;right:20px;bottom:18px;z-index:10;display:flex;align-items:center;gap:14px}
  button,label.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:3px;
    color:#e6e6e4;padding:8px 14px;font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  button:hover,label.btn:hover{background:rgba(255,255,255,.12)}
  #tl{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:3px;position:relative;cursor:pointer}
  #tlF{position:absolute;left:0;top:0;bottom:0;background:#c8b8ff;border-radius:3px;width:0}
  #tlS{position:absolute;inset:0}
  #tlS i{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.25)}
  #tc{font-size:10px;color:#8a8b91;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
  #file,#svgfile{display:none}
  #bar .grp{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#5a5a5d}
  #bar button.on{background:rgba(200,184,255,.20);border-color:rgba(200,184,255,.48);color:#e8e0ff}
  #drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:9;pointer-events:none}
  #drop h2{margin:0;font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:#8a8b91}
  #drop p{margin:0;font-size:10px;letter-spacing:.16em;color:#5a5a5d;text-transform:uppercase}
  #stat{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:12;padding:8px 16px;
    background:rgba(14,14,17,.85);border:1px solid rgba(255,255,255,.12);border-radius:3px;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:#cfcfd4;display:none;backdrop-filter:blur(12px)}
  #statBar{display:none;width:190px;height:3px;background:rgba(255,255,255,.16);border-radius:2px;
    overflow:hidden;margin-left:4px}
  #statFill{display:block;height:100%;width:0%;background:currentColor;border-radius:2px;
    transition:width .18s linear}
  #statPct{display:none;min-width:34px;text-align:right;opacity:.65;font-variant-numeric:tabular-nums}
  #stat.busy #statBar,#stat.busy #statPct{display:block}
  .err{color:#ffb4b4!important}
  #ctrl{position:fixed;top:16px;right:18px;z-index:11;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  #ctrl .row{display:flex;align-items:center;gap:8px}
  #ctrl label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8a8b91}
  #ctrl select{background:rgba(14,14,17,.85);color:#e6e6e4;border:1px solid rgba(255,255,255,.18);border-radius:3px;
    padding:5px 8px;font:inherit;font-size:10px;letter-spacing:.06em;backdrop-filter:blur(12px)}
  #ctrl input[type=color]{width:26px;height:22px;padding:0;border:1px solid rgba(255,255,255,.22);border-radius:3px;
    background:transparent;cursor:pointer}
  #ctrl input[type=color]::-webkit-color-swatch-wrapper{padding:2px}

</div>

<script>
const SERVER = location.hostname && location.protocol.startsWith('http')
  ? location.origin.replace(/:\d+$/, ':8770') : 'http://127.0.0.1:8770';
const $=id=>document.getElementById(id);
window.__errs=[];
function __showErr(m){ let d=document.getElementById('__err'); if(!d){ d=document.createElement('div'); d.id='__err';
  d.style.cssText='position:fixed;left:12px;bottom:70px;z-index:999;max-width:64ch;padding:10px 12px;background:rgba(40,8,8,.94);border:1px solid #f66;border-radius:4px;color:#fbb;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap'; document.body.appendChild(d);} d.textContent=m; }
addEventListener('error',e=>{ const m=(e.error&&(e.error.stack||e.error.message))||e.message||'error'; window.__errs.push(String(m)); __showErr('JS ERROR:\n'+m); });
addEventListener('unhandledrejection',e=>{ const m=(e.reason&&(e.reason.stack||e.reason.message))||e.reason; window.__errs.push('promise: '+m); __showErr('PROMISE ERROR:\n'+m); });

/* ======================= WEBGL ======================= */
const glc=$('gl');
const gl=glc.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:false});
let floatOK=false;
if(gl){ floatOK=!!gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear'); }

const VERT=`#version 300 es
in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;

const SCENE=`#version 300 es
precision highp float;
out vec4 o;
uniform vec2 u_res; uniform float u_time;
uniform vec3 u_ro,u_rt,u_up,u_fw; uniform float u_fov;
uniform float u_spin;
uniform float u_wob,u_tilt,u_iridHue,u_mode,u_mode2,u_mix,u_reform;
uniform vec3 u_mood; uniform float u_energy,u_tension,u_arousal,u_darkness,u_env,u_pulse,u_flux,u_bgAmt;
uniform float u_metal,u_rough,u_reflect,u_iridAmt,u_transl,u_emis,u_trans;
uniform float u_spec,u_alb,u_absorb;
uniform float u_txScale,u_txAmp,u_txAniso,u_txRough;   // per-material surface texture
uniform float u_twoTone;                               // colourway separation across the form
uniform vec3 u_bgA,u_bgB; uniform float u_bgAuto,u_groundY,u_scene;
uniform float u_twA,u_twB,u_twMix;                  // ribbon twist cross-fade
// per-band sound reaction: hits (transient) + levels (sustained), one per frequency band
uniform float u_hSub,u_hLow,u_hMid,u_hHigh,u_hAir;
uniform float u_bLow,u_bHigh,u_bAir;
uniform float u_shock,u_shockA;
// emotion -> geometry: these drive the construction parameters of the forms
uniform float u_gTwist,u_gDense,u_gThick,u_gCut;
uniform sampler2D u_svg;            // R = signed distance, in object units, from the uploaded SVG
uniform float u_svgOn,u_svgDepth,u_svgBevel,u_svgPad;
uniform float u_valence,u_warmth,u_epic;
#define PI 3.14159265
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float h31(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
  float a=h31(i),b=h31(i+vec3(1,0,0)),c=h31(i+vec3(0,1,0)),d=h31(i+vec3(1,1,0));
  float e=h31(i+vec3(0,0,1)),g=h31(i+vec3(1,0,1)),hh=h31(i+vec3(0,1,1)),k=h31(i+vec3(1,1,1));
  return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(e,g,f.x),mix(hh,k,f.x),f.y),f.z);}
float sdBox(vec3 p,vec3 b){vec3 d=abs(p)-b;return length(max(d,0.))+min(max(d.x,max(d.y,d.z)),0.);}
float sdRBox(vec3 p,vec3 b,float r){vec3 d=abs(p)-b+r;return length(max(d,0.))+min(max(d.x,max(d.y,d.z)),0.)-r;}
float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float smax(float a,float b,float k){return -smin(-a,-b,k);}
float fbm(vec3 p){float v=0.,a=.5;for(int i=0;i<2;i++){v+=a*n3(p);p*=2.03;a*=.5;}return v;}
// TEXTURE NOISE — 5 octaves, normalised. A procedural material has no texel grid to raise, so
// its resolution IS its octave count: 2 octaves can only ever produce soft blobs at one scale.
// Five spanning ~32:1 in frequency give a surface that carries coarse variation, mid grain and
// fine tooth simultaneously, which is what reads as a real, high-resolution material. The
// offset per octave decorrelates them so the layers do not stack into visible lattice beats.
// SURFACE-DETAIL NOISE. Two things were tried here to deliver "higher resolution" texture and
// both were measured and reverted; the note is kept so they are not re-derived.
//
// 1. MORE OCTAVES (5 -> 7). Detail is amplitude x frequency, and this series has gain 0.42, so
//    octave 6 carries 0.42^5 and octave 7 carries 0.42^6 of the base — together about 4% of the
//    total amplitude for 40% more noise evaluations. Octave count is simply not the lever.
// 2. PROCEDURAL MIPMAPPING — fading each octave as its period approaches the pixel footprint,
//    via fwidth of the object-space position. Correct in principle, and it would matter for a
//    flat-gain series, but measured against a frozen frame it moved pixel-scale energy inside the
//    silhouette by 1.5-3.1% across four materials, with one material NEGATIVE. That is noise.
//    It has nothing to filter for the same reason as above: the octaves fine enough to alias are
//    the ones already carrying almost no amplitude.
//
// The lever that does work is the BASE frequency, tscale, which is per-material and was raised
// by roughly half. Detail lives in the first two or three octaves; everything past that is tooth.
float fbmT(vec3 p){
  float v=0., a=0.5, s=0.0;
  // GAIN MUST BE BELOW 1/LACUNARITY. This noise drives a NORMAL, so what matters is the
  // gradient, and octave k contributes gradient ~ (gain*lacunarity)^k. At gain 0.55 with
  // lacunarity 2.13 that is 1.17^k — RISING, so the finest octave dominated the normal and
  // every material read as sandblasted whatever the amplitude. At 0.42 it is 0.89^k: the
  // coarse form leads, and the fine octaves add tooth underneath it instead of burying it.
  for(int i=0;i<5;i++){ v+=a*n3(p); s+=a; p=p*2.13+17.3; a*=0.42; }
  return v/s;
}
/* ============ COMPLEX GEOMETRIC FORMS ============
   Hard-surface constructions: rounded and chamfered primitives combined with booleans,
   polar/grid arrays and smooth blends — the language of product design, not fractals.
   The emotion curves drive the CONSTRUCTION parameters (twist, density, thickness, cut). */
float ribbonAt(vec3 p,float twN){                                  // RIBBON — a wide band swept round the axis
  // Replaces the old turbine (a polar array of pitched blades + hub + ring). That form read as
  // machinery: hard repeated blades, a dead hub in the middle, and a torus that never belonged
  // to the rest of it. This is one continuous surface instead — a band swept around the axis
  // while rotating about its own centreline, so the silhouette changes completely as it turns
  // and the light runs along the twist. Glossy materials have somewhere to travel.
  float a=atan(p.z,p.x);
  float r=length(p.xz)-0.92;                           // signed distance to the sweep circle
  vec2 q=vec2(r,p.y);
  float tw=twN;
  // INTEGER twist count only. A half twist gives a true Mobius band but leaves a seam where
  // atan wraps at +/-pi, because the cross-section arrives back rotated by an odd multiple of
  // pi and no longer matches itself.
  q*=rot(a*tw + u_gTwist*0.9);
  vec2 half_=vec2(0.048+u_gThick*0.050, 0.26+u_gCut*0.09);
  vec2 d2=abs(q)-half_+0.042;
  float band=length(max(d2,0.0))+min(max(d2.x,d2.y),0.0)-0.042;
  // The angular twist stretches space, so the true distance is SHORTER than this estimate and
  // marching it unscaled overshoots — the band tears into chords, which is exactly what a fixed
  // 0.55 still did at 2+ twists. The distortion grows with the twist rate, so the safety factor
  // has to grow with it too rather than being a constant.
  return band/(1.0+tw*0.55);
}
// The twist count MUST be an integer or the cross-section fails to meet itself at the atan
// wrap. Driving it straight off energy therefore made it snap 2->3->4 mid-track and the whole
// form re-shaped in a single frame — that is the 'changes very strange' problem. It is now
// latched, changed only at section boundaries, and cross-faded between the two counts exactly
// like a mode morph, so the change reads as a transformation instead of a pop.
float mArray(vec3 p){
  float d=ribbonAt(p,u_twA);
  if(u_twMix>0.001) d=mix(d,ribbonAt(p,u_twB),u_twMix);
  return d;
}
float mStack(vec3 p){                                  // TOWER — stacked slabs, progressive twist
  const float N=8.0; float H=2.00/N;
  float fi=floor((p.y+1.00)/H);
  float d=1e9;
  for(int j=-1;j<=1;j++){                              // nearest 3 slabs -> valid distance
    float i=clamp(fi+float(j),0.0,N-1.0);
    float cy=-1.00+(i+0.5)*H;
    vec3 q=vec3(p.x,p.y-cy,p.z);
    q.xz*=rot(i*(0.28+u_gTwist*0.30));
    float t=abs(i-(N-1.0)*0.5)/(N*0.5);
    float w=0.66-0.26*t*t;
    d=min(d,sdRBox(q,vec3(w,H*0.34,w*0.52),0.07));
  }
  return d;
}
float mRings(vec3 p){                                  // GYROSCOPE — nested orthogonal rings
  float th=0.055+u_gThick*0.05;
  float d=sdTorus(p,vec2(0.92,th));
  vec3 q1=p; q1.yz*=rot(1.5707963);
  d=min(d,sdTorus(q1,vec2(0.74,th*0.92)));
  vec3 q2=p; q2.xy*=rot(1.5707963); q2.yz*=rot(u_gTwist*0.5);
  d=min(d,sdTorus(q2,vec2(0.56,th*0.85)));
  return smin(d,sdRBox(p,vec3(0.17),0.13),0.10);
}
float mTruss(vec3 p){                                  // SPACE FRAME — beam lattice in a shell
  float c=0.62-u_gDense*0.16;                          // cell size: denser when energetic
  vec3 q=mod(p+c*0.5,c)-c*0.5;
  float r=0.040+u_gThick*0.030;
  float beams=min(length(q.yz)-r,min(length(q.xz)-r,length(q.xy)-r));
  float node =length(q)-r*1.9;
  float lat=min(beams,node);
  float shell=sdRBox(p,vec3(0.80),0.24);
  return smax(lat,shell,0.03);                         // bound to a rounded cube
}
float mPods(vec3 p){                                   // PODS — tapered capsules off a core
  float d=1e9;
  for(int i=0;i<6;i++){
    float fi=float(i), a=fi*1.0471976;
    vec3 dir=normalize(vec3(cos(a),sin(fi*0.9+u_gTwist)*0.62,sin(a)));
    float h=clamp(dot(p,dir),0.0,0.80);
    d=smin(d,length(p-dir*h)-(0.215-0.085*(h/0.80)),0.13);
  }
  return smin(d,length(p)-0.31,0.15);
}
float mAperture(vec3 p){                               // SHELL — chamfered pod, bored through
  float outer=smax(sdRBox(p,vec3(0.66),0.24),length(p)-0.90,0.06);
  float inner=smax(sdRBox(p,vec3(0.66-0.10-u_gThick*0.06),0.22),length(p)-(0.80-u_gThick*0.05),0.06);
  float shell=smax(outer,-inner,0.03);
  float rad=0.20+u_gCut*0.16;                          // aperture radius
  float bore=min(length(p.yz)-rad,min(length(p.xz)-rad,length(p.xy)-rad));
  return smax(shell,-bore,0.035);
}
/* ---- CUSTOM SVG ----
   The uploaded artwork arrives as a 2D signed distance field baked into a texture, so the
   raymarcher can treat it like any other primitive: sample the plane distance, then extrude.
   A texture rather than analytic paths because an SDF march evaluates the field millions of
   times per frame — walking a path list per sample would be thousands of times slower, and the
   field only has to be built once per upload.
   Outside the texture the sample is meaningless (clamped edge), so the distance there is
   reconstructed from the border padding plus how far the point lies beyond the edge. Without
   that the field flattens off past the border and the march walks straight through it. */
float mSVG(vec3 p){
  vec2 q=p.xy;
  vec2 uv=q*0.5+0.5;
  vec2 cl=clamp(uv,0.0,1.0);
  float d2=texture(u_svg,cl).r;
  // add the planar distance from the clamped point back to the real one
  d2+=length((uv-cl)*2.0);
  float dz=abs(p.z)-u_svgDepth;
  float b=u_svgBevel;
  d2+=b; dz+=b;                       // inflate, then deflate by b -> a rounded edge
  vec2 w=vec2(d2,dz);
  return min(max(d2,dz),0.0)+length(max(w,0.0))-b;
}
float evalMode(vec3 p,float m){
  if(u_svgOn>0.5) return mSVG(p);   // an uploaded shape replaces the generated set entirely
  if(m<0.5)       return mArray(p);
  else if(m<1.5)  return mStack(p);
  else if(m<2.5)  return mRings(p);
  else if(m<3.5)  return mTruss(p);
  else if(m<4.5)  return mPods(p);
  else            return mAperture(p);
}
vec2 map(vec3 wp){
  vec3 p=wp;
  // CLEAN AXIS SPIN. u_spin used to drive TWO planes at once — xz plus xy at 0.22 — which is a
  // tumble, not a spin: the axis itself precesses, so the form never repeats a pose and the eye
  // cannot lock onto the rotation. One plane only. u_tilt stays as a fixed lean on the axis, so
  // the form is seen at a three-quarter angle rather than dead side-on, but the lean is static
  // and the spin is a clean turn about it.
  p.yz*=rot(u_tilt); p.xz*=rot(u_spin);
  // 0.95 = global framing scale: keeps the whole silhouette inside frame at the closest camera
  // bass hits punch the whole form; sub adds the deep swell
  float s=max(u_reform,0.2)*(1.0+u_energy*0.10+u_pulse*0.10+u_hLow*0.13+u_hSub*0.09)*0.95;
  p/=s;
  // bounding sphere: every form lives inside r=1.3, so empty space is skipped without
  // ever touching a fractal estimator. This is what keeps the heavy modes affordable.
  //
  // The threshold used to be 0.10, and that was the source of the floor's contour rings. This
  // branch returns the distance to a sphere of radius 1.45 while the branch below returns the
  // distance to the actual form, and at the switch those disagree by the gap between the two —
  // roughly 0.45. A raymarch tolerates it because the value is still a conservative lower bound,
  // so it only costs a few extra steps. But anything that reads the field's VALUE rather than
  // marching on it sees a cliff, and the soft shadow's min(k*h/t) reads the value: samples
  // crossing this shell took a sudden dip, and since the crossing radius sweeps smoothly with the
  // shaded point, the dip swept with it. Concentric rings, printed on the floor, exactly tracking
  // the bounding sphere. Proven by forcing the true field everywhere, which removed every ring.
  //
  // The gap does not shrink with distance, but its VISIBILITY does: the spurious darkening is
  // 7*br*s/t, so pushing the switch out to 0.85 means no shaded point within ~6 units of the shell
  // can be darkened by it at all. Everything past radius 2.3 still skips the estimator, which is
  // where nearly all of the empty space the early-out exists to skip actually lives.
  //
  // Gated on the scene, because widening the shell is not free — it makes the camera march
  // evaluate the real estimator across a thicker band, measured at roughly a fifth of the render
  // scale. Only the studio floor can display the rings (it is the only surface that reads the
  // field's value at a distance); the colour field has no floor, so it keeps the tight shell and
  // spends that budget on resolution instead.
  float br=length(p)-1.45;
  float dObj;
  if(br>mix(0.10,0.85,u_scene)) dObj=br*s*0.5;
  else{
  float d=evalMode(p,u_mode);
  // SMOOTHERSTEP (6t^5-15t^4+10t^3) rather than smoothstep. smoothstep has zero first derivative
  // at the ends but a discontinuous SECOND derivative, so the melt visibly jerks into and out of
  // motion — on a shape change, that snap at each end is most of what reads as abrupt.
  // Smootherstep is C2, so the morph eases in and out with no kick.
  if(u_mix>0.001){ float m=clamp(u_mix,0.,1.); m=m*m*m*(m*(m*6.0-15.0)+10.0);
    d=mix(d, evalMode(p,u_mode2), m); }

  // surface chatter. Amplitude is divided back down by the frequency: displacement gradient
  // (freq * amp) must stay bounded or the field stops being a valid SDF and the march creases.
  // lighter than before: these forms carry their own detail, so the noise only breathes
  float nf=2.0+u_bHigh*1.6+u_hHigh*1.2;                       // 2.0 .. 4.8
  float na=u_energy*0.030+u_pulse*0.030+u_flux*0.014+u_wob*0.010+u_hHigh*0.012+u_hAir*0.009;
  // The time term CRAWLS the noise through the form. At 0.15 (and 0.5 on air hits) the surface
  // was boiling — detail sliding across geometry that is itself turning, which is most of what
  // read as jiggle even after the rotation was cleaned up. Slowed hard so the detail rides WITH
  // the form and the eye tracks the spin instead of the churn.
  d+=(fbm(p*nf+u_time*(0.030+u_hAir*0.09))-0.5)*na*(2.0/nf);
  dObj=d*s*0.5;
  }
  return vec2(dObj,1.0);
}
/* ---- MATERIAL TEXTURE ----
   Surface detail in OBJECT space (same transform map() applies) so it sticks to the form
   as it turns instead of sliding through it. Two channels do most of the work: a micro
   normal that breaks up the specular, and a roughness field that stops every highlight
   reading as one flat plastic sheen. u_txAniso stretches the noise for brushed metal. */
vec3 objP(vec3 p){
  // CLEAN AXIS SPIN. u_spin used to drive TWO planes at once — xz plus xy at 0.22 — which is a
  // tumble, not a spin: the axis itself precesses, so the form never repeats a pose and the eye
  // cannot lock onto the rotation. One plane only. u_tilt stays as a fixed lean on the axis, so
  // the form is seen at a three-quarter angle rather than dead side-on, but the lean is static
  // and the spin is a clean turn about it.
  p.yz*=rot(u_tilt); p.xz*=rot(u_spin);
  return p;
}
vec3 texNormal(vec3 op,vec3 n){
  if(u_txAmp<0.0005) return n;
  vec3 sc=vec3(u_txScale,u_txScale*u_txAniso,u_txScale);
  // e has to resolve the FINEST octave, not the base one. fbmT stacks 5 octaves at lacunarity
  // 2.13, so the top octave's period here is 1/2.13^4 = 0.049. At e=0.10 the difference straddled
  // TWO full periods of it, so the fine octaves returned an essentially random value per pixel
  // rather than a derivative — and because that error does not shrink with frequency the way a
  // real derivative does, the finest octaves ended up dominating the normal. That is the uniform
  // sandpaper stipple, and it is why the gain-0.42 rolloff (chosen so the coarse form leads)
  // never actually showed. 0.012 is a quarter of the top octave's period.
  float e=0.012;
  float f0=fbmT(op*sc);
  vec3 g=vec3(fbmT(op*sc+vec3(e,0,0))-f0, fbmT(op*sc+vec3(0,e,0))-f0, fbmT(op*sc+vec3(0,0,e))-f0);
  g-=n*dot(g,n);                                  // tangential only -> a bump, not a dent
  float gl=length(g); if(gl<1e-5) return n;
  // use the gradient DIRECTION and let u_txAmp be the tilt in radians. Scaling by the raw
  // gradient magnitude instead swamps the surface normal and the material reads as grime.
  // 6.0 -> 2.4 because the epsilon fix above changed what this gradient IS. The old direction was
  // dominated by per-pixel noise, so neighbouring pixels tilted incoherently and largely
  // cancelled; the corrected one is spatially coherent, and a coherent tilt of the same angle
  // shades far more strongly. Every per-material tamp was calibrated against the broken version,
  // so the compensation goes HERE, once, rather than into five material constants — that keeps
  // the relative weighting between materials exactly as it was tuned.
  return normalize(n-(g/gl)*u_txAmp*2.4);
}
float texRough(vec3 op,float base){
  if(u_txRough<0.001) return base;
  float v=fbmT(op*vec3(u_txScale,u_txScale*u_txAniso,u_txScale)*0.42);
  return clamp(mix(base, base*(0.45+1.5*v), u_txRough), 0.02, 1.0);
}
vec3 calcN(vec3 p){vec2 e=vec2(1.,-1.)*0.0018;
  return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);}
// map() returns a 0.5-scaled (deliberately conservative) field — undo that for ratio-based lighting
float mapD(vec3 p){ return map(p).x*2.0; }
// ambient occlusion — crevices darken, gives the form real volume (4 extra taps)
float calcAO(vec3 p,vec3 n){ float s=0.,w=1.;
  for(int i=1;i<=4;i++){ float h=0.04*float(i)*float(i);
    s+=(h-mapD(p+n*h))*w; w*=0.65; }
  return clamp(1.0-1.6*s,0.,1.); }
// short-range soft shadow — self-shadowing is what separates 'rendered' from 'flat'
// Soft shadow. The old version capped each step at 0.18 over 20 iterations, so it could only
// reach t=3.6 — floor points further from the form ran OUT OF ITERATIONS at a distance that
// varied with the field, and whatever partial r they had accumulated became the shadow. Since
// the stopping point swept smoothly with radius, the error did too: concentric rings around the
// camera's nadir, which is exactly what the floor was showing.
// Fixed by terminating for a GEOMETRIC reason instead of an iteration count — every form lives
// inside the bounding sphere, so once the ray is outside it and travelling outward nothing can
// ever occlude it and the point is fully lit. Steps can also be much longer now that escaping
// is cheap.
// SOFT SHADOW — rewritten around the actual cause of the floor's terraced contour rings.
//
// The penumbra estimate is min(k*h/t) accumulated along the light ray, and A MIN OVER SPARSE
// SAMPLES IS DISCONTINUOUS IN THE SHADED POINT. A sphere trace crossing open floor takes steps of
// a unit or more, so which sample lands nearest the form jumps as the floor point slides, and the
// running minimum jumps with it. Measured by disabling that one line: every contour vanished and a
// clean hard silhouette remained, so the march and the field were never at fault. Two earlier
// attempts to keep sphere tracing and repair the estimate analytically (closest approach between
// samples, from the previous distance and then from the step taken) both failed — they make the
// sampled value smoother but do nothing about the sample POSITIONS, which is where the jump is.
//
// So: don't sphere trace. Every form lives inside r=2.3, so
//   1. intersect the light ray with that sphere analytically. No hit ahead means nothing can
//      occlude and the point is lit — the whole open floor now returns without a single field
//      evaluation, where before it paid for a full march to discover the same thing.
//   2. inside the sphere only, step a FIXED 0.09. Sample positions then move continuously with
//      the shaded point, so the running minimum does too, and the chord is short enough to bound
//      the cost. Fixed steps cannot skip the surface here because the step is far below the
//      penumbra scale this is trying to resolve.
float calcSha(vec3 p,vec3 l){
  const float R=2.6;
  float b=dot(p,l), c=dot(p,p)-R*R, disc=b*b-c;
  if(disc<0.0) return 1.0;                       // ray misses the bounding sphere: lit
  float sq=sqrt(disc), t1=-b+sq;
  if(t1<=0.05) return 1.0;                       // sphere is behind the shaded point: lit
  float t0=max(-b-sq, 0.05), r=1.0;
  // A FIXED COUNT across the chord, not a fixed step. With a fixed step the sample count changes
  // by one as the chord grows, and the sample that pops in or out at the far end takes the running
  // minimum with it — the faint rings that survived every fix above. Distributing a constant number
  // of samples over [t0,t1] makes every sample position a continuous function of the shaded point
  // and never adds or removes one, so nothing can pop. It also spends the samples where they are
  // needed: a grazing ray gets a fine step, a chord straight through the form gets a coarse one.
  const int N=40;
  float ds=(t1-t0)/float(N);
  for(int i=0;i<N;i++){
    float t=t0+(float(i)+0.5)*ds;
    float h=mapD(p+l*t);
    if(h<0.0015) return 0.0;
    r=min(r, 7.0*h/t); }
  // The sphere test is itself a hard cutoff, and a hard cutoff is a discontinuity: a ray grazing
  // the sphere takes one sample at h ~ R minus the form's radius, and 7h/t drops below 1 for any
  // shaded point far enough away, so the boundary printed a single crisp arc across the floor.
  // Window the result by the chord actually traversed — at tangency the chord is zero and this
  // returns exactly the unoccluded 1.0 that the outside branch returns, so the two agree.
  float w=smoothstep(0.0,0.8,t1-t0);
  return mix(1.0, clamp(smoothstep(0.,1.,r),0.,1.), w); }
// A rectangular SOFTBOX projected into direction space. Real studio renders read as
// "high class" because glossy surfaces reflect structured light sources with clean edges —
// a single analytic sun gives a chrome ball nothing to show.
float softbox(vec3 d, vec3 n, vec2 sz, float soft){
  float dn=dot(d,n); if(dn<=0.001) return 0.0;
  vec3 up=abs(n.y)<0.95?vec3(0,1,0):vec3(1,0,0);
  vec3 u=normalize(cross(n,up)), v=cross(n,u);
  vec2 q=vec2(dot(d,u),dot(d,v))/dn;                 // project onto the box plane
  vec2 e=abs(q)-sz;
  return smoothstep(soft,-soft,max(e.x,e.y));
}
// three-point studio: key + cool fill + hot rim, over a soft gradient with a floor bounce.
// roughness widens every source, which is what makes rough materials read as rough.
// (NB: never use backticks in here — this GLSL lives inside a JS template literal.)
vec3 env(vec3 d,float rough){
  float sf=0.05+rough*0.45;
  // A BRIGHT room, not a dark one with lamps in it. This is the difference between a
  // product shot and a night render: nothing on the object ever falls to black, because
  // every direction still returns real light.
  vec3 e=mix(vec3(0.185,0.200,0.235), vec3(0.480,0.505,0.560), smoothstep(-0.35,0.85,d.y));
  e=mix(e, vec3(0.230,0.220,0.210), smoothstep(0.05,-0.55,d.y));                    // floor bounce
  e+=vec3(1.00,0.96,0.90)*softbox(d,normalize(vec3(-0.40,0.78,0.48)),vec2(0.52,0.30),sf)*6.5;
  e+=vec3(0.55,0.68,1.00)*softbox(d,normalize(vec3( 0.88,0.12,0.30)),vec2(0.80,0.55),sf+0.12)*1.3;
  e+=vec3(1.00,0.88,0.74)*softbox(d,normalize(vec3( 0.22,0.32,-0.92)),vec2(0.20,0.14),sf*0.7+0.03)*9.0;
  e+=vec3(0.90,0.94,1.00)*softbox(d,normalize(vec3( 0.05,1.00,-0.10)),vec2(0.62,0.10),sf+0.05)*2.2;
  // ---- ROOM STRUCTURE ----
  // Four softboxes over a gradient give a mirror nothing but smooth blobs, which is why the
  // metals still read closer to plastic than to chrome however correct the BRDF is: a polished
  // surface shows you the room, and this room had no edges in it. These are the two features a
  // real studio always has, and both are what the eye uses to read a surface as reflective.
  // Everything here widens with sf (roughness), so a matte material never shows a hard edge.
  //
  // 1. The horizon — the wall/floor join. A near-mirror picks this up as its defining waterline,
  //    the dark-over-light split you see across every chrome product shot.
  float hz=smoothstep(-0.03-sf*0.9, 0.03+sf*0.9, d.y);
  e=mix(e*0.62, e, hz);
  // 2. A bank of vertical panels with gaps between them. On a curved surface these stretch into
  //    long streaks that track the curvature, which is the cue that says "polished" — a blob
  //    just says "bright". Six panels around the azimuth.
  float az=atan(d.z,d.x);
  float cell=abs(fract(az*(6.0/6.28318530)+0.5)-0.5)*2.0;
  float strip=smoothstep(0.62+sf*1.3, 0.30-sf*0.4, cell);
  e+=vec3(0.96,0.97,1.00)*strip*smoothstep(-0.15,0.62,d.y)*0.42;
  return e*u_env*mix(vec3(0.86,0.93,1.12), vec3(1.12,0.98,0.82), u_warmth);
}
// Four-stop colour ramp with overlapping smoothstep bands. The overlap matters: butted-up
// segments put a visible crease at each stop, and on a field this smooth a crease reads as a
// contour line rather than as a gradient.
vec3 ramp4(vec3 c0,vec3 c1,vec3 c2,vec3 c3,float t){
  t=clamp(t,0.,1.);
  vec3 c=mix(c0,c1,smoothstep(0.00,0.40,t));
  c=mix(c,c2,smoothstep(0.28,0.74,t));
  c=mix(c,c3,smoothstep(0.62,1.00,t));
  return c;
}
void palAB(out vec3 A,out vec3 B){
  A=u_bgA; B=u_bgB;
  if(u_bgAuto>0.5){ vec3 m=u_mood; vec3 s=m/max(max(m.r,max(m.g,m.b)),1e-3);
    s=clamp(mix(vec3(dot(s,vec3(.3333))),s,2.2),0.,1.);
    B=s; A=clamp(s.gbr,0.,1.)*0.16; }
}
// SEAMLESS STUDIO BACKDROP — a lit cyclorama, not a painted picture. The floor below fades
// into this at distance, which is what makes the space read as one continuous room.
vec3 bg(vec3 rd, vec2 sv){
  vec3 A,B; palAB(A,B);
  float h=clamp(rd.y*0.5+0.5,0.,1.);
  // STUDIO: a lit cyclorama the form sits IN. Returns before any fbm, so the fluid field costs
  // nothing when it is not on screen.
  if(u_scene>0.5){
    vec3 lo=mix(vec3(0.93),B,0.10);                        // bright toward the horizon
    vec3 hi=mix(vec3(0.58),B,0.20);                        // deeper up top
    vec3 c=mix(lo,hi,smoothstep(0.42,1.0,h));
    c*=mix(1.0,0.72,smoothstep(0.20,1.05,length(sv)));     // soft falloff into the corners
    return c*(0.85+u_bgAmt*0.25);
  }
  // ---- FLUID: two rounds of domain warping. Warping the noise's INPUT by more noise is what
  // turns a static cloud into something that folds and shears like ink in water; a single fbm
  // only ever pulses in place. Drift speed rides arousal, so the field is calm under an intro
  // and genuinely churning through a drop -- but it is always slow in absolute terms, because
  // this sits behind the subject and must never compete with it.
  // ONE warp round, not two. bg() runs for every pixel in the frame (the aerial fade needs it
  // even where the form is hit), so each fbm here costs a full-screen pass — two rounds drove
  // rscale to its floor and cost more resolution than the extra detail was worth. A single warp
  // with a stronger coefficient folds the field convincingly at 3 fbm calls instead of 5.
  // The field turns WITH the form (u_spin) and its feature size tracks the form's scale, so the
  // backdrop belongs to the subject instead of being a texture the subject happens to sit on.
  vec2 uv=sv*1.25*(1.0+u_energy*0.12); uv*=rot(u_spin*0.16+u_tilt*0.25);
  // the beat breathes the flow forward — motion on the downbeat, not just colour
  float tt=u_time*(0.020+u_arousal*0.055)+u_pulse*0.045+u_bLow*0.03;
  vec2 w1=vec2(fbm(vec3(uv*1.20, tt)), fbm(vec3(uv*1.20+11.7, tt)));
  float f=fbm(vec3(uv*1.60+w1*2.6, tt*0.75));
  // RIDGED fold. Reflecting the field about its midpoint (1-|2f-1|) turns smooth blobs into thin
  // bright filaments — the striations you get when two liquids are stirred but not mixed. Real
  // fluid reads as sheets and threads, not clouds, and this is the cheapest way to get them: it
  // is a fold of a sample already taken, so it costs no extra fbm.
  float ridge=1.0-abs(2.0*clamp(f,0.,1.)-1.0);
  ridge*=ridge;                                          // sharpen the threads
  // shear the filaments along the warp so they stretch the way advected ink does rather than
  // sitting isotropic
  float fil=ridge*(0.55+0.45*clamp(w1.y*1.6,0.,1.));
  f=clamp(f*1.8+0.14,0.,1.);
  // ---- EMOTION COLOUR. A two-stop lerp can only express ONE hue axis, which is why this still
  // read as a flat tint however hard the fluid churned. Four stops let the field travel
  // deep -> cool -> accent -> hot, so one frame carries several hues at once and the boundaries
  // between them become the gradients. Every stop is derived from the section palette, so the
  // backdrop still agrees with the duotone inks.
  vec3 c0=mix(A*0.60, vec3(0.05,0.05,0.11), u_darkness*0.55);           // deep shadow
  vec3 c1=mix(mix(vec3(0.16,0.32,0.74),vec3(0.44,0.16,0.64),u_tension), A, 0.42);
  vec3 c2=B;                                                            // palette accent
  vec3 c3=mix(vec3(1.00,0.74,0.42), mix(B,vec3(1.0),0.42), 0.55);       // hot highlight
  // A LARGE-SCALE sweep underneath the fluid detail, so the frame reads as one big movement of
  // colour with turbulence inside it rather than as uniform noise. w1 is REUSED here — this
  // costs no extra fbm, it just spends samples already taken on a second job.
  float g=clamp(0.5+0.62*(sv.x*0.55+sv.y*0.62)+(w1.x-0.5)*0.85, 0., 1.);
  // valence slides the whole field along the ramp: a dark track sits at the deep/cool end, a
  // bright one pushes up into accent and highlight
  // the filaments ride the ramp too, so a thread reads as a DIFFERENT colour rather than just a
  // brighter patch of the same one — that hue separation is what makes it look like two fluids
  float rt=clamp(f*0.62+g*0.40+fil*0.30+(u_valence-0.5)*0.34+u_epic*0.10, 0., 1.);
  vec3 ink=ramp4(c0,c1,c2,c3,rt);
  // The sweep used to be ~86% white — a product-shot cyclorama. That white was the real ceiling
  // on colour here: whatever the ramp produced could only ever tint it pale. Pulled down so the
  // backdrop is a colourway in its own right and the ramp reads as colour rather than as a wash.
  // With the ground plane gone the background IS the whole frame, so the sweep can no longer
  // hedge toward white to stay a product-shot cyclorama — there is nothing left for the form to
  // sit on, and a near-white lower half just reads as empty. Both ends pulled deep into the
  // colourway.
  vec3 lo=mix(vec3(0.72), B, 0.56+u_tension*0.24);         // toward the horizon
  vec3 hi=mix(vec3(0.30), B, 0.62+u_tension*0.26);         // deeper up top
  vec3 col=mix(lo,hi,smoothstep(0.48,1.0,h));
  // the fluid rides ON the sweep rather than replacing it: a studio backdrop that MOVES, not a
  // noise texture pasted behind the subject. Weighted to stay legible at IDLE too — at the flat
  // default curves (arousal .3, tension .2) the emotion terms contribute almost nothing, so a
  // mix driven purely by them reads as no effect at all until a track is actually playing.
  col=mix(col, ink, (0.70+u_tension*0.24+u_epic*0.16)*(0.50+0.50*f));
  // AURA — a pool of the section's own mood sitting directly behind the subject, breathing on
  // the low band. This is the piece that makes the backdrop read as belonging to the FORM: it
  // is anchored to where the form actually is on screen, not to the frame, and it carries the
  // same colour the material is picking up from u_mood.
  float aur=exp(-dot(sv,sv)*(2.6-u_bLow*1.0-u_energy*0.5));
  col=mix(col, mix(ink,u_mood,0.55), aur*(0.20+u_bLow*0.20+u_pulse*0.14));
  // air band lifts a fine sheen across the whole field — hats/shimmer read in the backdrop too
  col+=vec3(0.9,0.95,1.0)*f*u_bAir*0.05;
  col*=mix(1.0,0.76,smoothstep(0.20,1.05,length(sv)));     // soft falloff into the corners
  col*=1.0-u_darkness*0.22;
  // VIBRANCE — pushes chroma while holding luminance, so the field gets its intensity from
  // colour rather than from being blown brighter. Raising exposure instead would just wash the
  // whole frame toward white, which is the thing this is meant to get away from.
  float lm=dot(col,vec3(0.2126,0.7152,0.0722));
  col=max(mix(vec3(lm), col, 1.42), vec3(0.0));
  return col*(0.80+u_bgAmt*0.30);
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*u_res)/u_res.y;
  float f=0.5/tan(u_fov*0.5);        // uv.y spans +/-0.5, so the 0.5 is required or the FOV halves
  vec3 rd=normalize(uv.x*u_rt+uv.y*u_up+f*u_fw), ro=u_ro;
  float dth=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453);
  float t=0.02+dth*0.012,mid=-1.;                 // dithered start kills stair-step banding

    if(h.x<0.0015*t){mid=h.y;break;}

    // surface the 0.62 factor guards the displaced field; out in empty space (where h.x is
    // large and the value comes straight off the bounding sphere) that is doubly conservative
    // and burns steps crossing nothing. 1.35*h.x is still only ~0.68 of the true distance.
    t+=h.x*(h.x>0.20 ? 1.35 : 0.62);

  // the forms float clear of it, so what landed was a soft grey pool with a horizon behind it,
  // and every attempt to fix the shadow only moved the artefact around. Without a shadow the
  // plane is just an arbitrary horizon line dividing the frame, so it goes too and the form now
  // floats in the colour field. This also drops a shadow march for every floor pixel, which was
  // the most expensive thing in the lower half of the frame.
  // STUDIO FLOOR, intersected analytically. Marching an infinite plane makes grazing rays
  // converge too slowly, so they hit the step cap at varying distances and the floor bands into
  // rings — a plane has a closed form, so use it. The plane sits just under the form (JS derives
  // u_groundY from the same reach the framing uses), which is what makes the contact shadow
  // actually land instead of spreading into the grey pool this replaced.
  if(u_scene>0.5){
    float tp=(rd.y<-1e-4)?(u_groundY-ro.y)/rd.y:-1.0;
    if(tp>0.02 && (mid<0.0 || tp<t)){ t=tp; mid=2.0; }
  }

  vec3 back=bg(rd,uv);       // miss + aerial fade

  if(mid<0.){
    col=back;

    // the colour field there is no floor for it to belong to: the result was a large dark pool
    // across the bottom of the frame, reading as a second object rather than as a shadow. It also
    // banded — a wide, smooth radial falloff laid over a near-flat backdrop quantises into
    // concentric contour rings in 8-bit, which no amount of tuning the falloff removes. This is
    // the same failure the ground plane above was deleted for. The form floats in the field; the
    // Studio scene still has a real floor and a real cast shadow, where one actually belongs.
  }
  else if(mid>1.5){                                  // ---- STUDIO FLOOR ----
    vec3 p=ro+rd*t, gn=vec3(0,1,0);
    vec3 A,B; palAB(A,B);
    vec3 alb=mix(vec3(0.82),B,0.10);
    vec3 L=normalize(mix(vec3(-.40,.80,.40), vec3(.58,.28,.74), u_tension*0.65));
    vec3 keyC=mix(vec3(0.72,0.82,1.00), vec3(1.00,0.86,0.66), u_warmth);
    float sha=calcSha(p,L);                          // cast shadow
    float occ=calcAO(p,gn);                          // contact darkening
    vec3 amb=env(gn,1.0)*0.95;
    // Contact shadow has to be DARK right under the form or it reads as a grey smudge. Both
    // terms are driven near zero in full occlusion, and AO is sharpened so the darkest part sits
    // tight against the silhouette instead of spreading.
    float ao2=occ*occ;
    col=alb*( keyC*(0.55*max(0.,dot(gn,L)))*mix(0.02,1.0,sha) + amb*mix(0.04,1.0,ao2) );
  }
  else{
    vec3 p=ro+rd*t, gn=calcN(p), v=-rd;
    vec3 op=objP(p);
    vec3 n=texNormal(op,gn);                       // textured shading normal
    float rgh=texRough(op,u_rough);                // spatially varying roughness
    // GEOMETRIC SPECULAR AA. A narrow GGX lobe over a high-frequency normal map aliases into
    // crawling white sparkle along every silhouette — one pixel catches the lobe, its neighbour
    // misses it entirely. Widen roughness by how fast the shading normal turns across this
    // pixel (Toksvig-style): sub-pixel normal variance is mathematically the same thing as
    // extra microfacet spread, so folding it into roughness removes the sparkle without
    // softening surfaces that are genuinely flat. Chrome (rough 0.06) is unusable without it.
    vec3 dnx=dFdx(n), dny=dFdy(n);
    // Cap left at 0.030. Raising it to 0.075 to absorb the richer 5-octave normal measured
    // WORSE, not better — but the metric (frame-to-frame pixel change) cannot separate genuine
    // shimmer from sharp reflections legitimately sweeping across a rotating chrome surface, so
    // it could not justify the change either way. Keeping the value that was tuned by eye.
    float kvar=min(0.030, 0.5*(dot(dnx,dnx)+dot(dny,dny)));
    rgh=min(1.0, sqrt(rgh*rgh+kvar));
    float NoV=clamp(dot(n,v),1e-4,1.);
    float fr=pow(1.-NoV,2.6);
    // albedo carries the same grain, so the body is not one flat colour
    float av=fbmT(op*u_txScale*0.30);
    // TWO-TONE. A single u_mood makes the whole form one hue, which is why a frame reads
    // flatter than the reference — those get their life from several colourways at once.
    // Sweep in OBJECT space (so the split belongs to the form and turns with it) between the
    // section's mood and the palette accent, with the surface grain breaking up the boundary
    // so it reads as material rather than a gradient laid over the top.
    vec3 pA,pB; palAB(pA,pB);
    float sweep=clamp(0.5+0.70*(op.y*0.85+op.x*0.30)+(av-0.5)*0.55, 0., 1.);
    vec3 tint=mix(u_mood, clamp(pB*1.12,0.,1.), smoothstep(0.18,0.82,sweep)*u_twoTone);
    // u_alb is a per-material albedo scale. The shared 0.9 base is right for pearl and frosted,
    // which are near-white by nature, but it left clay blowing out to paper white across every lit
    // face — measured at 1.66% of the upper frame above 225/255, of which only a fifth came from
    // the surface texture; the rest was simply a very bright diffuse clipping. Real clay is a
    // mid-tone, and dropping the albedo is what makes it read as clay rather than lit plaster.
    vec3 base=mix(vec3(0.9), tint, 0.68)*u_alb*(1.0+(av-0.5)*u_txRough*0.16);
    vec3 f0=mix(vec3(0.04), base, u_metal);
    // thin-film colour, shifted by the micro surface so it mottles like real pearl
    vec3 irid=0.5+0.5*cos(6.2831*(fr*1.7+n.y*0.5+av*0.7+u_time*0.03+u_iridHue+u_hAir*0.25)
                          + vec3(0.,2.1,4.2));
    // EMOTIONAL LIGHT: tension swings the key round to a harder angle, warmth tints it,
    // valence colours the rim. The scene is lit by how the music feels.
    vec3 L=normalize(mix(vec3(-.40,.80,.40), vec3(.58,.28,.74), u_tension*0.65));
    vec3 keyC=mix(vec3(0.72,0.82,1.00), vec3(1.00,0.86,0.66), u_warmth);
    vec3 rimC=mix(vec3(0.28,0.48,1.00), vec3(1.00,0.46,0.28), u_valence);
    float NoL=max(0.,dot(n,L));
    float occ=calcAO(p,gn);
    float sha=(NoL>0.001)?calcSha(p,L):1.0;
    // diffuse body (fades out for metals) — occluded + self-shadowed.
    // Ambient is real environment irradiance (env sampled along the normal, fully rough)
    // rather than a flat constant: that is what makes unlit faces read as lit by a room.
    vec3 amb=env(n,1.0)*1.22;
    vec3 c=base*(1.-u_metal)*( keyC*(0.95*NoL*mix(0.35,1.0,sha))*mix(0.35,1.0,occ)
                             + amb*mix(0.22,1.0,occ) );
    // emotional rim: swells with epicness/arousal, colour from valence
    // the mood rim reads as a glossy edge on a matte surface, so it scales back with u_spec —
    // not to zero, because it is how the section's valence reaches the form at all.
    c+=rimC*pow(1.0-NoV,3.2)*(0.08+u_epic*0.34+u_arousal*0.12)*mix(0.4,1.0,occ)*mix(0.4,1.0,u_spec);
    // environment reflection (fresnel + textured roughness) — specular occlusion
    vec3 R=reflect(-v,n);
    // REFLECTION OCCLUSION. env() is sampled as if the whole room were visible from this
    // point, so concave areas reflect light the geometry actually blocks — which is what makes
    // chrome read as a thin shell instead of a solid object. March a short ray along R and
    // suppress the reflection where the form occludes itself.
    float rocc=1.0;
    { float tr=0.035;
      for(int i=0;i<10;i++){
        float hh=mapD(p+R*tr);
        if(hh<0.004){ rocc=0.0; break; }
        rocc=min(rocc,6.0*hh/tr); tr+=clamp(hh,0.03,0.35); if(tr>2.2) break; }
      rocc=clamp(rocc,0.,1.); }
    vec3 refl=env(R,rgh)*mix(0.22,1.0,rocc);
    // Schlick-with-roughness: the standard IBL Fresnel. The old pow(1-NoV,2.6) ramp ignored
    // roughness entirely, so a matte surface still lit a bright reflective rim and a polished
    // one never reached full grazing reflectance. Edge-on, smooth materials now go fully
    // mirror-like — that grazing sweep is most of what reads as "glossy" rather than "chalky".
    vec3 Fr=f0+(max(vec3(1.0-rgh),f0)-f0)*pow(1.0-NoV,5.0);
    c += refl*Fr*u_reflect*mix(0.45,1.0,occ);
    // Thin film TINTS THE REFLECTION — it does not add light. Adding it emissively is what
    // painted a saturated rim (green whenever the section's random hue landed there); a real
    // pearl shows its colour in what it reflects.
    c += (irid-vec3(0.5))*refl*f0*u_reflect*u_iridAmt*0.55*(1.0+u_hAir*0.5)*mix(0.45,1.0,occ);
    // TRANSMISSION (glass). What is not reflected goes THROUGH, so sample the environment along
    // the REFRACTED direction rather than adding a wash of white. This is the whole difference
    // between glass and a shiny pale ball: the background seen through the form bends, and the
    // bend is strongest where the surface turns away from the eye. Weighted by 1-Fresnel because
    // reflection and transmission share one energy budget — at grazing angles glass goes fully
    // mirror, which is exactly the cue that reads as a hard transparent shell.
    if(u_trans>0.001){
      vec3 Rt=refract(-v,n,0.667);                 // eta 1/1.5, ordinary glass
      float tir=dot(Rt,Rt);                        // zero on total internal reflection
      // INTERIOR MARCH — this is what gives the glass depth. Refracting once at the front surface
      // and reading the backdrop treats the form as an infinitely thin shell: it bends the view
      // but has no inside, which is why it read as a soap film. The field is NEGATIVE inside the
      // form, so -mapD is the distance to the boundary from within, and marching on that carries
      // the refracted ray to where it actually leaves.
      // Two things fall out of that and both are the "depth" being asked for:
      //   - THICKNESS. How far the ray travelled through the solid, which drives Beer-Lambert
      //     absorption below — thin edges stay clear, the body deepens in colour. This is the cue
      //     that says solid rather than hollow.
      //   - A SECOND REFRACTION. Real glass bends light twice, once entering and once leaving,
      //     and the exit bend is the larger of the two visually because it is where the ray is
      //     furthest from where it started.
      float thick=0.0; vec3 eR,eG,eB;
      if(tir>0.0001){
        vec3 rd2=normalize(Rt);
        vec3 q=p+rd2*0.012;
        // 18 steps and a tight threshold, after trying to cut it to 10 with a coarse one on the
        // theory that the exit NORMAL feeds a refraction rather than a silhouette and so needs
        // less precision. Measured on a frozen frame the cheap version scored HIGHER internal
        // structure — 6.67 against 5.20 — which is the trap: rays that stop before converging give
        // scattered exit normals, and scattered normals produce contrast that looks like detail
        // and is noise. It was not faster either. Precision here is not a quality knob to trade.
        for(int i=0;i<18;i++){
          float hh=-mapD(q);
          if(hh<0.004) break;
          float st=max(hh,0.012); q+=rd2*st; thick+=st;
          if(thick>4.0) break; }
        vec3 n2=-calcN(q);                         // boundary normal, flipped to face the ray
        // Dispersion applied at the EXIT surface, three etas off one march. Marching three times
        // would triple the cost of the most expensive material for a split that is dominated by
        // the exit bend anyway.
        eR=refract(rd2,n2,1.5*0.988); eG=refract(rd2,n2,1.5); eB=refract(rd2,n2,1.5*1.012);
        vec3 fb=reflect(rd2,n2);                   // total internal reflection at the exit
        eR=dot(eR,eR)>0.0001?normalize(eR):fb;
        eG=dot(eG,eG)>0.0001?normalize(eG):fb;
        eB=dot(eB,eB)>0.0001?normalize(eB):fb;
      } else { eR=R; eG=R; eB=R; }
      // Sample the BACKDROP along the refracted ray, not the lighting environment. env() is the
      // softbox rig that lights the form; what you actually see through glass is whatever is
      // behind it, so refracting env() produced a dark opaque blob with no relationship to the
      // scene. bg() is the same function the miss path uses, so the colour field genuinely bends
      // through the form and the shape reads as transparent rather than as dark plastic.
      // Dispersion costs ~12% of the glass frame, measured by collapsing it to one bg() call.
      vec3 through=vec3(bg(eR,uv).r, bg(eG,uv).g, bg(eB,uv).b);
      // BEER-LAMBERT. Absorption is exponential in path length, and it is the complement of the
      // glass colour that gets absorbed, so a thick path saturates toward that colour instead of
      // just going dark. u_absorb is per-material, so a future thicker or dirtier glass is a
      // number rather than another branch.
      vec3 att=exp(-(vec3(1.0)-clamp(base,0.,1.))*thick*u_absorb);
      float F=clamp(max(Fr.r,max(Fr.g,Fr.b)),0.,1.);
      c=mix(c, through*att*1.04, u_trans*(1.0-F));
    }
    // translucent backlight (frosted)
    c += base*max(0.,dot(n,-L))*0.18*u_transl;
    // emissive glow (neon) — high-band stabs flare it, desaturated so it cannot band
    c += base*fr*(u_emis*1.6+u_hHigh*0.30+u_hMid*0.16);
    // Direct specular: Cook-Torrance GGX (roughness still comes from the TEXTURED field, so the
    // lobe breaks up instead of reading as plastic). Blinn-Phong's pow(NoH,k) was the single
    // biggest "not a real render" cue here — its lobe has the wrong falloff and no geometry
    // term, so grazing angles under-brighten and the highlight never stretches the way a real
    // microfacet surface does. D*G/(4*NoV*NoL) * NoL collapses to D*G/(4*NoV).
    vec3 Hh=normalize(L+v);
    float NoH=max(0.,dot(n,Hh)), VoH=max(1e-4,dot(v,Hh));
    float a=max(1e-3,rgh*rgh), a2=a*a;
    float dnm=NoH*NoH*(a2-1.0)+1.0;
    float D=a2/(3.14159265*dnm*dnm);
    float kg=a*0.5;                                  // Smith height-correlated, Schlick-GGX form
    float G=(NoV/(NoV*(1.0-kg)+kg))*(NoL/(NoL*(1.0-kg)+kg));
    vec3  Fs=f0+(1.0-f0)*pow(1.0-VoH,5.0);
    // D explodes as roughness -> 0 (a mirror lit by a point light is a singularity). Clamp the
    // lobe, or a smooth material fires single-pixel white sparks that bloom into blown blobs.
    vec3 spec=min(Fs*(D*G/(4.0*NoV)), vec3(24.0));
    // u_spec gates the DIRECT lobe separately from u_reflect. Dropping reflect to zero only
    // removes the environment reflection; this term keeps a 0.35 floor, so a material asked to
    // be free of reflections still carried a highlight. Clay sets it to zero.
    c += keyC*spec*(0.35+u_reflect*0.7)*u_spec*sha*mix(0.5,1.0,occ);
    col=c;
  }
  // aerial fade: dissolve the form into the fluid background (holistic, professional)
  // the floor dissolves into the backdrop well beyond the subject: no visible horizon line,
  // which is what sells a seamless cyclorama rather than 'object on a plane'
  // Only the form is left to fade, so the floor's separate range is gone with it.
  // AERIAL FADE starts BEYOND the subject. The form sits at t~3..6, so a fade opening at 3.0
  // was mixing the backdrop straight into it — measurably ~15-20% darker and tinted toward the
  // background colour. That is the rendering quality bleeding away into whatever is behind it.
  // Opening at 6.5 leaves the subject untouched while distant floor still dissolves completely.
  // ONLY for rays that hit something. On a miss col IS the background already, and running the
  // fade there overwrote the shadow catcher's work with an unshadowed copy of the backdrop.
  if(mid>=0.0) col=mix(col, back, smoothstep(6.5,15.0,t));
  o=vec4(max(col,0.), t);        // alpha carries scene depth -> the post pass builds DOF from it
}`;

const BRIGHT=`#version 300 es
precision highp float;
out vec4 o;
uniform sampler2D u_tex; uniform vec2 u_res, u_src; uniform float u_thr;
vec3 bp(vec3 c,float thr){                       // soft-knee bright pass on a LINEAR HDR value
  float l=dot(c,vec3(.2126,.7152,.0722));
  float k=max(0.,l-thr); k=k*k/(k+0.5);
  return c*(k/max(l,1e-4));
}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res, t=u_src*0.5;
  // Threshold each tap BEFORE averaging. Thresholding blurred samples (what sampling the mip
  // chain directly did) lets a small, very bright highlight average below the threshold and
  // vanish — so specular pinpoints never bloomed, which is what made highlights read as bright
  // pixels rather than as light.
  o=vec4((bp(texture(u_tex,uv+vec2(-t.x,-t.y)).rgb,u_thr)
         +bp(texture(u_tex,uv+vec2( t.x,-t.y)).rgb,u_thr)
         +bp(texture(u_tex,uv+vec2(-t.x, t.y)).rgb,u_thr)
         +bp(texture(u_tex,uv+vec2( t.x, t.y)).rgb,u_thr))*0.25, 1.);
}`;

const POST=`#version 300 es
precision highp float;
out vec4 o;
uniform sampler2D u_tex, u_brt; uniform vec2 u_res, u_texel;
uniform float u_time,u_bloom,u_sat,u_vig,u_expo,u_contrast,u_grain,u_flash;
uniform float u_mip,u_sharpen,u_chroma,u_ink,u_poster,u_dither,u_half,u_ss,u_ssRatio;
uniform float u_dbg;
uniform vec3 u_inkA,u_inkB;
float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
float lum(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
vec3 fxaa(vec2 uv,vec2 r){
  vec3 nw=texture(u_tex,uv+vec2(-1,-1)*r).rgb,ne=texture(u_tex,uv+vec2(1,-1)*r).rgb;
  vec3 sw=texture(u_tex,uv+vec2(-1,1)*r).rgb,se=texture(u_tex,uv+vec2(1,1)*r).rgb,m=texture(u_tex,uv).rgb;
  float lnw=luma(nw),lne=luma(ne),lsw=luma(sw),lse=luma(se),lm=luma(m);
  float lmin=min(lm,min(min(lnw,lne),min(lsw,lse))),lmax=max(lm,max(max(lnw,lne),max(lsw,lse)));
  vec2 dir=vec2(-((lnw+lne)-(lsw+lse)),((lnw+lsw)-(lne+lse)));
  float red=max((lnw+lne+lsw+lse)*0.03125,0.0078125);
  float rd=1.0/(min(abs(dir.x),abs(dir.y))+red);
  dir=clamp(dir*rd,-8.,8.)*r;
  vec3 a=0.5*(texture(u_tex,uv+dir*(1.0/3.0-0.5)).rgb+texture(u_tex,uv+dir*(2.0/3.0-0.5)).rgb);
  vec3 b=a*0.5+0.25*(texture(u_tex,uv+dir*(-0.5)).rgb+texture(u_tex,uv+dir*0.5).rgb);
  float lb=luma(b); return (lb<lmin||lb>lmax)?a:b;
}
float r2(vec2 p){return fract(dot(p,vec2(0.7548776662,0.5698402909)));}
// Bloom now reads an ALREADY-thresholded buffer, so this is a pure gather: wide, soft, and
// energy-preserving. No knee here — doing it per mip sample was the bug.
vec3 bloom(vec2 uv,vec2 t){
  if(u_mip>0.5){
    // Tap weights left alone deliberately. Shifting weight off the tightest mip (1.2 -> 2.4 and
    // friends) to move the glow from an outline to a broad lift was TRIED AND MEASURED, and it
    // made the halo more than twice as bad: near-edge excess 11.8 -> 25.1 at a fixed threshold.
    // A wider tap gathers from a much larger area of a large bright subject, so it deposits more
    // energy everywhere including the bands right next to the silhouette. The threshold, not the
    // tap radius, is the lever that controls how much of the form enters the bloom at all.
    return textureLod(u_brt,uv,1.2).rgb*0.42
         + textureLod(u_brt,uv,3.0).rgb*0.34
         + textureLod(u_brt,uv,5.0).rgb*0.24; }   // 3 taps, same total weight
  vec3 sum=vec3(0.); float w=0.;

    vec2 of=vec2(float(i),float(j)); float g=exp(-dot(of,of)*.22);

}
const float BAY[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
float bayer(vec2 p){ivec2 i=ivec2(mod(p,4.0));return BAY[i.y*4+i.x]/16.0-0.46875;}
mat2 rot2(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
// two-ink separation ramp: paper black -> ink A -> ink B -> blown white
vec3 duo(float l){
  vec3 sh=vec3(0.012,0.012,0.017);
  vec3 c=(l<0.5)?mix(sh,u_inkA,l*2.0):mix(u_inkA,u_inkB,(l-0.5)*2.0);

void main(){
  vec2 uv=gl_FragCoord.xy/u_res,t=u_texel;      // offsets in SOURCE texels so AA/sharpen actually bite
  // DBGMASK: output the depth-derived silhouette instead of the image. Edge artefacts have to be
  // measured against the EXACT silhouette, not one guessed from luminance, or the measurement
  // inherits the very halo it is trying to find.
  if(u_dbg>0.5){ o=vec4(vec3(texture(u_tex,uv).a<17.0?1.0:0.0),1.0); return; }
  vec3 col;
  if(u_ss>0.5){                                 // supersampled: resolve real samples with a 4-tap tent
    // Footprint must match the RATIO. One output pixel covers u_ssRatio source texels, so taps
    // at a fixed +/-0.5 source texel only ever filtered a 1-texel window and left most of the
    // extra samples outside the kernel — paying for supersampling without collecting it.
    vec2 h=t*0.5*u_ssRatio;
    col=(texture(u_tex,uv+vec2(-h.x,-h.y)).rgb+texture(u_tex,uv+vec2(h.x,-h.y)).rgb

  } else col=fxaa(uv,t);

  // the user kept reporting around the silhouette. Ablating it and differencing frames on a frozen
  // camera, by distance from the exact depth-derived silhouette:
  //     1-6px  RMS 9.06   6-14px RMS 6.66   14-25px RMS 1.10   25-60px RMS 0.14   60+ RMS 0.13
  // Beyond 25px it moved the image by an eighth of one 8-bit level, in BOTH scenes (studio: 0.08).
  // The reason is structural: this is a mip-tap defocus, and both backdrops are smooth — the fluid
  // colour field is low-frequency by construction and the studio cyclorama is a gradient. Blurring
  // smooth content is a no-op, so the only thing in reach of the blur kernel with any contrast in
  // it was the subject, and every visible pixel DOF produced was subject colour smeared outward.
  // The depth-aware rejection added earlier cut that down but could not remove it: it tests the
  // MIP-AVERAGED depth, and by ~10px out that average has settled to background depth while the
  // mip texel still carries subject energy gathered from a wide neighbourhood. A mip cannot be
  // un-averaged after the fact; fixing this properly means a per-tap-rejected gather, which is
  // real cost for an effect measured at 0.13/255 of actual defocus. So it goes.
  if(u_chroma>0.001){                            // misregistration / lens split
    vec2 d=uv-0.5; float k=u_chroma*0.007*(0.25+dot(d,d)*3.0);
    col.r=texture(u_tex,uv+d*k).r; col.b=texture(u_tex,uv-d*k).b; }
  if(u_sharpen>0.001 && u_ss<0.5){               // only when NOT supersampled: real samples
                                                 // are already crisp, and sharpening them just
                                                 // paints coloured halos along every silhouette
    vec3 n=texture(u_tex,uv+vec2(0,t.y)).rgb,s=texture(u_tex,uv-vec2(0,t.y)).rgb;
    vec3 e=texture(u_tex,uv+vec2(t.x,0)).rgb,w=texture(u_tex,uv-vec2(t.x,0)).rgb;
    // clamp to the neighbourhood (contrast-adaptive): an unclamped unsharp mask overshoots
    // into a coloured halo along every silhouette
    vec3 mn=min(min(n,s),min(e,w)), mx=max(max(n,s),max(e,w));
    col=clamp(col+(col-(n+s+e+w)*0.25)*u_sharpen, min(col,mn), max(col,mx)); }
  vec2 c2=uv-.5;c2.x*=u_res.x/u_res.y;
  col+=bloom(uv,t)*u_bloom;
  col*=u_expo*(1.0+u_flash);
  mat3 ai=mat3(.59719,.07600,.02840,.35458,.90834,.13383,.04823,.01566,.83777);
  mat3 ao=mat3(1.60475,-.10208,-.00327,-.53108,1.10813,-.07276,-.07367,-.00605,1.07602);
  col=ai*col;col=(col*(col+.0245786)-.000090537)/(col*(.983729*col+.4329510)+.238081);col=ao*col;
  col=clamp(col,0.,1.);
  float l=dot(col,vec3(.2126,.7152,.0722));col=mix(vec3(l),col,u_sat);
  col=(col-.5)*(0.92+u_contrast*0.4)+.5;col=clamp(col,0.,1.);
  col=mix(col*12.92,1.055*pow(max(col,1e-5),vec3(1./2.4))-.055,step(.0031308,col));
  /* ---- print separation grade (done in display space, like a real press) ---- */
  if(u_ink>0.001) col=mix(col,duo(lum(col)),u_ink);
  if(u_half>0.001){                              // rotated dot screen
    vec2 hp=rot2(0.45)*gl_FragCoord.xy*1.0472;
    float scr=(sin(hp.x)*sin(hp.y))*0.5+0.5;
    float li=lum(col);
    vec3 ink=mix(vec3(0.012,0.012,0.017),col,smoothstep(scr-0.30,scr+0.30,li));
    col=mix(col,ink,u_half); }

  gl.uniform1f(US('u_svgOn'),svgOn&&svgTex?1:0);
  // depth and bevel breathe with the music like every other form here
  gl.uniform1f(US('u_svgDepth'),0.17+energy*0.05+HITS.low*0.04);
  gl.uniform1f(US('u_svgBevel'),0.014+HITS.air*0.006);
  gl.uniform1f(US('u_gTwist'), tension*1.25+arousal*0.45+Math.sin(time*0.05)*0.12);
  // element count / lattice density — energy packs the structure tighter
  gl.uniform1f(US('u_gDense'), energy*1.9+BND.high*0.5+SH.count*0.05);
  // member thickness — tension thins the structure until it reads fragile
  gl.uniform1f(US('u_gThick'), Math.max(0.0, 0.75-tension*0.55+SH.thick*0.9));
  // aperture size — valence opens the shell up, darkness closes it in
  gl.uniform1f(US('u_gCut'), Math.max(0.0, 0.25+valence*0.8-darkness*0.35));
  gl.uniform3f(US('u_bgA'),BGA[0],BGA[1],BGA[2]); gl.uniform3f(US('u_bgB'),BGB[0],BGB[1],BGB[2]);
  gl.uniform1f(US('u_bgAuto'),palAuto?1:0); gl.uniform1f(US('u_scene'),scene);
  gl.uniform1f(US('u_groundY'),groundY);
  // brighter, more positive sections separate further into two colourways
  gl.uniform1f(US('u_twoTone'), 0.30+valence*0.45+epic*0.15);
  gl.uniform1f(US('u_twA'),twA); gl.uniform1f(US('u_twB'),twB);
  gl.uniform1f(US('u_twMix'), twMix>0 ? twMix*twMix*(3-2*twMix) : 0);
  gl.uniform1f(US('u_darkness'),darkness);
  gl.uniform1f(US('u_env'),1.0-darkness*0.5);
  gl.uniform1f(US('u_metal'),MAT.metal); gl.uniform1f(US('u_rough'),MAT.rough); gl.uniform1f(US('u_reflect'),MAT.reflect);
  gl.uniform1f(US('u_iridAmt'),MAT.irid*(0.7+0.3*bright)); gl.uniform1f(US('u_transl'),MAT.transl); gl.uniform1f(US('u_emis'),MAT.emis);
  gl.uniform1f(US('u_trans'),MAT.trans);
  gl.uniform1f(US('u_spec'),MAT.spec);
  gl.uniform1f(US('u_alb'),MAT.alb); gl.uniform1f(US('u_absorb'),MAT.absorb);
  gl.uniform1f(US('u_txScale'),MAT.tscale); gl.uniform1f(US('u_txAmp'),MAT.tamp);
  gl.uniform1f(US('u_txAniso'),MAT.taniso); gl.uniform1f(US('u_txRough'),MAT.trough);
  drawFS(aScene);

  if(floatOK){
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,hdrT);
    if(mipOK) gl.generateMipmap(gl.TEXTURE_2D);          // hdr mips feed depth of field
    // BRIGHT PASS -> half res, thresholded, then mipped. Bloom gathers from this.
    gl.useProgram(brightP); gl.bindFramebuffer(gl.FRAMEBUFFER,brtF); gl.viewport(0,0,BW,BH);
    gl.uniform1i(UB('u_tex'),0); gl.uniform2f(UB('u_res'),BW,BH); gl.uniform2f(UB('u_src'),1/RW,1/RH);
    // threshold tracks exposure, so bloom picks up what will actually blow out after tonemapping
    // BLOOM THRESHOLD, raised 2.6x. At the old threshold most of a lit pearl body cleared the
    // knee, so the bloom source was the whole form and what it drew was an outline traced around
    // the silhouette — the glow the user reported. Measured against an exact depth-derived
    // silhouette, near-edge excess (2-12px) fell 11.8 -> 1.5 over the background gradient, an 87%
    // cut, while mean luminance INSIDE the silhouette moved 154.2 -> 153.4. Bloom's entire visible
    // output was the ring; raising the threshold costs essentially nothing on the form itself and
    // leaves genuine speculars, which sit far above the knee, still blooming.
    gl.uniform1f(UB('u_thr'), DX.thr*2.6*0.95/Math.max(0.35, 0.82+energy*0.45+pulseS*0.12+HITS.low*0.10));
    drawFS(aBright);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,brtT);
    if(mipOK) gl.generateMipmap(gl.TEXTURE_2D);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,hdrT);
    gl.useProgram(postP); gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
    gl.uniform1i(UP('u_tex'),0); gl.uniform1i(UP('u_brt'),1);
    gl.uniform2f(UP('u_res'),W,H); gl.uniform1f(UP('u_time'),time);
    gl.uniform2f(UP('u_texel'),1/RW,1/RH); gl.uniform1f(UP('u_mip'),mipOK?1:0);
    gl.uniform1f(UP('u_ss'),rscale>1.05?1:0);
    gl.uniform1f(UP('u_ssRatio'),rscale);
    // focus on the form itself; everything behind it falls away into a soft wash
    gl.uniform1f(UP('u_dbg'),window.DBGMASK?1:0);
    // underground grade: darker, grittier, higher contrast
    gl.uniform1f(UP('u_bloom'),(0.34+energy*0.6+pulseS*0.24+HITS.high*0.22+HITS.air*0.14)*DX.bloom);
    gl.uniform1f(UP('u_sat'),0.82+valence*0.25+LK.sat);
    gl.uniform1f(UP('u_vig'),0.75+darkness*0.35);
    gl.uniform1f(UP('u_expo'),0.82+energy*0.45+pulseS*0.12+HITS.low*0.10);
    gl.uniform1f(UP('u_contrast'),0.45+tension*0.30+LK.contrast); gl.uniform1f(UP('u_grain'),(0.35+darkness*0.30)*LK.grain);
    gl.uniform1f(UP('u_flash'),Math.max(flashV,flash*0.8));
    // press grade
    gl.uniform1f(UP('u_sharpen'),LK.sharp*DX.sharpen); gl.uniform1f(UP('u_chroma'),LK.chroma*DX.chroma);
    gl.uniform1f(UP('u_ink'),LK.ink); gl.uniform1f(UP('u_poster'),LK.poster);
    gl.uniform1f(UP('u_dither'),LK.dither); gl.uniform1f(UP('u_half'),LK.half);
    const iA=inkA(), iB=inkB();
    gl.uniform3f(UP('u_inkA'),iA[0],iA[1],iA[2]); gl.uniform3f(UP('u_inkB'),iB[0],iB[1],iB[2]);
    drawFS(aPost);
    // Grab MUST happen here, still inside the frame that drew. The context has no
    // preserveDrawingBuffer (it costs a full-size copy every frame), so the drawing buffer is
    // cleared as soon as the browser composites — calling toBlob() from a click handler returns
    // a blank image. Setting a flag and servicing it at the end of the draw is what makes the
    // capture land on real pixels.
    if(shotPending){ shotPending=false; grabFrame(); }
  }
}
