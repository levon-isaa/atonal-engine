# nginx in front of Rota: TLS, request limits and slow-client timeouts. server.py is a standard-
# library HTTP server and expects all of this to be done before a request reaches it. See DEPLOY.md.

# Public pages and free-time lookups: generous, a client clicks around a lot.
limit_req_zone $binary_remote_addr zone=rota_public:10m rate=10r/s;
# Booking, cancelling, moving and signing in: a person does these a handful of times.
limit_req_zone $binary_remote_addr zone=rota_write:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=rota_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name book.example.am;               # <-- your domain
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25+. On older nginx (Ubuntu 22.04 ships 1.18) delete this line and use `listen 443 ssl http2;`.
    http2 on;
    server_name book.example.am;               # <-- your domain

    ssl_certificate     /etc/letsencrypt/live/book.example.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/book.example.am/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_header_timeout 15s;
    client_body_timeout   15s;
    send_timeout          30s;
    client_max_body_size  64k;                 # matches MAX_BODY in server.py
    limit_conn rota_conn 20;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;   # ROTA_TRUST_PROXY=1 makes the app read this
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /api/public/bookings {
        limit_req zone=rota_write burst=5 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }
    location ~ ^/api/public/bookings/[^/]+/(cancel|reschedule)$ {
        limit_req zone=rota_write burst=5 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }
    location = /api/auth/login {
        limit_req zone=rota_write burst=5 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }
    location / {
        limit_req zone=rota_public burst=40 nodelay;
        proxy_pass http://127.0.0.1:8780;
    }
}
