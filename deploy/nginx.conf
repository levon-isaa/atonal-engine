# nginx in front of the ATONAL server. This is where TLS, the body cap, the slow-client
# timeouts and rate limiting live -- server.py is a stdlib http.server and is not the right
# place for any of them. See DEPLOY.md.

# One bucket per client IP. /analyze is expensive and serialised, so the limit is about keeping
# the QUEUE honest rather than the CPU safe; burst lets a page's own few calls through.
limit_req_zone $binary_remote_addr zone=atonal_api:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=atonal_gen:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=atonal_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name atonal.example;            # <-- your domain
    # certbot writes its challenge here; everything else goes to https.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25 and newer. On 1.18 (Ubuntu 22.04) this directive does not exist and nginx
    # refuses to start -- delete the line and write `listen 443 ssl http2;` above instead.
    # `nginx -t` tells you which you have before anything goes down.
    http2 on;
    server_name atonal.example;            # <-- your domain

    ssl_certificate     /etc/letsencrypt/live/atonal.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atonal.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SLOW CLIENTS. A half-open connection used to hold a server thread indefinitely; server.py
    # now has its own socket timeout, and these stop it reaching the application at all.
    client_header_timeout 15s;
    client_body_timeout   60s;
    send_timeout          60s;
    limit_conn atonal_conn 16;

    # Match server.py's MAX_UPLOAD. If you raise one, raise the other, or the two disagree about
    # who refuses an oversize file and the customer gets nginx's HTML instead of the JSON the
    # viewer knows how to show.
    client_max_body_size 300m;
    client_body_buffer_size 1m;

    location / {
        limit_req zone=atonal_gen burst=40 nodelay;
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The free tier counts per IP, and behind a proxy this header is the only real client
        # address. server.py reads it ONLY when ATONAL_TRUST_PROXY is set -- set it, or every
        # visitor shares one bucket and the free tier becomes two analyses a day for the whole
        # internet.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /analyze {
        limit_req zone=atonal_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 300m;
        # AN ANALYSIS CAN QUEUE. One runs at a time and a long track is minutes, so a short read
        # timeout here shows the customer a 504 for work that is still running and will still be
        # charged. This has to be longer than the worst queue wait you are willing to serve.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering on;
    }

    # Paddle posts here and signs the RAW body. Buffering is fine; rewriting is not.
    location /webhook {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
